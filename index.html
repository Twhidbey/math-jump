<title>Math Ninja</title>
<style>

    font-family: "Lilita One", Nunito, "Trebuchet MS", sans-serif; font-weight: 400; letter-spacing: .5px; }
  /* world map */
  .worlds { width: min(720px, 100%); }
  .zone { position: relative; border-radius: 18px; padding: 8px 10px 4px; margin: 8px 0; overflow: hidden; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }

  .node:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.08); }
  .node:active:not(:disabled) { transform: translate(-50%, -45%) scale(.94); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .node .nl { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; width: max-content; max-width: min(116px, 23vw); text-align: center; line-height: 1.15; font-size: 12px; font-weight: 900;

  .node { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  @media (max-width: 500px) { .node.boss .nl { display: none; } .node .nl { font-size: 11px; } }

  .node .kai { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: -4px; image-rendering: pixelated; animation: hop .9s ease-in-out infinite; }

<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VH = 540, T = 36, ROWS = 15, GR = 13;   // GR = first ground row
let VW = 960;                                 // 540 when the screen is taller than wide

// ---------------------------------------------------------------- helpers
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const R = (a, b) => ri(Math.random, a, b);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = R(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
const hash = i => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
const mk = (a, op, b, ans) => ({ a, op, b, ans, text: `${a} ${op} ${b}` });

// ---------------------------------------------------------------- story & worlds
const STORY = `Long ago, Sensei guarded four Magic Math Scrolls at the mountain dojo. One stormy night,
  the evil <b>Shadow Shogun</b> crept in and stole them all! He gave each scroll to one of his bosses to guard.
  <br><br>You are Sensei's bravest young ninja. Run through four worlds, collect the torn scroll pieces,
  solve the math gates, and beat the bosses to bring the scrolls home!`;
const ENDING = `The Shadow Shogun is beaten, and all four Magic Math Scrolls are back at the dojo!
  <br><br>Sensei bows low: <i>"You are a true Math Ninja."</i>`;

const WORLDS = [
  { key: 'japan', name: 'Japan Village', scroll: 'Scroll of Adding', walker: 'ninja', pit: 'water', flag: '#e63946',
    skies: [['#7cc6ff', '#ffe3ef'], ['#ff9a8b', '#ffe0b5'], ['#6fb4f0', '#ffd6e8']],
    brick: ['#c0392b', '#7b1f16'], pipe: ['#7cb342', '#33691e', '#c5e1a5'], stair: ['#b0794a', '#6e4627', '#d8a679'],
    gate: ['#d63a2f', '#7b1610', '#ff8a7a', '#ffd23f'], dojo: ['#f1e0c5', '#7b1610', '#3a2a20'],
    intro: `The Shogun's bandit ninjas are hiding in the cherry blossom village. Their leader, <b>Kage the Shadow Blade</b>, is guarding the Scroll of Adding.`,
    boss: { kind: 'kage', name: 'Kage the Shadow Blade', hp: 5, taunt: 'No one gets past my blade... unless they can add!' } },
  { key: 'lava', name: 'Lava Volcano', scroll: 'Scroll of Taking Away', walker: 'rock', pit: 'lava', flag: '#ff8c1a',
    skies: [['#1a0505', '#7a1f0a'], ['#2a0707', '#9a3a0a'], ['#150303', '#6b1a0a']],
    brick: ['#5a3a34', '#2a1a16'], pipe: ['#4a3530', '#241815', '#7a5a50'], stair: ['#4b3a36', '#221816', '#6e5a54'],
    gate: ['#2a1a1a', '#0d0606', '#ff6a00', '#ff8c1a'], dojo: ['#3a2a26', '#1a0d0a', '#ff6a00'],
    intro: `Deep inside the volcano, rock monsters stomp around and lava blobs leap out of the fire. The <b>Magma Golem</b> is guarding the Scroll of Taking Away.`,
    boss: { kind: 'golem', name: 'Magma Golem', hp: 6, taunt: 'ROCK SMASH! You will never take away my scroll!' } },
  { key: 'robot', name: 'Robot Factory', scroll: 'Scroll of Times', walker: 'robot', pit: 'void', flag: '#4cc9f0',
    skies: [['#1c2533', '#3b4a5e'], ['#2a1c24', '#5e3b46'], ['#16202c', '#334255']],
    brick: ['#6c7a89', '#3b4552'], pipe: ['#8395a7', '#4a5868', '#c8d3de'], stair: ['#5d6d7e', '#2f3846', '#95a5b6'],
    gate: ['#2c3e50', '#141d26', '#4cc9f0', '#4cc9f0'], dojo: ['#5d6d7e', '#2f3846', '#4cc9f0'],
    intro: `The Shogun built a giant factory full of marching robots. <b>Mega-Bot 3000</b> is guarding the Scroll of Times.`,
    boss: { kind: 'bot', name: 'Mega-Bot 3000', hp: 7, taunt: 'BEEP BOOP. CALCULATING... YOUR DEFEAT.' } },
  { key: 'castle', name: 'Night Castle', scroll: 'Scroll of Sharing', walker: 'shadow', pit: 'void', flag: '#b388ff',
    skies: [['#070b24', '#1f2a5a'], ['#0a0820', '#2a1f5a'], ['#05071a', '#1a1f48']],
    brick: ['#4a4f7a', '#252845'], pipe: ['#6b4a35', '#3a2618', '#9a7050'], stair: ['#3c4470', '#1c2140', '#5a64a0'],
    gate: ['#4b2a6b', '#22113a', '#a678ff', '#ffd23f'], dojo: ['#2a3152', '#141830', '#ffd23f'],
    intro: `This is it: the Shadow Shogun's castle! Shadow ninjas guard the rooftops, and the <b>Shogun</b> has the last scroll, the Scroll of Sharing.`,
    boss: { kind: 'shogun', name: 'The Shadow Shogun', hp: 8, taunt: 'So, little ninja, you made it this far. Is your math strong enough?' } },
];

// ---------------------------------------------------------------- math skills
// Each skill is one consistent family of problems (like a times table). Any level can use any skill.
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
// Deals every problem in the family once, in a shuffled order, before repeating,
// and never repeats one of the last few problems across a reshuffle.
const deck = make => {
  let pile = [], recent = [];
  const g = () => {
    if (!pile.length) pile = shuffle(make());
    const size = make().length;
    const key = q => (q.op === '×' ? [q.a, q.b].sort((x, y) => x - y).join('×') : q.text);   // 7 × 5 and 5 × 7 are the same fact
    let i = pile.length - 1;
    while (i > 0 && recent.includes(key(pile[i]))) i--;
    const q = pile.splice(i, 1)[0];
    recent = [key(q), ...recent].slice(0, Math.max(1, Math.min(8, size - 2)));
    return { ...q };
  };
  g.all = make;
  return g;
};
const pairs = (as, bs, ok) => as.flatMap(a => bs.filter(b => ok(a, b)).map(b => [a, b]));
const plus = (a, b) => mk(a, '+', b, a + b), minus = (a, b) => mk(a, '−', b, a - b);
const tens = q => ({ ...q, step: 10 });
const times = (n, k) => (R(0, 1) ? mk(n, '×', k, n * k) : mk(k, '×', n, n * k));
const table = n => deck(() => range(2, n > 10 ? 12 : 10).map(k => times(n, k)));
const divTable = n => deck(() => range(2, n > 10 ? 12 : 10).map(k => mk(n * k, '÷', n, k)));
const SKILLS = [
  { cat: 'add', id: 'add5', name: 'Add within 5', ex: '2 + 3', tier: 1, gen: deck(() => pairs(range(1, 4), range(1, 4), (a, b) => a + b <= 5).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'add10', name: 'Add within 10', ex: '4 + 5', tier: 1, gen: deck(() => pairs(range(1, 9), range(1, 9), (a, b) => a + b <= 10 && a + b > 3).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'make10', name: 'Make 10', ex: '7 + ? = 10', tier: 1, gen: deck(() => range(1, 9).map(a => ({ a, b: 10 - a, op: '+', ans: 10 - a, missing: true, text: `${a} + ? = 10` }))) },
  { cat: 'add', id: 'add20', name: 'Add within 20', ex: '8 + 7', tier: 2, gen: deck(() => pairs(range(2, 12), range(2, 12), (a, b) => a + b > 10 && a + b <= 20).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'addtens', name: 'Add tens', ex: '30 + 40', tier: 2, gen: deck(() => pairs(range(1, 8), range(1, 8), (a, b) => a + b <= 10).map(([a, b]) => tens(plus(a * 10, b * 10)))) },
  { cat: 'add', id: 'add2d1d', name: '2-digit + 1-digit', ex: '47 + 5', tier: 3, gen: () => plus(R(11, 89), R(2, 9)) },
  { cat: 'add', id: 'add2d', name: '2-digit + 2-digit', ex: '36 + 47', tier: 4, gen: () => { const a = R(11, 79); return plus(a, R(11, 99 - a)); } },
  { cat: 'sub', id: 'sub10', name: 'Take away within 10', ex: '9 − 4', tier: 1, gen: deck(() => pairs(range(2, 10), range(1, 9), (a, b) => b < a).map(([a, b]) => minus(a, b))) },
  { cat: 'sub', id: 'sub20', name: 'Take away within 20', ex: '15 − 7', tier: 2, gen: deck(() => pairs(range(11, 18), range(2, 9), (a, b) => a - b <= 10).map(([a, b]) => minus(a, b))) },
  { cat: 'sub', id: 'subtens', name: 'Take away tens', ex: '70 − 30', tier: 2, gen: deck(() => pairs(range(2, 10), range(1, 9), (a, b) => b < a).map(([a, b]) => tens(minus(a * 10, b * 10)))) },
  { cat: 'sub', id: 'sub2d1d', name: '2-digit − 1-digit', ex: '43 − 6', tier: 3, gen: () => minus(R(20, 99), R(2, 9)) },
  { cat: 'sub', id: 'sub2d', name: '2-digit − 2-digit', ex: '72 − 38', tier: 4, gen: () => { const a = R(30, 99); return minus(a, R(11, a - 10)); } },
  ...[2, 5, 10, 3, 4, 11, 6, 7, 8, 9, 12].map(n => ({ cat: 'mul', id: 'x' + n, name: `Times ${n}`, ex: `${n} × 4`, tier: [2, 5, 10].includes(n) ? 2 : [3, 4, 11].includes(n) ? 3 : 4, gen: table(n) })),
  { cat: 'mul', id: 'xmix25', name: 'Times 2 to 5', ex: '4 × 7', tier: 3, gen: deck(() => pairs(range(2, 5), range(2, 10), () => true).map(([n, k]) => times(n, k))) },
  { cat: 'mul', id: 'xmix69', name: 'Times 6 to 9', ex: '8 × 6', tier: 4, gen: deck(() => pairs(range(6, 9), range(2, 10), () => true).map(([n, k]) => times(n, k))) },
  { cat: 'mul', id: 'xtens', name: 'Times tens', ex: '3 × 40', tier: 4, gen: deck(() => pairs(range(2, 9), range(2, 9), () => true).map(([a, b]) => tens(mk(a, '×', b * 10, a * b * 10)))) },
  { cat: 'mul', id: 'xall', name: 'All times tables', ex: '7 × 12', tier: 5, gen: () => times(R(2, 12), R(2, 12)) },
  ...[2, 5, 10, 3, 4, 6, 7, 8, 9].map(n => ({ cat: 'div', id: 'd' + n, name: `Divide by ${n}`, ex: `${n * 6} ÷ ${n}`, tier: [2, 5, 10, 3, 4].includes(n) ? 3 : 4, gen: divTable(n) })),
  { cat: 'div', id: 'dmix', name: 'All division', ex: '56 ÷ 8', tier: 5, gen: () => { const n = R(2, 10); return mk(n * R(1, 10), '÷', n, 0); } },
];
// Think: the same facts turned around, so kids reason about them instead of just recalling.
// Each question carries its own tip and picture for Sensei.
const blank = (text, ans, extra) => ({ missing: true, text, ans, a: 0, b: 0, op: 'think', ...extra });
const thinkMissAdd = deck(() => [
  ...pairs(range(2, 10), range(2, 10), (a, b) => a + b <= 20 && a + b >= 6).flatMap(([a, b]) => [
    blank(`${a} + ? = ${a + b}`, b, { tip: `Start at ${a} and count up to ${a + b}. How many jumps? ${b}.`, pic: { k: 'frames', red: a, ghost: b } }),
    blank(`? + ${b} = ${a + b}`, a, { tip: `What goes with ${b} to make ${a + b}? ${a + b} − ${b} = ${a}.`, pic: { k: 'frames', ghost: a, red: b } })]),
  ...pairs(range(6, 18), range(2, 9), (a, b) => b < a && a - b <= 10).map(([a, b]) =>
    blank(`${a} − ? = ${a - b}`, b, { tip: `Count up from ${a - b} to ${a}. That's ${b}.`, pic: { k: 'frames', red: a - b, ghost: b } })),
]);
const thinkSkip = deck(() => [2, 3, 5, 10].flatMap(st => range(0, 5).map(k => {
  const seq = [1, 2, 3, 4].map(i => st * (k + i)), hole = [1, 2, 3, 3][R(0, 3)];
  return blank(seq.map((v, i) => (i === hole ? '?' : v)).join(', '), seq[hole], { step: st, tip: `Count by ${st}s: each number is ${st} more than the one before.`, pic: { k: 'line', seq, hole } });
})));
const thinkBal = deck(() => pairs(range(2, 12), range(2, 9), (a, b) => a + b <= 20).flatMap(([a, b]) => {
  const c = R(2, a + b - 2); if (c === a || c === b) return [];

// ---------------------------------------------------------------- sprites
// Characters are drawn with simple shapes on a small pixel grid, get a 1px dark outline automatically,
// and are baked to canvases at 3x for the game.
const OUTLINE = '#120f1a', PX = 3;
function makeFrames(w, h, pal, draw, count) {
  const frames = [];
  for (let f = 0; f < count; f++) {
    const g = Array.from({ length: h }, () => Array(w).fill(null));
    const inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h;
    const P = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (inb(x, y)) g[y][x] = c; };
    const R = (x, y, ww, hh, c) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) P(x + i, y + j, c); };
    const E = (cx, cy, rx, ry, c) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1) g[y][x] = c;
      }
    };
    const L = (x0, y0, x1, y1, c) => {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
      for (let i = 0; i <= n; i++) P(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c);
    };
    draw({ P, R, E, L }, f);
    const out = g.map(r => r.slice());
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (g[y][x]) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inb(x + dx, y + dy) && g[y + dy][x + dx] && g[y + dy][x + dx] !== 'k')) out[y][x] = 'k';
    }
    frames.push(out);
  }
  return { w, h, pal: { k: OUTLINE, ...pal }, frames };
}
// Bakes each frame (and its mirror) to a canvas, and records where the feet and the middle are,
// so a sprite can be lined up with its hitbox whichever way it faces.
function bake(sheet, names, px = PX) {
  const { w, h, pal, frames } = sheet;
  let minX = w, maxX = 0, bottom = 0;
  frames[0].forEach((row, y) => row.forEach((k, x) => { if (k) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); bottom = Math.max(bottom, y + 1); } }));
  const out = { cx: (minX + maxX + 1) / 2 * px, cxFlip: (w - (minX + maxX + 1) / 2) * px, bottom: bottom * px };
  frames.forEach((g, i) => {
    out[names[i]] = [false, true].map(flip => {
      const c = document.createElement('canvas'); c.width = w * px; c.height = h * px;
      const x = c.getContext('2d');
      g.forEach((row, ry) => row.forEach((k, rx) => {
        if (!k) return;
        x.fillStyle = pal[k]; x.fillRect((flip ? w - 1 - rx : rx) * px, ry * px, px, px);
      }));

    });

}

  ctx.drawImage(set[name][flip ? 1 : 0], Math.round(box.x + box.w / 2 - (flip ? set.cxFlip : set.cx)), Math.round(box.y + box.h - set.bottom));
}

// ---------------------------------------------------------------- answer pop-up
// Freezes the game and shows a sorted row of answers under a burning fuse. Bosses and secret doors use it.
let ask = null, padSel = 0;
function askQuestion(o) {
  mode = 'pad'; keys.left = keys.right = keys.jump = false;
  ask = { ...o, opts: rowChoices(o.q, o.n), left: o.time, tick: 3 };
  padSel = 0;
  $('padQ').innerHTML = o.q.missing ? o.q.text.replace('?', '<span class="padin" id="padIn">?</span>') : `${o.q.text} = <span class="padin" id="padIn">?</span>`;
  $('padMsg').textContent = o.keypad ? 'Type the answer!' : o.msg;
  const box = $('padKeys'); box.innerHTML = ''; box.classList.toggle('keypad', !!o.keypad);
  if (o.keypad) {   // expert mode: type the answer instead of picking it
    ask.typed = '';

      const b = document.createElement('button'); b.type = 'button'; b.textContent = k; if (k === '✓') b.className = 'ok';

}
function markSel() { [...$('padKeys').children].forEach((b, i) => b.classList.toggle('sel', i === padSel)); }

function updateFuse() {
  $('fuse').style.width = (Math.max(0, ask.left / ask.time) * 100) + '%';
  $('fuse').classList.toggle('low', ask.left <= 3);
}
function tickPad(dt) {
  ask.left -= dt; updateFuse();
  if (ask.left <= ask.tick && ask.tick > 0) { tone(1000, 0.06, 'square', 0.04); ask.tick--; }

}
function closePad() { const a = ask; ask = null; hide('pad'); mode = 'play'; show('pauseBtn'); showTouch(true); return a; }
function pickAnswer(i) {

}

  } else if (ask.typed.length < 4) { ask.typed += k; tone(600 + Number(k) * 40, 0.05, 'square', 0.03); }
  $('padIn').textContent = ask.typed || '?';
}

// Two misses in a row brings Sensei with a tip for the fact that was missed.
function tipFor(q) {
  if (q.tip) return q.tip;
  const { a, b, op, ans } = q;
  if (q.missing) return `Count up from ${a} to ${a + ans}. That's ${ans}.`;
  if (q.step && op === '+') return `Think in tens: ${a / 10} tens + ${b / 10} tens = ${ans / 10} tens, which is ${ans}.`;
  if (q.step && op === '−') return `Think in tens: ${a / 10} tens − ${b / 10} tens = ${ans / 10} tens, which is ${ans}.`;
  if (q.step && op === '×') return `Do ${a} × ${b / 10} = ${a * b / 10} first, then put a zero on the end: ${ans}.`;
  if (op === '+') {
    if (a === b) return `Doubles! ${a} + ${a} is double ${a}, which is ${ans}.`;
    if (Math.abs(a - b) === 1) { const m = Math.min(a, b); return `Near double: ${m} + ${m} = ${m * 2}, plus 1 more is ${ans}.`; }
    if (a < 10 && b < 10 && ans > 10) { const big = Math.max(a, b), small = Math.min(a, b), need = 10 - big; return `Make 10 first: ${big} + ${need} = 10, then ${small - need} more is ${ans}.`; }
    if (a >= 10 && b >= 10) { const t = Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10, o = a % 10 + b % 10; return `Add the tens, then the ones: ${t} + ${o} = ${ans}.`; }
    return `Start at the bigger number and count on ${Math.min(a, b)} more: ${ans}.`;
  }
  if (op === '−') {
    if (b <= 3) return `Count back ${b} from ${a}: ${ans}.`;
    if (a >= 20 && b >= 10) { const t = Math.floor(b / 10) * 10; return `Take away the tens, then the ones: ${a} − ${t} = ${a - t}, then take away ${b % 10} more: ${ans}.`; }
    return `Count up from ${b} to ${a}. That's ${ans} steps.`;
  }
  if (op === '×') {
    const other = n => (a === n ? b : a);
    if (a === 1 || b === 1) return `Anything times 1 stays the same: ${ans}.`;
    if (a === 2 || b === 2) return `Times 2 is doubling: double ${other(2)} is ${ans}.`;
    if (a === 10 || b === 10) return `Times 10: put a zero on the end. ${other(10)} becomes ${ans}.`;
    if (a === 5 || b === 5) return `Count by 5s, ${other(5)} times: 5, 10, 15... all the way to ${ans}.`;
    if (a === 9 || b === 9) { const o = other(9); return `Times 9: do times 10, then take one away. ${o * 10} − ${o} = ${ans}.`; }
    if (a === 4 || b === 4) { const o = other(4); return `Times 4: double, then double again. ${o}, ${o * 2}, ${ans}.`; }
    return `Use one you know: ${a} × ${b - 1} = ${a * (b - 1)}, plus one more ${a} is ${ans}.`;
  }
  return `Think times tables: what times ${b} makes ${a}? ${ans} × ${b} = ${a}.`;
}
// A picture to go with the tip: ten frames, arrays, groups, a number line or a balance.
function picFor(q) {
  if (q.pic) return q.pic;
  const { a, b, op, ans } = q;
  if (q.missing && op === '+' && a + ans <= 20) return { k: 'frames', red: a, ghost: ans };
  if (q.step && (op === '+' || op === '−')) return { k: 'line', seq: [a, ans], hole: 1, jump: op === '+' ? `+${b}` : `−${b}` };
  if (op === '+' && ans <= 20) return { k: 'frames', red: a, blue: b };
  if (op === '−' && a <= 20) return { k: 'frames', red: a, cross: b };
  if (op === '+' || op === '−') { const t = Math.floor(b / 10) * 10, mid = op === '+' ? a + t : a - t; return { k: 'line', seq: t && b % 10 ? [a, mid, ans] : [a, ans], hole: -1, jumps: t && b % 10 ? [`${op === '+' ? '+' : '−'}${t}`, `${op === '+' ? '+' : '−'}${b % 10}`] : [`${op === '+' ? '+' : '−'}${b}`] }; }
  if (op === '×' && !q.step && a * b <= 144) return { k: 'array', rows: Math.min(a, b), cols: Math.max(a, b) };
  if (op === '÷' && a <= 100) return { k: 'groups', g: b, each: ans };
  return null;
}

  G.tip = { txt, t: 480, pic: q ? picFor(q) : null };

// ---------------------------------------------------------------- number-stone bridges
// A pit too wide to jump. The target follows the math difficulty: 10, 20, 50 or 100. Bonk number stones to pick them up and carry them to the altar;
// the stones have to add up to exactly the target or the bridge cracks.
function bridgePuzzle(band) {
  const w = band, unit = w >= 2 ? 5 : 1, target = [10, 20, 50, 100][w], k = w === 0 ? 2 : 3, units = target / unit;
  const cuts = new Set();
  while (cuts.size < k - 1) cuts.add(R(1, units - 1));
  const marks = [0, ...[...cuts].sort((a, b) => a - b), units];
  const parts = marks.slice(1).map((m, i) => (m - marks[i]) * unit);
  // Two extra stones that differ from the answer stones (and each other) where possible.
  const extra = [];
  for (let tries = 0; extra.length < 2 && tries < 40; tries++) {
    const v = R(1, Math.max(2, Math.floor(units * 0.7))) * unit;
    if ((!parts.includes(v) && !extra.includes(v)) || tries > 30) extra.push(v);
  }
  return { target, stones: shuffle([...parts, ...extra]) };
}
function bridgeStone(c, r) {
  for (const b of L.bridges) for (const st of b.stones) {
    if (st.c !== c || st.r !== r) continue;
    if (b.done || st.state === 'used') { sfx.bump(); return; }
    if (st.state === 'carried') {   // bonk it again to put it back
      st.state = 'home'; G.carry.stones = G.carry.stones.filter(t => t !== st); if (!G.carry.stones.length) G.carry = null;
      sfx.bump(); floatText(c * T + T / 2, r * T - 10, `Put back ${st.val}`, '#ccc', 20); return;
    }
    if (G.carry && G.carry.b !== b) dropCarry();
    if (!G.carry) G.carry = { b, stones: [] };
    if (G.carry.stones.length >= 4) { sfx.bump(); floatText(c * T + T / 2, r * T - 10, 'Hands full!', '#ff6b6b', 20); return; }
    st.state = 'carried'; G.carry.stones.push(st);
    const sum = G.carry.stones.reduce((a, t) => a + t.val, 0);
    sfx.coin(); floatText(c * T + T / 2, r * T - 10, G.carry.stones.length > 1 ? `Holding ${sum}` : `Got ${st.val}`, '#fff', 22);
    return;
  }
}

// Everything being carried goes on the altar at once.
function placeStone(b) {

  }
  if (!keys.jump && p.vy < -4.5) p.vy = -4.5;   // short hop when jump is released early
  p.vy = Math.min(p.vy + 0.55, 12);

  moveX(p);
  const wasAir = !p.onGround, fallSpeed = p.vy;
  const hit = moveY(p);
  if (hit) bump(hit.c, hit.r);
  if (wasAir && p.onGround && fallSpeed > 6) { p.squash = 8; burst(p.x + p.w / 2, p.y + p.h, '#e8e0d0', 4, 1.5); }
  if (p.squash > 0) p.squash--; else if (p.squash < 0) p.squash++;
  if (p.inv > 0) p.inv--;
  if (p.throwT > 0) p.throwT--;
  p.anim += Math.abs(p.vx) * 0.06;

  if (p.y > VH + 60) fell();

  if (G.power && --G.power.t <= 0) { G.power = null; floatText(p.x + p.w / 2, p.y - 20, 'Power faded', '#cccccc', 20); }
  if (hasPower('fire') && tick % 2 === 0) G.parts.push({ k: 'bit', x: p.x + Math.random() * p.w, y: p.y + p.h - Math.random() * p.h, vx: 0, vy: -1.5, life: 22, col: ['#ff6a00', '#ffd23f', '#ff3b1f'][R(0, 2)], s: 5 });
  const trail = prog.equip.trail;
  if (trail && p.onGround && Math.abs(p.vx) > 2 && tick % 3 === 0) {
    const cols = trail === 'trail-fire' ? ['#ff6a00', '#ffd23f', '#ff3b1f'] : ['#ffffff', '#fff3a0', '#9be7ff'];
    G.parts.push({ k: 'bit', x: p.x + p.w / 2 - p.face * 10, y: p.y + p.h - 6, vx: -p.face * 0.5, vy: -1 - Math.random(), life: 26, col: cols[R(0, 2)], s: 4 });
  }
  petTick();
  updateRoom();

  // Bridges: carry stones to the altar; reaching a bridge makes it the respawn point.
  for (const b of L.bridges || []) {
    if (b.done) continue;
    if (p.x > b.startX && G.checkpoint < b.startX) G.checkpoint = b.startX + T;
    if (G.carry && G.carry.b === b && overlap(p, { x: b.altarC * T, y: GR * T - 2 * T, w: T, h: 2 * T })) placeStone(b);
  }
  for (const d of L.doors || []) if (!d.used && p.onGround && overlap(p, doorBox(d.c))) { openDoor(d); return; }
  if (L.vault && overlap(p, doorBox(L.exitC))) { leaveVault(); return; }

  for (const c of L.coins) {
    if (!c.taken && Math.abs(c.x - (p.x + p.w / 2)) < 22 && Math.abs(c.y - (p.y + p.h / 2)) < 30) {
      c.taken = true; G.coins += c.v; G.score += 100 * c.v; gemSound(); flyGem(c.x, c.y, c.v);
      if (c.v > 1) floatText(c.x, c.y - 24, '+' + c.v, GEM_COL[c.v][0], 22);
    }
  }
  if (L.prize && overlap(p, L.prize)) {
    L.prize = null; mode = 'win'; G.winT = 0; stopMusic(); sfx.win(); hide('pauseBtn'); showTouch(false); petSay('dance');
    G.score += G.hearts * 300; confetti(p.x + p.w / 2, p.y);
    floatText(p.x + p.w / 2, p.y - 20, 'Scroll recovered!', '#ffd23f', 30);
  }
  if (!L.boss && !L.vault && p.x + p.w >= L.flagC * T + T / 2 - 6) {
    mode = 'win'; G.winT = 0; stopMusic(); sfx.win(); hide('pauseBtn'); showTouch(false); petSay('dance');
    const bonus = Math.max(0, GR - Math.floor((p.y + p.h) / T)) * 100 + G.hearts * 300;
    G.score += bonus; floatText(p.x, p.y - 10, '+' + bonus, '#ffd23f', 26);
  }
}

function updateEnemies() {
  for (const e of L.enemies) {
    if (e.dead === 'squash') { e.t++; continue; }
    if (e.dead === 'flip') { e.vy += 0.5; e.y += e.vy; e.x += (e.vx || 0) * 0.5; continue; }
    if (e.dead) continue;
    if (Math.abs(e.x - P.x) > VW * 1.2) continue;   // sleep until nearby
    e.t++;
    if (e.kind === 'blob') {
      // Lava blobs leap out of the pit, then sink back and wait.
      if (!e.up) { if (e.t > e.delay) { e.up = true; e.vy = -12.5; } }
      else {
        e.vy += 0.4; e.y += e.vy;
        if (e.y >= e.home) { e.y = e.home; e.up = false; e.t = 0; e.delay = R(70, 140); }
      }
      if (mode === 'play' && e.up && overlap(P, e)) {
        if (hasPower('fire')) { e.up = false; e.y = e.home; burst(e.x + 13, e.y - 40, '#ffd23f', 6); } else hurt();
      }
      continue;
    }
    e.vy = Math.min(e.vy + 0.5, 10);
    if (e.kind === 'shadow' && e.onGround && e.t % 100 === 50) e.vy = -9;   // shadow ninjas hop
    const vx0 = e.vx;
    if (moveX(e)) e.vx = -vx0;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
      if (!solid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > VH + 100) e.dead = 'gone';
    if (mode === 'play' && overlap(P, e)) {
      if (hasPower('fire')) {
        e.dead = 'flip'; e.vy = -7; G.score += 200; sfx.stomp();
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff6a00', 10); floatText(e.x + e.w / 2, e.y, '+200');
      } else if (P.vy > 0 && P.y + P.h - e.y < 18) {
        e.dead = 'squash'; e.t = 0; P.vy = keys.jump ? -11 : -7; shake(6, 3);
        burst(e.x + e.w / 2, e.y + e.h, '#ffffff', 6, 2);
        G.score += 200; sfx.stomp(); floatText(e.x + e.w / 2, e.y, '+200');
        if (e.kind === 'robot') burst(e.x + 15, e.y + 10, '#c8d3de', 8);
        if (e.kind === 'rock') burst(e.x + 17, e.y + 10, '#7d706a', 8);
      } else hurt();
    }
  }
}

function bossAttack(b) {
  const easy = prog.easy ? 0.7 : 1, sx = b.x + (b.face > 0 ? b.w : 0), kind = b.spec.attack;
  const lob = k => {
    const t = prog.easy ? 85 : 70, g = 0.3, px = P.x + P.w / 2;
    L.proj.push({ k, x: sx, y: b.y + 14, vx: (px - sx) / t, vy: -0.5 * g * t, g, r: 13 });
  };
  const low = (k, speed, r) => L.proj.push({ k, x: sx, y: GR * T - 18, vx: b.face * speed * easy, vy: 0, g: 0, r });
  if (kind === 'star') low('star', 4.5, 11);
  else if (kind === 'laser') low('laser', 5.5, 9);
  else if (kind === 'rock') lob('rock');
  else { b.flip ^= 1; if (b.flip) low('star', 5, 11); else lob('orb'); }
  sfx.attack();
}

const DODGE_FRAMES = () => (prog.easy ? 200 : 260);
const OPEN_FRAMES = () => (prog.easy ? 900 : 600);
function startDodge() {
  const ar = L.arena; ar.phase = 'dodge'; ar.phaseT = DODGE_FRAMES(); L.boss.atk = 30;
}
function updateArena() {
  const ar = L.arena, b = L.boss;
  if (!ar || b.dying || b.dead || ar.wait) return;
  if (--ar.phaseT > 0) return;
  if (ar.phase === 'dodge') {
    // The boss tires out: clear its attacks and open a window to answer.
    ar.phase = 'open'; ar.phaseT = OPEN_FRAMES();
    for (const p of L.proj) burst(p.x, p.y, '#ffffff', 5, 2);
    L.proj = [];
    floatText(b.x + b.w / 2, b.y - 16, 'Dizzy!', '#ffd23f', 28); sfx.gate();
  } else {
    floatText(b.x + b.w / 2, b.y - 16, 'Back on guard!', '#ff9a3c', 24);
    startDodge();
  }
}

function updateBoss() {
  const b = L.boss; if (!b || b.dead) return;
  if (b.dying > 0) {
    b.dying--;
    if (b.dying % 6 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffd23f', '#ff6a00', '#fff'][R(0, 2)], 6, 5);
    if (b.dying === 0) {
      b.dead = true; burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd23f', 30, 7);
      L.prize = { x: b.x + b.w / 2 - 20, y: b.y, w: 40, h: 30, vy: -8 };
    }
    return;
  }
  b.t++; if (b.flash > 0) b.flash--;
  b.vy = Math.min(b.vy + 0.55, 12);
  const dizzy = L.arena.phase === 'open';
  b.face = P.x + P.w / 2 < b.x + b.w / 2 ? -1 : 1;
  if (dizzy) { moveY(b); return; }   // a dizzy boss stands still and can't hurt you
  if (b.x <= b.minX) b.vx = Math.abs(b.vx); else if (b.x >= b.maxX) b.vx = -Math.abs(b.vx);
  const vx0 = b.vx;
  if (moveX(b)) b.vx = -vx0;
  moveY(b);
  if (b.spec.hop && b.onGround && b.t % b.spec.hop === 0) b.vy = -10;
  if (mode === 'play' && --b.atk <= 0) {
    bossAttack(b);
    b.atk = b.spec.every * 0.8 * (prog.easy ? 1.6 : 1) * (0.8 + Math.random() * 0.4);
  }
  if (mode === 'play' && overlap(P, b) && !hasPower('fire')) hurt();
}

function updateShotsAndProjectiles() {
  const b = L.boss;
  for (const s of G.shots) {
    s.spin += 0.5;
    const tx = b.x + b.w / 2, ty = b.y + b.h / 2, dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
    if (d < 16) {
      s.done = true; b.hp--; b.flash = 36; sfx.hit(); shake(12, 6); G.freeze = 5;
      burst(tx, ty, '#ffd23f', 14, 5); floatText(tx, b.y - 10, 'POW!', '#ffd23f', 34);
      if (b.hp <= 0) { b.dying = 90; L.proj = []; sfx.bossDown(); shake(30, 8); G.slow = 120; G.flash = 1; }
      else L.arena.wait = 45;   // short breather, then a new question
    } else { s.x += dx / d * 13; s.y += dy / d * 13; }
  }
  G.shots = G.shots.filter(s => !s.done);
  if (L.arena && L.arena.wait > 1 && --L.arena.wait === 1 && !b.dying && !b.dead) nextBossQuestion();

  for (const p of L.proj) {
    p.x += p.vx; p.vy += p.g; p.y += p.vy;
    if (p.g && p.y > GR * T - p.r) { p.done = true; burst(p.x, GR * T - 4, p.k === 'rock' ? '#ff6a00' : '#b388ff', 8); }
    if (p.x < -40 || p.x > L.w * T + 40) p.done = true;
    if (!p.done && mode === 'play' && circleHits(p.x, p.y, p.r - 2, P)) { p.done = true; if (hasPower('fire')) burst(p.x, p.y, '#ff6a00', 8); else hurt(); }
  }
  L.proj = L.proj.filter(p => !p.done);

  if (L.prize) {
    const z = L.prize;
    z.vy = Math.min(z.vy + 0.4, 8); z.y += z.vy;
    if (z.y + z.h > GR * T) { z.y = GR * T - z.h; z.vy = 0; }
  }
}

function updateGates() {
  for (const st of L.stations) {
    if (st.opening === null || st.opening < 0) continue;
    st.openT++;
    if (st.openT % 3 !== 0) continue;
    const r = st.opening;
    for (const gc of st.gate) if (L.map[r][gc] === 'G') { L.map[r][gc] = '.'; burst(gc * T + T / 2, r * T + T / 2, L.world.gate[2], 3, 3); }
    st.opening--;
  }
  for (const st of L.stations) {
    for (const a of st.answers) if (a.shake > 0) a.shake--;
    if (st.swap && --st.swap === 0) setStationQ(st, freshQ(st.q.text));
  }
}

function updateWin() {
  const p = P; G.winT++; petTick();
  if (L.boss) {
    p.vx *= 0.8; p.vy = Math.min(p.vy + 0.55, 12); moveX(p); moveY(p);
    if (G.winT === 120) finishLevel();
    return;
  }
  if (G.winT < 50) {
    p.vx *= 0.8; p.vy = Math.min(p.vy + 0.55, 12); moveX(p); moveY(p);   // stop and catch the scroll
  } else {
    p.face = 1; p.vx = 2.6; p.vy = Math.min(p.vy + 0.55, 12);
    moveX(p); moveY(p); p.anim += 0.16;
  }
  if (G.winT === 210) finishLevel();
}

function updateAmbient() {
  const k = L.world.key;
  if ((k === 'japan' || k === 'lava') && ambient.length < 28 && tick % 6 === 0) {
    ambient.push(k === 'japan'
      ? { k: 'petal', x: Math.random() * (VW + 200), y: -10, vx: -0.6 - Math.random() * 0.8, vy: 0.7 + Math.random() * 0.6, a: Math.random() * 6 }
      : { k: 'ember', x: Math.random() * VW, y: VH + 5, vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 1.2, a: Math.random() * 6 });
  }
  for (const p of ambient) { p.a += 0.05; p.x += p.vx + Math.sin(p.a) * 0.4; p.y += p.vy; }
  for (let i = ambient.length - 1; i >= 0; i--) {
    const p = ambient[i];
    if (p.y > VH + 20 || p.y < -20 || p.x < -20 || (p.k === 'petal') !== (k === 'japan')) ambient.splice(i, 1);
  }
}

function finishLevel() {
  mode = 'done';
  const i = G.idx, st = STAGES[i], W = WORLDS[st.w];
  const dots = G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1, sk = G.skill, pts = dots * sk.tier;
  const before = currentBelt();
  if (!prog.best[i] || pts > prog.best[i].pts) prog.best[i] = { pts, dots, tier: sk.tier };
  prog.mastery[sk.id] = Math.max(prog.mastery[sk.id] || 0, dots);
  save();
  const after = currentBelt(), last = i === STAGES.length - 1;
  // Kept short for kids: a big picture, the medal, two numbers, and at most a couple of highlights.
  const found = [0, 1, 2].filter(k => prog.best[st.w * PER_WORLD + k]).length;
  const title = st.boss ? 'Scroll won!' : G.mistakes === 0 ? 'Perfect!' : 'Level complete!';
  let body = st.boss ? '<div class="bigicon">📜</div>' : `<div class="bigicon">🧩<small>${found}/3</small></div>`;
  body += `<div class="medalrow"><span class="dots">${'●'.repeat(dots) + '○'.repeat(3 - dots)}</span> ${['', '🥉', '🥈', '🥇'][dots]}</div>`;
  const earned = Math.round((G.coins + (st.boss ? 20 : 0)) * TIER_GEMS[sk.tier - 1]);
  prog.bank += earned; prog.stats.gems += earned; save();
  if (G.mistakes === 0) award('perfect');
  if (st.boss && !G.hit) award('boss-nohit');
  if ([0, 1, 2, 3].every(w => prog.best[bossOf(w)])) award('boss-all');
  if (prog.stats.gems >= 500) award('gems500');
  if (currentBelt().name === 'Black') award('black-belt');
  if (dots === 3) award('gold-medal');
  if (sk.tier >= 4) award('brave');
  const path = pathRound(sk, G.mistakes), up = path.startsWith('<div');
  body += `<div class="statrow"><span>💎 +${earned}</span><span>🥋 +${pts}</span>${up ? '' : path}</div>`;
  if (up) body += path;
  if (after.idx > before.idx) body += `<div class="promo">${beltHTML(after)} &nbsp;<b>${after.name} Belt!</b></div>`;
  if (G.practice.size) body += `<div class="practice">🔁 ${[...G.practice.values()].slice(0, 3).map(q => `<span>${qSolved(q)}</span>`).join('')}</div>`;
  const btns = [];
  const wolfOffer = i === 0 && !prog.owned.includes('pet-wolf');
  if (wolfOffer) body += `<div class="promo">🐺 Wolf pup: just <b>5 💎</b></div>`;
  if (last) btns.push({ label: 'The end ▶', fn: showEnding, primary: true });
  else btns.push({ label: (st.boss ? 'Next world' : 'Next') + ' ▶', fn: () => startStage(i + 1), primary: true });
  btns.push({ label: 'Replay', fn: () => startStage(i), alt: true });
  btns.push({ label: 'Levels', fn: toMenu, alt: true });
  if (wolfOffer) btns.push({ label: '🐺 Adopt the wolf', fn: () => { hide('msg'); openShop(); } });
  showMsg(title, body, btns);
}

function showEnding() {
  const b = currentBelt();
  showMsg('Sensei is proud!', `<div class="bigicon">📜📜📜📜</div><p>${ENDING}</p>
    <div class="promo">${beltHTML(b)} &nbsp;Your rank: <b>${b.name} Belt</b> (${totalPoints()} / ${MAX_POINTS} points)</div>
    <p>Replay levels with no mistakes to earn more points and reach the Black Belt!</p>`,
    [{ label: 'Levels', fn: toMenu, primary: true }]);
}

function update() {
  tick++;
  updateAmbient();
  if (!G) { cam = (tick * 1.2) % (L.w * T - VW); return; }
  G.time++;
  { const cs = currentStation(); if (cs && cs.answers && cs.shownAt == null) cs.shownAt = G.time; }
  if (mode === 'play') { updatePlayer(); updateEnemies(); }
  else if (mode === 'win') { updateWin(); updateEnemies(); }
  if (mode === 'play' || mode === 'win') { updateBoss(); if (L.boss) { updateArena(); updateShotsAndProjectiles(); } }
  updateGates();
  for (const [k, v] of G.bumps) { if (v <= 1) G.bumps.delete(k); else G.bumps.set(k, v - 1); }
  for (const p of G.parts) {
    p.life--; p.x += p.vx; p.y += p.vy;
    if (p.k === 'bit') p.vy += 0.4;
    if (p.k === 'coin') p.vy += 0.6;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.shake > 0) G.shake--;
  if (G.tip && --G.tip.t <= 0) G.tip = null;
  if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.04);
  for (const f of G.flyers) { f.t += 1 / 28; if (f.t >= 1) G.pulse = 8; }
  G.flyers = G.flyers.filter(f => f.t < 1);
  if (G.pulse > 0) G.pulse--;
  cam = clamp(P.x + P.w / 2 - VW * 0.4, 0, Math.max(0, L.w * T - VW));
}

function drawRoomBlock(x, y, c) {
  const room = L.room, i = room.blocks.indexOf(c), st = room.state[i];
  if (st === 'right') block(x, y, '#2ecc71', '#1e8449', '#8ff0b5');
  else if (st === 'wrong') block(x, y, '#7a7a8a', '#4a4a58', '#9a9aaa');
  else if (room.open) block(x, y, '#9b6a3c', '#5e3a1c', '#b8875a');
  else block(x, y, '#f7b928', '#a8600a', '#ffe08a');

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(v, x + T / 2, y + T / 2 + 1);
}
// The puzzle on the back wall, the treasure chest, and its gem tag.
function drawRoom() {
  const room = L.room, cx = room.blocks[1] * T + T / 2, top = VW < 700 ? 192 : 110, bottom = (GR - 3) * T - 14;
  const font = s => { ctx.font = `${s}px "Lilita One", "Trebuchet MS", sans-serif`; };
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const q = room.qs[Math.min(done, 1)], solvedNow = room.open || (room.wait && done > 0);
    const wob = room.wobble ? Math.sin(room.wobble * 0.6) * 0.12 : 0, ang = solvedNow ? 0 : room.tilt + wob;
    const py = top + 22, arm = Math.min(170, VW * 0.22);

    ctx.fillStyle = '#c9a24f'; ctx.fillRect(cx - 4, py, 8, bottom - py - 10);

    ctx.fillStyle = '#c9a24f'; ctx.fillRect(-arm, -4, arm * 2, 8); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();

      ctx.strokeStyle = '#c9a24f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 52, panY); ctx.moveTo(ex, ey); ctx.lineTo(ex + 52, panY); ctx.stroke();
      ctx.fillStyle = '#c9a24f'; ctx.beginPath(); ctx.ellipse(ex, panY, 62, 12, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = 'rgba(20,20,50,.85)'; rrect(ex - 50, panY - 40, 100, 36, 8); ctx.fill();
      const lab = side < 0 ? q.l : q.r, shown = solvedNow ? lab.replace('?', q.ans) : lab;
      font(22); ctx.fillStyle = '#fff'; ctx.fillText(shown, ex, panY - 21);
    }
    ctx.fillStyle = 'rgba(20,20,50,.85)'; rrect(cx - 26, py - 32, 52, 22, 8); ctx.fill();
    font(15); ctx.fillStyle = '#ffd23f'; ctx.fillText(`${Math.min(done + (room.wait ? 0 : 1), 2)} / 2`, cx, py - 20);
  } else if (room.kind === 'square') {

    ctx.fillStyle = '#5a4030'; rrect(gx - 12, gy - 12, cell * 3 + 24, cell * 3 + 24, 10); ctx.fill();
    ctx.fillStyle = '#d9c39a'; rrect(gx - 6, gy - 6, cell * 3 + 12, cell * 3 + 12, 6); ctx.fill();
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {

      ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 2; ctx.strokeRect(x, y, cell, cell);
      let txt = sq.grid[r][c], col = '#3a2200';
      if (bi >= 0 && bi >= done) { txt = bi === done ? '?' : ''; col = '#1a7fa0'; if (bi === done && !room.wait) { ctx.fillStyle = `rgba(125,249,255,${0.35 + 0.25 * Math.sin(tick * 0.15)})`; ctx.fillRect(x + 3, y + 3, cell - 6, cell - 6); } }
      else if (bi >= 0) col = '#1e8449';
      font(sq.grid[r][c] >= 100 ? 18 : 24); ctx.fillStyle = col; ctx.fillText(txt, x + cell / 2, y + cell / 2 + 1);
    }

    }

        const a = Math.sin((tick % 150) / 24 * Math.PI), cx = x + T / 2, cy = y + T / 2;
        ctx.fillStyle = `rgba(255,255,220,${a})`;
        poly([[cx, cy - 10 * a], [cx + 3, cy - 3], [cx + 10 * a, cy], [cx + 3, cy + 3], [cx, cy + 10 * a], [cx - 3, cy + 3], [cx - 10 * a, cy], [cx - 3, cy - 3]], ctx.fillStyle);
      }
      break;
    case 'S': block(x, y, W.stair[0], W.stair[1], W.stair[2]); break;
    case 'P': case 'Q': case 'p': case 'q': {
      const top = t === 'P' || t === 'Q', left = t === 'P' || t === 'p';
      const x0 = top ? (left ? x - 3 : x) : (left ? x + 2 : x), w = top ? T + 3 : T - 2;
      ctx.fillStyle = W.pipe[1]; ctx.fillRect(x0, y, w, T);
      ctx.fillStyle = W.pipe[0]; ctx.fillRect(x0 + (left ? 2 : 0), y + (top ? 2 : 0), w - 2, T - (top ? 4 : 0));
      if (left) { ctx.fillStyle = W.pipe[2]; ctx.fillRect(x0 + 7, y + (top ? 4 : 0), 5, T - (top ? 8 : 0)); }
      if (W.key === 'japan' && !top) { ctx.fillStyle = W.pipe[1]; ctx.fillRect(x0, y + T / 2 - 1, w, 3); }   // bamboo joints
      break;

    case 'G': {
      const [fill, dark, light, lock] = W.gate;

      ctx.fillStyle = fill; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
      ctx.fillStyle = light; ctx.fillRect(x + 2, y + 2, T - 4, 3);

}

function drawAnswer(x, y, c, r) {
  const f = findAnswer(c, r); if (!f) return;
  const { st, a } = f;
  if (a.shake) x += Math.sin(a.shake * 1.6) * 4;
  const cur = st === currentStation();
  if (a.state === 'right') block(x, y, '#2ecc71', '#1e8449', '#8ff0b5');
  else if (a.state === 'wrong') block(x, y, '#e74c3c', '#922b21', '#f1948a');
  else if (a.state === 'done') block(x, y, '#9b6a3c', '#5e3a1c', '#b8875a');
  else block(x, y, '#f7b928', '#a8600a', '#ffe08a');
  if (cur && a.state === 'idle') {
    ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(tick * 0.15)})`; ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, T + 4, T + 4);
  }
  const s = String(a.val);
  ctx.fillStyle = a.state === 'idle' ? '#5a2a00' : '#fff';
  ctx.font = `${s.length >= 3 ? 16 : 22}px "Lilita One", "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x + T / 2, y + T / 2 + 1);
  if (a.state === 'wrong') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 7, y + 7); ctx.lineTo(x + T - 7, y + T - 7); ctx.stroke();
  }
}

function drawPits(c0, c1) {
  const kind = L.world.pit;
  if (kind === 'void') return;
  for (let c = c0; c <= c1; c++) {
    if (L.map[GR][c] !== '.' && L.map[GR][c] !== 'b') continue;
    const x = c * T, y = GR * T + 14 + Math.sin(tick * 0.08 + c) * 3;
    if (kind === 'water') {
      ctx.fillStyle = '#3a8fd6'; ctx.fillRect(x, y, T, VH - y);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x + 4, y, T - 14, 3);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, VH);
      g.addColorStop(0, '#ffd23f'); g.addColorStop(0.25, '#ff6a00'); g.addColorStop(1, '#b3200a');
      ctx.fillStyle = g; ctx.fillRect(x, y, T, VH - y);
    }
  }
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(L.w - 1, c0 + Math.ceil(VW / T) + 1);
  for (let c = c0; c <= c1; c++) for (let r = 0; r < ROWS; r++) {
    const t = L.map[r][c]; if (t === '.') continue;
    let y = r * T;
    if (G) { const b = G.bumps.get(c + ',' + r); if (b) y -= Math.sin((10 - b) / 10 * Math.PI) * 9; }
    drawTile(t, c * T, y, c, r);
  }
}

// Bridge signs, the altar, preview planks over the pit, and secret doors.
function drawPuzzles() {
  for (const b of L.bridges) {
    const sx = b.signC * T + 4, sy = (GR - 3.1) * T, sw = 3.5 * T, sh = 1.25 * T;
    if (sx < cam + VW && (b.c0 + b.w) * T > cam) {
      ctx.fillStyle = '#6e4627'; ctx.fillRect(sx + sw / 2 - 4, sy + sh, 8, GR * T - sy - sh);
      ctx.fillStyle = '#5e3a1c'; rrect(sx - 3, sy - 3, sw + 6, sh + 6, 6); ctx.fill();
      ctx.fillStyle = b.done ? '#c8f7d4' : '#f6e1b5'; rrect(sx, sy, sw, sh, 5); ctx.fill();
      ctx.fillStyle = '#3a2200'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '16px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillText(`Bridge needs ${b.target}`, sx + sw / 2, sy + 14);
      ctx.font = '14px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillText(b.done ? 'Built!' : `So far: ${b.total}`, sx + sw / 2, sy + 32);

        const built = Math.floor(b.total / b.target * b.w);

        for (let c = b.c0; c < b.c0 + built; c++) ctx.fillRect(c * T, GR * T, T - 2, 12);

  }

  for (const d of doors) {

    ctx.fillText(d.exit ? '➜' : d.used ? (d.solved ? '✔' : '🔒') : '?', x + w / 2, y + h / 2);

}

function drawSigns() {
  for (const st of L.stations) {
    const x = st.s * T + 4, y = (GR - 3.1) * T, w = 3.5 * T, h = 1.25 * T;
    if (x > cam + VW || x + w < cam) continue;

    ctx.fillStyle = '#5e3a1c'; rrect(x - 3, y - 3, w + 6, h + 6, 6); ctx.fill();

    ctx.fillStyle = '#3a2200'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

// Small ground decorations: flower bushes, rocks, crates, stone lanterns.
function drawDecor(c) {

}

const SCROLL_AT = { japan: [[-34, -4.1], [-30, -4.4]], lava: [[0, -3.7], [0, -3.2]], robot: [[-36, -3.1], [0, -3.4]], castle: [[-30, -3.2], [-28, -3.1]] };
function scrollSpot() {

  const bob = L.world.key === 'robot' && L.def.k % 2 === 1 ? Math.sin(tick * 0.06) * 6 : 0;

}
function line(x0, y0, x1, y1, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }

  ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.ellipse(x, y, 11 * s, 15 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(x - 7 * s, y - 16 * s, 14 * s, 3 * s); ctx.fillRect(x - 7 * s, y + 13 * s, 14 * s, 3 * s);
}
// A Japanese roof with upturned eaves.
function roof(x, y, w, h, col, trim) {

}

  const dot = (cx, cy, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); };
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (pic.k === 'frames') {   // ten frames: red dots, then blue (or ghost) dots, so "make 10" shows itself
    const red = pic.red || 0, more = pic.blue || pic.ghost || 0, total = red + more, frames = total > 10 || red > 10 ? 2 : 1;
    const cell = Math.min(18, h / 2 - 2, (w - 20) / (frames * 5 + 1)), fw = cell * 5;
    const x0 = x + (w - (frames * fw + (frames - 1) * cell)) / 2, y0 = y + (h - cell * 2) / 2;
    for (let f = 0; f < frames; f++) for (let i = 0; i < 10; i++) {
      const n = f * 10 + i, cx = x0 + f * (fw + cell) + (i % 5) * cell, cy = y0 + Math.floor(i / 5) * cell;
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.strokeRect(cx, cy, cell, cell);
      const mx = cx + cell / 2, my = cy + cell / 2;
      if (n < red) {
        dot(mx, my, cell * 0.36, '#ff5a5a');
        if (pic.cross && n >= red - pic.cross) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx - 5, my - 5); ctx.lineTo(mx + 5, my + 5); ctx.moveTo(mx + 5, my - 5); ctx.lineTo(mx - 5, my + 5); ctx.stroke(); }
      } else if (n < total) {
        if (pic.ghost) { ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(mx, my, cell * 0.34, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
        else dot(mx, my, cell * 0.36, '#4aa8ff');
      }
    }
  } else if (pic.k === 'array') {   // rows of dots; every fifth column is a different colour to help counting
    const cell = Math.min(16, h / pic.rows, (w - 40) / pic.cols), x0 = x + (w - cell * pic.cols) / 2, y0 = y + (h - cell * pic.rows) / 2;
    for (let r = 0; r < pic.rows; r++) for (let c = 0; c < pic.cols; c++) dot(x0 + c * cell + cell / 2, y0 + r * cell + cell / 2, cell * 0.36, Math.floor(c / 5) % 2 ? '#4aa8ff' : '#ff5a5a');
    ctx.font = '15px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillStyle = '#ffd23f';
    ctx.fillText(`${pic.rows} rows of ${pic.cols}`, x0 - 40 < x ? x + w - 46 : x0 - 46, y + h / 2);
  } else if (pic.k === 'groups') {   // circles with the same number of dots in each
    const g = pic.g, rad = Math.min(h / 2 - 4, (w - 10) / g / 2.2), per = pic.each;
    for (let i = 0; i < g; i++) {
      const cx = x + (w - g * rad * 2.2) / 2 + rad * 1.1 + i * rad * 2.2, cy = y + h / 2;
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.stroke();
      const cols = Math.ceil(Math.sqrt(per)), d = rad * 1.3 / cols;
      for (let k = 0; k < per; k++) dot(cx - (cols - 1) * d / 2 + (k % cols) * d, cy - (Math.ceil(per / cols) - 1) * d / 2 + Math.floor(k / cols) * d, Math.max(1.5, d * 0.32), '#ff5a5a');
    }
  } else if (pic.k === 'line') {   // a number line with hops between the numbers
    const seq = pic.seq, n = seq.length, ly = y + h - 18, x0 = x + 30, step = (w - 60) / Math.max(1, n - 1);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 10, ly); ctx.lineTo(x + w - 10, ly); ctx.stroke();
    ctx.font = '16px "Lilita One", "Trebuchet MS", sans-serif';
    seq.forEach((v, i) => {
      const px = x0 + i * step;
      ctx.fillStyle = '#fff'; ctx.fillRect(px - 1, ly - 6, 2, 12);
      ctx.fillStyle = i === pic.hole ? '#7df9ff' : '#ffd23f'; ctx.fillText(i === pic.hole ? '?' : v, px, ly + 14);
      if (i) {
        const arcH = Math.min(step / 3, h - 44);
        ctx.strokeStyle = '#ff8a5a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px - step + 4, ly - 4); ctx.quadraticCurveTo(px - step / 2, ly - 4 - arcH * 2, px - 4, ly - 4); ctx.stroke();
        const lab = pic.jumps ? pic.jumps[i - 1] : pic.jump || (seq[i] - seq[i - 1] >= 0 ? `+${seq[i] - seq[i - 1]}` : `${seq[i] - seq[i - 1]}`);
        if (i !== pic.hole || pic.jumps || pic.jump) { ctx.fillStyle = '#ff8a5a'; ctx.font = '13px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillText(lab, px - step / 2, ly - arcH - 14); ctx.font = '16px "Lilita One", "Trebuchet MS", sans-serif'; }
      }
    });
  } else if (pic.k === 'scale') {   // a level balance: both sides weigh the same
    const cx = x + w / 2, top = y + 14;
    ctx.fillStyle = '#c9a24f'; ctx.fillRect(cx - 3, top, 6, h - 22); ctx.fillRect(cx - 26, y + h - 10, 52, 6);
    ctx.fillRect(cx - 150, top, 300, 5);
    for (const [sx, lab] of [[cx - 130, pic.l], [cx + 130, pic.r]]) {
      ctx.strokeStyle = '#c9a24f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, top + 4); ctx.lineTo(sx - 46, top + 36); ctx.moveTo(sx, top + 4); ctx.lineTo(sx + 46, top + 36); ctx.stroke();
      ctx.fillStyle = '#c9a24f'; ctx.beginPath(); ctx.ellipse(sx, top + 38, 54, 8, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '18px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillText(lab, sx, top + 24);
    }
    ctx.fillStyle = '#ffd23f'; ctx.font = '22px "Lilita One", "Trebuchet MS", sans-serif'; ctx.fillText('=', cx, top + 30);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- drawing: HUD
function heart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s, x, y + s * 1.2);
  ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.7, x + s, y + s * 0.3);
  ctx.bezierCurveTo(x + s, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.3);
  ctx.fill();
}
function hudText(txt, x, y, size, col = '#fff', align = 'left') {
  ctx.font = `${size}px "Lilita One", "Trebuchet MS", sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
}

function render() {
  if (RC) { renderRace(); return; }
  if (L.room) drawRoomBg(); else drawBackground();
  const shk = G && G.shake > 0 ? G.shakeAmp : 0;
  ctx.save(); ctx.translate(-Math.round(cam) + (Math.random() - 0.5) * 2 * shk, (Math.random() - 0.5) * 2 * shk);
  for (const d of L.decor) if (d * T > cam - 80 && d * T < cam + VW + 40) drawDecor(d);
  drawSigns();
  drawPuzzles();
  if (L.room) drawRoom();
  if (!L.boss && !L.vault) drawGoal();
  const c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(L.w - 1, c0 + Math.ceil(VW / T) + 1);
  drawTiles();
  for (const c of L.coins) if (!c.taken && c.x > cam - 20 && c.x < cam + VW + 20) drawGem(c.x, c.y + Math.sin(tick * 0.08 + c.x) * 3, c.v, tick * 0.08 + c.x);
  for (const e of L.enemies) drawEnemy(e);
  drawPits(c0, c1);   // after enemies, so lava blobs rise out of the lava
  drawBoss();
  if (G) { drawPet(); drawPlayer(); drawProjectiles(); drawParticles(); }
  ctx.restore();
  if (G) {
    drawHUD();
    // gems fly up into the counter
    for (const f of G.flyers) {
      const e = f.t * f.t;
      drawGem(f.x + (34 - f.x) * e, f.y + (64 - f.y) * e - Math.sin(Math.PI * f.t) * 60, f.v, tick * 0.2);

function unlockedCount() {
  if (prog.allOpen) return STAGES.length;
  let n = 1;
  for (let i = 0; i < STAGES.length; i++) if (prog.best[i]) n = i + 2;
  return Math.min(n, STAGES.length);
}

// Numbers that tick up to their new value instead of jumping.
function countUp(el, to) {
  const from = Number(el.dataset.v ?? to); el.dataset.v = to;
  if (from === to) { el.textContent = `${to}💎`; return; }
  const t0 = performance.now();
  const step = now => { const f = Math.min(1, (now - t0) / 700); el.textContent = `${Math.round(from + (to - from) * f)}💎`; if (f < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ---------------------------------------------------------------- daily dojo
// Ten quick questions: facts to practice first, then ones due for review (this is what turns silver into
// gold on a new day), then new facts from the current math. Once a day it grows the streak and pays gems.
const DOJO_N = 10, DOJO_TIME = 10, DOJO_FAST = 5;
let dojo = null;
function dojoQuestions() {
  const d = today(), seen = new Set(), out = [];
  const add = q => { const k = factKey(q); if (!seen.has(k) && out.length < DOJO_N) { seen.add(k); out.push(q); } };
  const all = Object.values(prog.facts);
  shuffle(all.filter(f => f.weak)).slice(0, 4).forEach(f => add(f.q));
  shuffle(all.filter(f => !f.weak && f.days.length === 1 && f.days[0] < d)).slice(0, 4).forEach(f => add(f.q));
  shuffle(all.filter(f => !f.weak && f.days.length >= 2 && d - f.last >= 4)).slice(0, 2).forEach(f => add(f.q));
  for (let i = 0; out.length < DOJO_N && i < 60; i++) add(curSkill().gen());
  return shuffle(out);
}
function startDojo() {
  hide('menu');
  const before = new Map(Object.entries(prog.facts).map(([k]) => [k, factStatus(k)]));
  dojo = { qs: dojoQuestions(), i: 0, right: 0, before, lock: false };
  show('dojo'); dojoNext();
}
function dojoNext() {
  if (dojo.i >= dojo.qs.length) { finishDojo(); return; }
  const q = dojo.qs[dojo.i];
  dojo.q = q; dojo.opts = rowChoices(q, 5); dojo.left = DOJO_TIME; dojo.lock = false; dojo.sel = 2;
  $('djProg').textContent = `${dojo.i + 1} / ${dojo.qs.length}`;
  $('djQ').innerHTML = q.missing ? q.text.replace('?', '<span class="padin">?</span>') : `${q.text} = <span class="padin">?</span>`;
  $('djMsg').textContent = '';
  const box = $('djKeys'); box.innerHTML = '';
  dojo.opts.forEach((v, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = v; b.onclick = () => dojoPick(i); box.appendChild(b); });
  dojoMark();
}
function dojoMark() { [...$('djKeys').children].forEach((b, i) => b.classList.toggle('sel', i === dojo.sel)); }
function dojoPick(i) {
  if (!dojo || dojo.lock) return;
  audio(); dojo.lock = true;
  const q = dojo.q, ok = i >= 0 && dojo.opts[i] === q.ans, btns = [...$('djKeys').children];
  noteFact(q, ok, DOJO_TIME - dojo.left <= DOJO_FAST, null);
  if (ok) { dojo.right++; sfx.correct(); btns[i].classList.add('right'); }
  else {
    sfx.wrong(); if (i >= 0) btns[i].classList.add('wrong');
    const j = dojo.opts.indexOf(q.ans); if (j >= 0) btns[j].classList.add('right');
    $('djMsg').textContent = i < 0 ? `Time's up! ${qSolved(q)}` : qSolved(q);
  }
  $('djQ').innerHTML = qSolved(q);
  setTimeout(() => { if (dojo) { dojo.i++; dojoNext(); } }, ok ? 650 : 1500);
}
function dojoTick(dt) {
  if (!dojo || dojo.lock || $('dojo').classList.contains('hidden')) return;
  dojo.left -= dt;
  $('djFuse').style.width = `${Math.max(0, dojo.left / DOJO_TIME) * 100}%`;
  $('djFuse').classList.toggle('low', dojo.left <= 3);
  if (dojo.left <= 0) dojoPick(-1);
}
function dojoKey(e) {
  e.preventDefault();
  if (!dojo || e.repeat) return;
  if (/^[1-5]$/.test(e.key)) dojoPick(Number(e.key) - 1);
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { dojo.sel = clamp(dojo.sel - 1, 0, 4); dojoMark(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { dojo.sel = clamp(dojo.sel + 1, 0, 4); dojoMark(); }
  else if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') dojoPick(dojo.sel);
}
function finishDojo() {
  const d = today(), dl = prog.daily, first = dl.last !== d;
  let gems = 0;
  if (first) {
    dl.streak = dl.last === d - 1 ? dl.streak + 1 : 1; dl.last = d; dl.best = Math.max(dl.best || 0, dl.streak);
    gems = 10 + 2 * Math.min(dl.streak, 10); prog.bank += gems; prog.stats.gems += gems;
    if (dl.streak >= 7) award('dojo7');
  }
  const golds = Object.keys(prog.facts).filter(k => factStatus(k) === 'gold' && dojo.before.get(k) !== 'gold').length;
  save(); checkTrophies();
  const right = dojo.right, n = dojo.qs.length; dojo = null; hide('dojo');
  let body = `<div class="bigicon">🔥<small>${dl.streak}</small></div><div class="statrow"><span>✔ ${right}/${n}</span>${gems ? `<span>💎 +${gems}</span>` : ''}${golds ? `<span>🥇 +${golds}</span>` : ''}</div>`;
  body += first ? `<div class="promo">${dl.streak > 1 ? `${dl.streak} days in a row!` : 'Come back tomorrow to grow your streak!'}</div>` : '<p>Extra practice! Your streak counts once a day.</p>';
  showMsg(first ? 'Dojo done!' : 'Nice practice!', body, [{ label: 'Play ▶', fn: toMenu, primary: true }, { label: '📒 Facts', fn: () => { hide('msg'); openFacts(); }, alt: true }]);
}

// ---------------------------------------------------------------- input
const KMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump' };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') $('pSave').click(); return; }   // typing a name
  audio();
  if (!$('dojo').classList.contains('hidden')) { dojoKey(e); return; }
  if (mode === 'pad' && ask && ask.keypad) {
    e.preventDefault();
    if (/^[0-9]$/.test(e.key)) padType(e.key);
    else if (e.key === 'Backspace') padType('⌫');
    else if (e.code === 'Enter' || e.code === 'NumpadEnter') padType('✓');
    return;
  }
  if (mode === 'pad') {
    e.preventDefault();
    if (e.repeat) return;   // a held jump key must not pick an answer by itself
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveSel(-1, 0);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveSel(1, 0);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') moveSel(0, -1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveSel(0, 1);
    else if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') pickAnswer(padSel);
    return;
  }
  if (mode === 'race') {
    if (!e.repeat && (e.code === 'ArrowLeft' || e.code === 'KeyA')) raceSteer(-1);
    if (!e.repeat && (e.code === 'ArrowRight' || e.code === 'KeyD')) raceSteer(1);
  }
  const k = KMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k === 'jump' && !keys.jump) keys.jumpPressed = true;
    keys[k] = true;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMuted(!muted);
  if (e.code === 'Enter' && msgPrimary && !$('msg').classList.contains('hidden')) msgPrimary.click();
});
window.addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (mode === 'play' || mode === 'race') togglePause(); });

const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// Phones ignore "user-scalable=no", so holding one button while tapping another could pinch-zoom the page.
// Block pinch and double-tap zoom directly, and undo a zoom if one slips through.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.scale > 1) e.preventDefault(); }, { passive: false });
// a soft click on every button press
document.addEventListener('pointerdown', e => { if (e.target.closest('button') && !e.target.closest('#touch')) { audio(); tone(660, 0.04, 'triangle', 0.035); } });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('button')) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
if (window.visualViewport) {
  const meta = document.querySelector('meta[name="viewport"]'), base = meta.content;
  window.visualViewport.addEventListener('resize', () => {
    if (window.visualViewport.scale > 1.01) {
      meta.content = base + ',minimum-scale=1';
      setTimeout(() => { meta.content = base; }, 300);
    }
  });
}
function showTouch(on) { if (isTouch && on) show('touch'); else hide('touch'); }
document.querySelectorAll('.tbtn').forEach(el => {
  const k = el.dataset.k;
  const down = e => {
    e.preventDefault(); audio();
    if (mode === 'race') raceSteer(k === 'left' ? -1 : k === 'right' ? 1 : 0);
    if (k === 'jump' && !keys.jump) keys.jumpPressed = true; keys[k] = true; el.classList.add('on');
  };
  const up = e => { e.preventDefault(); keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    dojoTick(STEP / 1000);
    if (mode === 'pad') tickPad(STEP / 1000);
    else if (mode === 'race' || mode === 'racedone') { tick++; updateRace(STEP / 1000); }
    else if (mode !== 'pause' && mode !== 'intro' && !RC) {
      if (G && G.freeze > 0) G.freeze--;                          // a tiny hit-stop when a boss is struck
      else if (G && G.slow > 0 && G.slow-- % 3) { /* slow motion after a boss falls */ }
      else update();
    }
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// Upright phones get a squarer view so everything stays big enough to read.
function layout() {
  const portrait = window.innerHeight > window.innerWidth;
  VW = portrait ? 540 : 960;
  if (cv.width !== VW) cv.width = VW;
  document.body.classList.toggle('portrait', portrait);
  const stage = $('stage');
  stage.style.aspectRatio = `${VW} / ${VH}`;
  stage.style.width = `min(100vw, calc(100dvh * ${VW} / ${VH}))`;
  if (!stage.style.width) stage.style.width = `min(100vw, calc(100vh * ${VW} / ${VH}))`;
}
window.addEventListener('resize', layout);
layout();
document.body.classList.toggle('touch', isTouch);
applyProg();
toMenu();
if (players.list.length > 1) showPlayers();   // shared device: ask who's playing first
else if (!prog.seenIntro) {
  prog.seenIntro = true; save();
  hide('menu'); showStory(() => { hide('msg'); show('menu'); });
}
requestAnimationFrame(frame);
})();
</script>
</body>
