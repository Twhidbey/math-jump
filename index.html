  if (cx < cam + VW + 60 && cx + 5 * T > cam - 60) HOMES[L.world.key](cx, b);
}

// ---------------------------------------------------------------- drawing: characters
function drawEnemy(e) {
  if (e.dead === 'gone' || (e.dead === 'squash' && e.t > 40)) return;
  const x = e.x, y = e.y;
  if (x > cam + VW + 40 || x < cam - 60) return;
  const step = Math.floor(e.t / 9) % 2;
  if (e.kind === 'blob') {
    if (!e.up) return;
    if (e.vy < 0) poly([[x + 4, y + 20], [x + 13, y + 40 + step * 6], [x + 22, y + 20]], 'rgba(255,120,0,.6)');
    const g = ctx.createRadialGradient(x + 13, y + 13, 3, x + 13, y + 13, 18);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffb300'); g.addColorStop(1, '#ff4500');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + 13, y + 13, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a1a00'; ctx.fillRect(x + 7, y + 9, 4, 5); ctx.fillRect(x + 15, y + 9, 4, 5);
    return;
  }
  ctx.save();
  if (e.dead === 'flip') { ctx.translate(x + e.w / 2, y + e.h / 2); ctx.scale(1, -1); ctx.translate(-x - e.w / 2, -y - e.h / 2); }
  if (e.dead === 'squash') { ctx.translate(0, y + e.h); ctx.scale(1, 0.3); ctx.translate(0, -y - e.h); }
  switch (e.kind) {
    case 'ninja': case 'shadow': {
      drawBaked(ENEMY_SPR[e.kind], !e.onGround && !e.dead ? 'jump' : step ? 'walkA' : 'stand', e.vx < 0, e);
      break;
    }
    case 'rock': {
      ctx.fillStyle = '#3d3431';
      ctx.fillRect(x + 3 + (step ? 3 : 0), y + 24, 11, 6); ctx.fillRect(x + 20 - (step ? 3 : 0), y + 24, 11, 6);
      ctx.fillStyle = '#7d706a'; rrect(x, y + 2, 34, 25, 11); ctx.fill();
      ctx.fillStyle = '#62564f'; ctx.beginPath(); ctx.arc(x + 9, y + 8, 4, 0, 7); ctx.arc(x + 26, y + 20, 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffb300'; const look = e.vx > 0 ? 2 : -2;
      ctx.fillRect(x + 9 + look, y + 12, 6, 4); ctx.fillRect(x + 20 + look, y + 12, 6, 4);
      ctx.strokeStyle = '#3d3431'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + 7, y + 8); ctx.lineTo(x + 15, y + 11); ctx.moveTo(x + 28, y + 8); ctx.lineTo(x + 20, y + 11); ctx.stroke();
      break;
    }
    case 'robot': {
      ctx.fillStyle = '#333'; ctx.fillRect(x + 5, y + 28 + (step ? 0 : 2), 7, 8); ctx.fillRect(x + 18, y + 28 + (step ? 2 : 0), 7, 8);
      ctx.fillStyle = '#5a6778'; ctx.fillRect(x + 2, y + 12, 26, 18);
      ctx.fillStyle = '#9aa7b8'; ctx.fillRect(x + 4, y + 14, 22, 14);
      ctx.fillStyle = '#5a6778'; ctx.fillRect(x + 6, y + 2, 18, 11);
      ctx.fillStyle = Math.floor(tick / 15) % 2 ? '#4cf' : '#2a9fd6'; ctx.fillRect(x + 8, y + 5, 14, 5);
      ctx.strokeStyle = '#5a6778'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 15, y + 2); ctx.lineTo(x + 15, y - 5); ctx.stroke();
      ctx.fillStyle = Math.floor(tick / 20) % 2 ? '#ff3355' : '#661020'; ctx.beginPath(); ctx.arc(x + 15, y - 6, 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 12, y + 18, 6, 6);
      break;
    }
  }
  ctx.restore();
}

function drawBoss() {
  const b = L.boss; if (!b || b.dead) return;
  if (b.flash > 0 && Math.floor(b.flash / 3) % 2) return;
  const box = { x: b.x + (b.dying ? (Math.random() - 0.5) * 6 : 0), y: b.y, w: b.w, h: b.h };
  drawBaked(BOSS_SPR[b.kind], Math.floor(b.t / 12) % 2 ? 'b' : 'a', b.face > 0, box);
  if (L.arena.phase === 'open' && !b.dying && !L.arena.wait) {
    for (let k = 0; k < 3; k++) {
      const a = tick * 0.08 + k * 2.09;
      drawShuriken(b.x + b.w / 2 + Math.cos(a) * b.w * 0.45, b.y - 12 + Math.sin(a) * 6, tick * 0.2, '#ffd23f', '#b8860b', 7);
    }
  }
}

function drawProjectiles() {
  for (const p of L.proj) {
    if (p.k === 'star') drawShuriken(p.x, p.y, tick * 0.4, '#b388ff', '#4b2a6b', 11);
    else if (p.k === 'laser') {
      ctx.fillStyle = 'rgba(255,51,85,.35)'; rrect(p.x - 18, p.y - 8, 36, 16, 8); ctx.fill();
      ctx.fillStyle = '#ff6b81'; rrect(p.x - 14, p.y - 4, 28, 8, 4); ctx.fill();
    } else {
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r + 4);
      if (p.k === 'rock') { g.addColorStop(0, '#ffb300'); g.addColorStop(0.5, '#7d4a30'); g.addColorStop(1, 'rgba(60,30,20,0)'); }
      else { g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#b388ff'); g.addColorStop(1, 'rgba(90,40,160,0)'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4, 0, 7); ctx.fill();
    }
  }
  for (const s of G.shots) drawShuriken(s.x, s.y, s.spin);
  if (L.prize) {
    const z = L.prize, cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    const g = ctx.createRadialGradient(cx, cy, 5, cx, cy, 50);
    g.addColorStop(0, 'rgba(255,230,120,.8)'); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 50, 0, 7); ctx.fill();
    drawScroll(cx, cy + Math.sin(tick * 0.1) * 3, 1.8);
  }
}

function drawPet() {
  const pt = G.pet; if (!pt) return;
  const m = pt.moodT > 0 ? pt.mood : null;
  let ox = 0, oy = 0, flip = P.face < 0;
  if (m === 'happy' || m === 'wow') oy = -Math.abs(Math.sin(pt.moodT * 0.25)) * 14;
  else if (m === 'sad' || m === 'hurt') ox = Math.sin(pt.moodT * 1.3) * 3;
  else if (m === 'dance') { oy = -Math.abs(Math.sin(pt.moodT * 0.3)) * 16; flip = Math.floor(pt.moodT / 10) % 2 === 0; }
  drawBaked(PET_SPR[prog.equip.pet], Math.floor(tick / 10) % 2 ? 'b' : 'a', flip, { x: pt.x - 10 + ox, y: pt.y + oy, w: 20, h: 24 });
  if (G.bubble) {
    ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
    const w = ctx.measureText(G.bubble.txt).width + 16, bx = pt.x + ox - w / 2, by = pt.y + oy - 34;
    ctx.fillStyle = '#ffffff'; rrect(bx, by, w, 24, 10); ctx.fill();
    poly([[pt.x + ox - 5, by + 23], [pt.x + ox + 5, by + 23], [pt.x + ox, by + 30]], '#ffffff');
    ctx.fillStyle = '#22224a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(G.bubble.txt, pt.x + ox, by + 12);
  }
}

function drawPlayer() {
  const p = P;
  if (p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0) return;
  if ((mode === 'win' || mode === 'done') && !L.boss && p.x > (L.castleC + 2.2) * T) return;
  let k = 'stand';
  if (p.throwT > 0 || (!p.onGround && mode !== 'win')) k = 'jump';
  else if (Math.abs(p.vx) > 0.3) k = Math.floor(p.anim) % 2 ? 'walkA' : 'stand';
  if (hasPower('fire')) {
    const g = ctx.createRadialGradient(p.x + p.w / 2, p.y + p.h / 2, 6, p.x + p.w / 2, p.y + p.h / 2, 40);
    g.addColorStop(0, 'rgba(255,140,0,.5)'); g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g; ctx.fillRect(p.x - 30, p.y - 20, p.w + 60, p.h + 40);
  }
  // squash when landing, stretch when jumping, anchored at the feet
  const f = (p.squash || 0) / 8, sx = f > 0 ? 1 + 0.25 * f : 1 + 0.15 * f, sy = f > 0 ? 1 - 0.2 * f : 1 - 0.15 * f;
  ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h); ctx.scale(sx, sy); ctx.translate(-(p.x + p.w / 2), -(p.y + p.h));
  drawBaked(SPR, k, p.face < 0, p);
  ctx.restore();
  if (hasPower('shield')) {
    ctx.strokeStyle = `rgba(125,249,255,${0.5 + 0.3 * Math.sin(tick * 0.2)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + p.h / 2, 34, 0, 7); ctx.stroke();
  }
  if (G.carry) {
    const sx = p.x + p.w / 2 - 15, sy = p.y - 34;
    ctx.fillStyle = '#4a5266'; rrect(sx, sy, 30, 26, 6); ctx.fill(); ctx.fillStyle = '#9aa3b5'; rrect(sx + 2, sy + 2, 26, 22, 5); ctx.fill();
    ctx.fillStyle = '#1f2433'; ctx.font = `bold ${G.carry.stone.val >= 100 ? 13 : 17}px "Trebuchet MS", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(G.carry.stone.val, p.x + p.w / 2, sy + 14);
  }
}

function drawParticles() {
  for (const p of G.parts) {
    const a = Math.min(1, p.life / 20);
    if (p.k === 'bit') { ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
    else if (p.k === 'coin') { ctx.globalAlpha = a; drawGem(p.x, p.y, p.v || 5, p.life * 0.4); }
    else if (p.k === 'text') {
      ctx.globalAlpha = a; ctx.font = `bold ${p.size}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(p.txt, p.x, p.y);
      ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- drawing: Sensei's tip
const SENSEI_SPR = bake(makeFrames(18, 18, { s: '#f2c49b', S: '#d9a273', w: '#f4f4f4', W: '#cfcfd8', e: '#16121f', g: '#4a5a7a', G: '#6b7fa8' }, ({ P, R, E }) => {
  R(3, 12, 12, 6, 'g'); R(4, 12, 2, 6, 'G');
  E(9, 6, 4.2, 4.4, 's'); P(7, 3, 'w'); P(8, 3, 'S');
  R(5, 5, 3, 1, 'w'); R(10, 5, 3, 1, 'w'); P(6, 6, 'e'); P(11, 6, 'e');
  E(9, 11, 3.6, 3.4, 'w'); E(9, 14, 2.2, 2.6, 'W'); R(7, 8, 4, 1, 'w');
}, 1), ['a'], 3);
function wrapLines(txt, maxW) {
  const lines = []; let cur = '';
  for (const w of txt.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawTip() {
  // slides down under the question banner, so it never covers the ninja
  const t = G.tip, w = Math.min(560, VW - 24), h = 100, x = (VW - w) / 2, slide = Math.min(1, (420 - t.t) / 14, t.t / 14);
  const top = VW < 700 ? 196 : 104, y = top - (1 - slide) * (top + h + 20);
  ctx.fillStyle = 'rgba(20,20,50,.92)'; rrect(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.drawImage(SENSEI_SPR.a[0], x + 10, y + 22);
  ctx.font = 'bold 15px "Trebuchet MS", sans-serif'; ctx.fillStyle = '#ffd23f'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText("Sensei's tip", x + 76, y + 10);
  ctx.font = '16px "Trebuchet MS", sans-serif'; ctx.fillStyle = '#ffffff';
  wrapLines(t.txt, w - 92).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, x + 76, y + 32 + i * 20));
}

// ---------------------------------------------------------------- drawing: HUD
function heart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s, x, y + s * 1.2);
  ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.7, x + s, y + s * 0.3);
  ctx.bezierCurveTo(x + s, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.3);
  ctx.fill();
}
function hudText(txt, x, y, size, col = '#fff', align = 'left') {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
}

function drawHUD() {
  const narrow = VW < 700, st = STAGES[G.idx];
  for (let i = 0; i < G.maxHearts; i++) heart(30 + i * 36, 16, 13, i < G.hearts ? '#ff4d6d' : 'rgba(0,0,0,.35)');
  drawGem(34, 64, 1, tick * 0.06);
  hudText('× ' + G.coins, 54, 65, 22 + G.pulse);
  if (G.streak >= 2) hudText(`🔥 ${G.streak} in a row`, 20, 100, 18, '#ffb627');
  if (G.power) { const pw = POWERS[G.power.kind]; hudText(`${pw.icon} ${pw.name} ${Math.ceil(G.power.t / 60)}s`, 20, 126, 17, '#7df9ff'); }
  const label = st.boss ? `World ${st.w + 1}: Boss` : `Level ${st.label}: ${st.name}`;
  if (narrow) hudText('Score ' + G.score, VW - 72, 64, 20, '#ffd23f', 'right');
  else {
    hudText(label, VW - 70, 26, 18, '#fff', 'right');
    hudText('Score ' + G.score, VW - 70, 52, 20, '#ffd23f', 'right');
  }

  const cur = currentStation(), by = narrow ? 92 : 10;   // banner sits below the hearts on narrow screens
  const br = activeBridge();
  let txt;
  if (L.vault) txt = 'Secret vault!';
  else if (br) txt = `Make ${br.target}!`;
  else if (cur) txt = qShow(cur.q);
  else if (L.boss) txt = L.boss.dead || L.boss.dying ? 'Grab the scroll!' : L.arena.wait ? 'Nice hit!' : `Dodge! ${Math.ceil(L.arena.phaseT / 60)}`;
  else txt = 'Get the scroll piece!';
  ctx.font = 'bold 38px "Trebuchet MS", sans-serif';
  const w = Math.max(240, ctx.measureText(txt).width + 50);
  ctx.fillStyle = 'rgba(20,20,50,.75)'; rrect(VW / 2 - w / 2, by, w, 64, 14); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, VW / 2, by + 34);

  if (L.boss) {
    const b = L.boss, bw = Math.min(320, VW - 60), bx = VW / 2 - bw / 2, segW = bw / b.max;
    hudText(b.name, VW / 2, by + 80, 16, '#ffb3b3', 'center');
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rrect(bx - 3, by + 91, bw + 6, 16, 6); ctx.fill();
    for (let i = 0; i < b.max; i++) {
      ctx.fillStyle = i < b.hp ? '#ff3355' : '#3a1a22';
      ctx.fillRect(bx + i * segW + 1, by + 94, segW - 2, 10);
    }
    if (currentStation()) {
      hudText('Attack now! Bonk the keypad block', VW / 2, by + 124, 15, '#ffd23f', 'center');
      const f = L.arena.phaseT / OPEN_FRAMES(), ww = 160;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(VW / 2 - ww / 2, by + 136, ww, 5);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(VW / 2 - ww / 2, by + 136, ww * f, 5);
    } else if (!L.boss.dying && !L.boss.dead && !L.arena.wait) hudText('Jump over the attacks!', VW / 2, by + 124, 15, '#fff', 'center');
  } else if (L.vault) {
    hudText('Grab the gems, then take the exit door', VW / 2, by + 80, 16, '#fff', 'center');
  } else if (br) {
    hudText(`Bonk number stones, carry them to the altar · so far ${br.total}`, VW / 2, by + 80, 16, '#fff', 'center');
  } else {
    const done = L.stations.filter(s => s.solved).length;
    hudText(cur ? `Bonk the right answer!  (${done}/${L.stations.length})` : `All ${L.stations.length} gates open!`, VW / 2, by + 80, 16, '#fff', 'center');
  }
}

function render() {
  if (RC) { renderRace(); return; }
  drawBackground();
  const shk = G && G.shake > 0 ? G.shakeAmp : 0;
  ctx.save(); ctx.translate(-Math.round(cam) + (Math.random() - 0.5) * 2 * shk, (Math.random() - 0.5) * 2 * shk);
  for (const d of L.decor) if (d * T > cam - 80 && d * T < cam + VW + 40) drawDecor(d);
  drawSigns();
  drawPuzzles();
  if (!L.boss && !L.vault) drawGoal();
  const c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(L.w - 1, c0 + Math.ceil(VW / T) + 1);
  drawTiles();
  for (const c of L.coins) if (!c.taken && c.x > cam - 20 && c.x < cam + VW + 20) drawGem(c.x, c.y + Math.sin(tick * 0.08 + c.x) * 3, c.v, tick * 0.08 + c.x);
  for (const e of L.enemies) drawEnemy(e);
  drawPits(c0, c1);   // after enemies, so lava blobs rise out of the lava
  drawBoss();
  if (G) { drawPet(); drawPlayer(); drawProjectiles(); drawParticles(); }
  ctx.restore();
  if (G) {
    drawHUD();
    // gems fly up into the counter
    for (const f of G.flyers) {
      const e = f.t * f.t;
      drawGem(f.x + (34 - f.x) * e, f.y + (64 - f.y) * e - Math.sin(Math.PI * f.t) * 60, f.v, tick * 0.2);
    }
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.7})`; ctx.fillRect(0, 0, VW, VH); }
    if (G.tip) drawTip();
  }
}

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const beltHTML = b => `<span class="belt" style="background:${b.col}"></span>`;
let msgPrimary = null;

function showMsg(title, body, btns) {
  $('msgTitle').textContent = title;
  $('msgBody').innerHTML = body;
  const box = $('msgBtns'); box.innerHTML = ''; msgPrimary = null;
  for (const b of btns) {
    const el = document.createElement('button');
    el.className = 'btn' + (b.alt ? ' alt' : ''); el.textContent = b.label;
    el.onclick = () => { audio(); b.fn(); };
    box.appendChild(el);
    if (b.primary) msgPrimary = el;
  }
  show('msg');
}

function startStage(i) {
  const st = STAGES[i], W = WORLDS[st.w];
  RC = null; document.body.classList.remove('racing');
  playMusic(st.boss ? 'boss' : W.key);
  L = st.boss ? buildArena(i, prog.easy) : buildLevel(i, prog.easy);
  P = { x: 1.5 * T, y: GR * T - 44, w: 24, h: 44, vx: 0, vy: 0, onGround: false, face: 1, inv: 0, anim: 0, coyote: 0, jbuf: 0, throwT: 0 };
  const hearts = prog.easy ? 5 : 3;
  G = { idx: i, skill: L.skill, hearts, maxHearts: hearts, coins: 0, score: 0, shake: 0, shakeAmp: 0, freeze: 0, slow: 0, flash: 0, flyers: [], pulse: 0, chain: 0, lastGem: -99, mistakes: 0, streak: 0, bestStreak: 0, missed: [], practice: new Map(), power: null, powerN: 0, carry: null, saved: null,
    pet: prog.equip.pet ? { x: P.x, y: P.y, mood: null, moodT: 0 } : null, bubble: null, tip: null, wrongRun: 0, checkpoint: 1.5 * T, time: 0, parts: [], shots: [], bumps: new Map(), winT: 0 };
  SPR = bakeNinja(heroPal());   // equipped headband and suit, plus the belt you've earned
  cam = 0; ambient.length = 0;
  hide('menu');
  if (st.boss) {
    intro(`BOSS: ${W.boss.name}`, `<p class="taunt">“${W.boss.taunt}”</p>
      <p>First <b>dodge</b> the attacks. When the boss gets dizzy, bonk the keypad block and pick the right answer to throw a shuriken!</p>`, 'Fight!');
  } else if (!prog.seenWorld[st.w]) {
    prog.seenWorld[st.w] = true; save();
    intro(`World ${st.w + 1}: ${W.name}`, `<p>${W.intro}</p>`, "Let's go!");
  } else begin();
}
function intro(title, body, label) { mode = 'intro'; hide('pauseBtn'); showTouch(false); showMsg(title, body, [{ label, fn: begin, primary: true }]); }
function begin() { mode = 'play'; hide('msg'); show('pauseBtn'); showTouch(true); }

function unlockedCount() {
  if (prog.allOpen) return STAGES.length;
  let n = 1;
  for (let i = 0; i < STAGES.length; i++) if (prog.best[i]) n = i + 2;
  return Math.min(n, STAGES.length);
}

function buildMenu() {
  const pts = totalPoints(), b = beltFor(pts), k = curSkill();
  $('rank').innerHTML = `${beltHTML(b)} <span><b>${b.name} Belt</b> · ${pts} pts</span>`;
  $('skillChip').innerHTML = `🧮 ${k.name} <span class="tier">${stars(k.tier)}</span> ✎`;
  $('bankMenu').textContent = `${prog.bank}💎`;
  $('badgeMenu').textContent = `${BADGES.filter(x => prog.badges[x.id]).length}/${BADGES.length}`;
  const box = $('worlds'); box.innerHTML = '';
  const open = unlockedCount();
  WORLDS.forEach((W, w) => {
    const won = !!prog.best[w * 3 + 2], found = [0, 1].filter(j => prog.best[w * 3 + j]).length;
    const div = document.createElement('div'); div.className = 'world';
    div.innerHTML = `<div class="wname">${w + 1} · ${W.name}<span>📜 ${won ? '✔' : `${found}/2`}</span></div><div class="stages"></div>`;
    const row = div.querySelector('.stages');
    STAGES.forEach((st, i) => {
      if (st.w !== w) return;
      const el = document.createElement('button'), locked = i >= open, best = prog.best[i];
      el.className = 'lvl' + (st.boss ? ' boss' : ''); el.disabled = locked;
      const d = best ? best.dots : 0;
      el.innerHTML = `<span class="num">${st.boss ? 'BOSS' : st.label}</span><br>${st.boss ? W.boss.name : st.name}` +
        `<span class="dots">${locked ? '🔒' : '●'.repeat(d) + '○'.repeat(3 - d) + (st.boss ? '' : prog.golden[i] ? ' 🌟' : ' ☆')}</span>`;
      el.onclick = () => { audio(); confirmStage(i); };
      row.appendChild(el);
    });
    box.appendChild(div);
  });
}

// Tapping a level shows which math it will use, with a quick way to change it.
function confirmStage(i) {
  const st = STAGES[i], W = WORLDS[st.w], k = curSkill();
  hide('menu');
  showMsg(st.boss ? W.boss.name : `${st.label} · ${st.name}`, `<p class="mathline">Math: <b>${k.name}</b> <span class="tier">${stars(k.tier)}</span><br>
    <small>like ${k.ex} · 💎 ×${TIER_GEMS[k.tier - 1]}</small></p>`,
    [{ label: 'Start ▶', fn: () => startStage(i), primary: true }, { label: 'Change math', fn: () => openSkills(() => confirmStage(i)), alt: true }, { label: 'Back', fn: toMenu, alt: true }]);
}

// The skill picker: tabs for each kind of math, every skill showing its stars, gem bonus and best medal.
let skillsThen = null, skillTab = null;
function openSkills(then) {
  skillsThen = then; skillTab = curSkill().cat;
  hide('menu'); hide('msg'); renderSkills(); show('skills');
}
function renderSkills() {
  $('skillTabs').innerHTML = '';
  for (const [cat, label] of SKILL_CATS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.className = cat === skillTab ? 'on' : '';
    b.onclick = () => { skillTab = cat; renderSkills(); };
    $('skillTabs').appendChild(b);
  }
  $('skillGrid').innerHTML = '';
  for (const k of SKILLS.filter(x => x.cat === skillTab)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'skill' + (k.id === prog.skill ? ' on' : '');
    const medal = ['', '🥉', '🥈', '🥇'][prog.mastery[k.id] || 0];
    b.innerHTML = `<span class="sn">${k.name} ${medal}</span><span class="se">like ${k.ex}</span><span class="st">${stars(k.tier)}</span><span class="sm">💎 ×${TIER_GEMS[k.tier - 1]}</span>`;
    b.onclick = () => { audio(); prog.skill = k.id; save(); hide('skills'); (skillsThen || toMenu)(); };
    $('skillGrid').appendChild(b);
  }
}
function showHowTo() {
  hide('menu');
  const row = (icon, txt) => `<div><span>${icon}</span><p style="margin:0">${txt}</p></div>`;
  showMsg('How to play', `<div class="howto">
    ${row('🕹️', isTouch ? 'Use ◀ ▶ to run and ▲ to jump.' : 'Arrow keys or A / D to run, Space or ↑ to jump, P to pause.')}
    ${row('⛩️', 'Jump up and bonk the block with the right answer to open each gate.')}
    ${row('💎', 'Grab gems: green = 1, blue = 5, red = 10. Spend them in the Dojo Shop.')}
    ${row('🌉', 'Bridges: bonk number stones and carry them to the altar to make the exact number.')}
    ${row('👹', 'Bosses: dodge first. When the boss is dizzy, bonk the keypad block and pick the answer.')}
    ${row('🧮', 'Pick any math for any level. Harder math ★ earns more gems and belt points.')}
    ${row('🐣', 'Easy mode (in Settings): no holes, slower enemies, more time and 5 hearts.')}</div>`,
    [{ label: 'Got it!', fn: () => { hide('msg'); show('menu'); }, primary: true }]);
}// ---------------------------------------------------------------- dojo shop
// Buying asks for the change: "you have 52, it costs 35, how many will you have left?"
function drawNinjaPreview(cv, equip, scale) {
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); c.imageSmoothingEnabled = false;
  const set = bake(makeFrames(16, 16, { ...KAI_PAL, ...heroPal(equip) }, drawKai, 1), ['stand'], scale);
  c.drawImage(set.stand[0], equip.pet ? 4 : (cv.width - 16 * scale) / 2, cv.height - 16 * scale - 2);
  if (equip.pet) c.drawImage(PET_SPR[equip.pet].a[0], 16 * scale + 8, cv.height - 12 * 3 - 2);
}
function drawItemPreview(cv, it) {
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); c.imageSmoothingEnabled = false;
  if (it.slot === 'band' || it.slot === 'suit') {
    const set = bake(makeFrames(16, 16, { ...KAI_PAL, ...heroPal({ ...prog.equip, [it.slot]: it.id }) }, drawKai, 1), ['stand'], 3);
    c.drawImage(set.stand[0], (cv.width - 48) / 2, cv.height - 48);
  } else if (it.slot === 'pet') c.drawImage(PET_SPR[it.id].a[0], (cv.width - 42) / 2, cv.height - 40);
  else {
    const cols = it.id === 'trail-fire' ? ['#ff6a00', '#ffd23f', '#ff3b1f'] : ['#ffffff', '#fff3a0', '#9be7ff'];
    for (let i = 0; i < 18; i++) { c.fillStyle = cols[i % 3]; c.fillRect(8 + i * 4, cv.height - 10 - Math.abs(Math.sin(i * 1.3)) * 30, 5, 5); }
  }
}
function openShop() { hide('menu'); hide('buyBox'); renderShop(); show('shop'); }
function renderShop() {
  $('bank').textContent = prog.bank;
  drawNinjaPreview($('shopPreview'), prog.equip, 3);
  const grid = $('shopGrid'); grid.innerHTML = '';
  for (const it of SHOP) {
    const owned = prog.owned.includes(it.id), on = prog.equip[it.slot] === it.id;
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<canvas width="90" height="54"></canvas><div class="nm">${it.name}</div><div class="pr">${owned ? 'Owned' : `💎 ${it.price}`}</div><button type="button"></button>`;
    drawItemPreview(el.querySelector('canvas'), it);
    const b = el.querySelector('button');
    if (it.badge && !prog.badges[it.badge] && !owned) { b.textContent = '🔒 Badge: Golden Hunter'; b.disabled = true; el.querySelector('.pr').textContent = 'Find all 8 golden gems'; }
    else if (on) { b.textContent = it.slot === 'trail' || it.slot === 'pet' ? 'Take off' : 'Wearing'; b.disabled = !(it.slot === 'trail' || it.slot === 'pet'); }
    else if (owned) b.textContent = 'Wear';
    else if (prog.bank >= it.price) { b.textContent = 'Buy'; b.className = 'buy'; }
    else { b.textContent = `Need ${it.price - prog.bank} more`; b.disabled = true; }
    b.onclick = () => {
      audio();
      if (on) { prog.equip[it.slot] = null; save(); renderShop(); }
      else if (owned) { prog.equip[it.slot] = it.id; save(); renderShop(); }
      else askChange(it);
    };
    grid.appendChild(el);
  }
}
function askChange(it) {
  const left = prog.bank - it.price, box = $('buyBox');
  const opts = shuffle(choices({ a: prog.bank, b: it.price, op: '−', ans: left }, 3));
  box.innerHTML = `<p>You have <b>${prog.bank}</b> gems. The ${it.name} costs <b>${it.price}</b>.<br>How many will you have left?</p><div class="row"></div>`;
  const row = box.querySelector('.row');
  opts.forEach(v => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = v;
    b.onclick = () => {
      if (v === left) {
        prog.bank = left; prog.owned.push(it.id); prog.equip[it.slot] = it.id; save(); award('shopper');
        sfx.win(); hide('buyBox'); renderShop();
      } else { sfx.wrong(); b.disabled = true; box.querySelector('p').innerHTML += '<br><b>Not quite. Count again!</b>'; }
    };
    row.appendChild(b);
  });
  const no = document.createElement('button'); no.type = 'button'; no.className = 'no'; no.textContent = 'Not now';
  no.onclick = () => hide('buyBox'); row.appendChild(no);
  show('buyBox'); box.scrollIntoView({ block: 'nearest' });
}

function toMenu() {
  mode = 'menu'; G = null; P = null; RC = null; document.body.classList.remove('racing'); playMusic('menu');
  const newest = Math.min(unlockedCount() - 1, STAGES.length - 1);
  L = buildLevel(STAGES[newest].w * 3);   // menu backdrop shows the newest world
  ambient.length = 0;
  hide('msg'); hide('shop'); hide('skills'); hide('settings'); hide('badges'); hide('raceSetup'); hide('pauseBtn'); showTouch(false); buildMenu(); show('menu');
}

function showStory(then) {
  showMsg('The Stolen Scrolls', `<div class="bigicon">🥷📜</div><p>${STORY}</p>`, [{ label: "Let's go!", fn: then, primary: true }]);
}

let pausedMode = 'play';
function togglePause() {
  if (mode === 'play' || mode === 'race') {
    pausedMode = mode; mode = 'pause'; showTouch(false);
    showMsg('Paused', '<p>Take a breath, ninja!</p>', [
      { label: 'Resume', fn: togglePause, primary: true },
      { label: 'Restart', fn: () => (pausedMode === 'race' ? startRace() : startStage(G.idx)), alt: true },
      { label: pausedMode === 'race' ? 'Menu' : 'Levels', fn: toMenu, alt: true },
    ]);
  } else if (mode === 'pause') { mode = pausedMode; hide('msg'); showTouch(true); }
}

function setMusic(on) { musicOn = prog.music = on; save(); $('musicBtn').textContent = on ? '🎵 Music on' : '🎵 Music off'; }
function setMuted(m) { muted = m; $('muteBtn').textContent = muted ? '🔇 Sound off' : '🔊 Sound on'; }
function setEasy(on) { prog.easy = on; save(); $('easyBtn').textContent = on ? '🐣 Easy mode: on' : '🐣 Easy mode: off'; }
// Levels open by finishing the one before; "unlock all" is a switch on top that can be turned back off.
function setAllOpen(on) {
  prog.allOpen = on; save(); buildMenu();
  $('unlockBtn').textContent = on ? '🔒 Lock levels again' : '🔓 Unlock all levels';
}

$('muteBtn').onclick = () => setMuted(!muted);
$('musicBtn').onclick = () => { audio(); setMusic(!musicOn); };
$('easyBtn').onclick = () => setEasy(!prog.easy);
$('unlockBtn').onclick = () => setAllOpen(!prog.allOpen);
$('storyBtn').onclick = () => { hide('settings'); showStory(() => { hide('msg'); show('menu'); }); };
$('skillChip').onclick = () => { audio(); openSkills(toMenu); };
$('skillsClose').onclick = () => { hide('skills'); (skillsThen || toMenu)(); };
$('raceGo').onclick = () => { audio(); startRace(); };
$('raceBack').onclick = () => { hide('raceSetup'); toMenu(); };
$('raceMathBtn').onclick = () => { hide('raceSetup'); openSkills(showRaceSetup); };
$('settingsBtn').onclick = () => { audio(); hide('menu'); show('settings'); };
$('settingsClose').onclick = () => { hide('settings'); buildMenu(); show('menu'); };
$('helpBtn').onclick = () => { audio(); showHowTo(); };
$('resetBtn').onclick = () => {
  if (confirm('Reset all belts, points and unlocked levels?')) { prog.best = {}; prog.mastery = {}; prog.seenWorld = {}; setAllOpen(false); }
};
$('pauseBtn').onclick = togglePause;
$('shopBtn').onclick = () => { audio(); openShop(); };
$('raceBtn').onclick = () => { audio(); showRaceSetup(); };
$('shopClose').onclick = () => { hide('shop'); buildMenu(); show('menu'); };
$('badgeBtn').onclick = () => { audio(); openBadges(); };
$('badgesClose').onclick = () => { hide('badges'); buildMenu(); show('menu'); };

// ---------------------------------------------------------------- input
const KMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump' };
window.addEventListener('keydown', e => {
  audio();
  if (mode === 'pad') {
    e.preventDefault();
    if (e.repeat) return;   // a held jump key must not pick an answer by itself
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveSel(-1, 0);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveSel(1, 0);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') moveSel(0, -1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveSel(0, 1);
    else if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') pickAnswer(padSel);
    return;
  }
  if (mode === 'race') {
    if (!e.repeat && (e.code === 'ArrowLeft' || e.code === 'KeyA')) raceSteer(-1);
    if (!e.repeat && (e.code === 'ArrowRight' || e.code === 'KeyD')) raceSteer(1);
  }
  const k = KMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k === 'jump' && !keys.jump) keys.jumpPressed = true;
    keys[k] = true;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMuted(!muted);
  if (e.code === 'Enter' && msgPrimary && !$('msg').classList.contains('hidden')) msgPrimary.click();
});
window.addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (mode === 'play' || mode === 'race') togglePause(); });

const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// Phones ignore "user-scalable=no", so holding one button while tapping another could pinch-zoom the page.
// Block pinch and double-tap zoom directly, and undo a zoom if one slips through.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.scale > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('button')) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
if (window.visualViewport) {
  const meta = document.querySelector('meta[name="viewport"]'), base = meta.content;
  window.visualViewport.addEventListener('resize', () => {
    if (window.visualViewport.scale > 1.01) {
      meta.content = base + ',minimum-scale=1';
      setTimeout(() => { meta.content = base; }, 300);
    }
  });
}
function showTouch(on) { if (isTouch && on) show('touch'); else hide('touch'); }
document.querySelectorAll('.tbtn').forEach(el => {
  const k = el.dataset.k;
  const down = e => {
    e.preventDefault(); audio();
    if (mode === 'race') raceSteer(k === 'left' ? -1 : k === 'right' ? 1 : 0);
    if (k === 'jump' && !keys.jump) keys.jumpPressed = true; keys[k] = true; el.classList.add('on');
  };
  const up = e => { e.preventDefault(); keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    if (mode === 'pad') tickPad(STEP / 1000);
    else if (mode === 'race' || mode === 'racedone') { tick++; updateRace(STEP / 1000); }
    else if (mode !== 'pause' && mode !== 'intro' && !RC) {
      if (G && G.freeze > 0) G.freeze--;                          // a tiny hit-stop when a boss is struck
      else if (G && G.slow > 0 && G.slow-- % 3) { /* slow motion after a boss falls */ }
      else update();
    }
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// Upright phones get a squarer view so everything stays big enough to read.
function layout() {
  const portrait = window.innerHeight > window.innerWidth;
  VW = portrait ? 540 : 960;
  if (cv.width !== VW) cv.width = VW;
  document.body.classList.toggle('portrait', portrait);
  const stage = $('stage');
  stage.style.aspectRatio = `${VW} / ${VH}`;
  stage.style.width = `min(100vw, calc(100dvh * ${VW} / ${VH}))`;
  if (!stage.style.width) stage.style.width = `min(100vw, calc(100vh * ${VW} / ${VH}))`;
}
window.addEventListener('resize', layout);
layout();
document.body.classList.toggle('touch', isTouch);
setEasy(prog.easy === null ? isTouch : prog.easy);   // touch devices start in easy mode
setAllOpen(prog.allOpen);
setMusic(prog.music !== false);
toMenu();
if (!prog.seenIntro) {
  prog.seenIntro = true; save();
  hide('menu'); showStory(() => { hide('msg'); show('menu'); });
}
requestAnimationFrame(frame);
})();
</script>
