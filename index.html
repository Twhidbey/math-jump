<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Ninja">
<meta name="theme-color" content="#14142b">
<title>Math Ninja</title>
<style>
  html { touch-action: none; }
  html, body { margin: 0; height: 100%; background: #14142b; overflow: hidden;
    font-family: "Trebuchet MS", system-ui, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  #game { width: 100%; height: 100%; display: block; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; background: rgba(12, 12, 35, .78); color: #fff; text-align: center;
    padding: 16px; box-sizing: border-box; overflow-y: auto; z-index: 10; touch-action: pan-y; }
  /* Auto margins centre short content but let tall content scroll from the top. */
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .hidden { display: none !important; }
  h1 { font-size: clamp(30px, 6vw, 56px); margin: 0 0 6px; color: #ffd23f; letter-spacing: 3px;
    text-shadow: 4px 4px 0 #d9452b, 8px 8px 0 #000; }
  .tag { margin: 4px 0 8px; font-size: clamp(14px, 2vw, 18px); max-width: 640px; }
  .rank { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;
    background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 14px; margin: 6px 0; font-size: 16px; }
  .rank b { color: #ffd23f; }
  .belt { display: inline-block; width: 64px; height: 12px; border-radius: 3px; border: 2px solid rgba(0,0,0,.55);
    vertical-align: middle; position: relative; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .belt::after { content: ''; position: absolute; left: 50%; top: -5px; width: 12px; height: 18px; margin-left: -8px;
    background: inherit; border: 2px solid rgba(0,0,0,.55); border-radius: 3px; }
  .worlds { width: min(720px, 100%); margin: 4px 0; }
  .world { background: rgba(255,255,255,.07); border-radius: 14px; padding: 6px 8px 8px; margin: 6px 0; }
  .wname { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-weight: 800;
    font-size: 16px; margin: 0 4px 6px; text-align: left; }
  .wname span { font-weight: 600; opacity: .8; font-size: 14px; }
  .stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lvl { background: #ffd23f; color: #3a2200; border: none; border-bottom: 5px solid #b8860b;
    border-radius: 12px; padding: 6px 4px 4px; font: inherit; font-weight: 800; cursor: pointer;
    font-size: 14px; transition: transform .08s; }
  .lvl.boss { background: #e74c3c; color: #fff; border-bottom-color: #922b21; }
  .lvl:hover:not(:disabled) { transform: translateY(-2px); }
  .lvl:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
  .lvl .num { font-size: 12px; opacity: .75; }
  .lvl small { display: block; font-weight: 600; opacity: .85; }
  .card .mathline { font-size: 20px; }
  .card .mathline small { font-size: 15px; opacity: .85; }
  .lvl .dots { display: block; margin-top: 2px; letter-spacing: 2px; color: #a0522d; }
  .lvl.boss .dots { color: #ffd23f; }
  .lvl:disabled { background: #5a5a6e; color: #b8b8c8; border-bottom-color: #3c3c4a; cursor: not-allowed; }
  .help { font-size: 14px; opacity: .85; margin: 4px 0 10px; line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn { background: #2ecc71; color: #fff; border: none; border-bottom: 4px solid #1e8449; border-radius: 10px;
    padding: 10px 20px; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; }
  .btn.alt { background: #5b6bd6; border-bottom-color: #3a46a0; }
  .btn.ghost { background: transparent; border: 2px solid rgba(255,255,255,.4); font-size: 14px; padding: 6px 12px; }
  .card { background: #22224a; border: 4px solid #ffd23f; border-radius: 16px; padding: 20px 26px; max-width: 540px; }
  .card h2 { margin: 0 0 8px; color: #ffd23f; font-size: clamp(24px, 5vw, 32px); }
  .card p { font-size: 18px; margin: 8px 0 14px; line-height: 1.45; }
  .card .taunt { font-style: italic; font-size: 20px; color: #ffb3b3; }
  .card .dots { color: #ffd23f; letter-spacing: 4px; font-size: 26px; }
  .bigicon { font-size: 64px; line-height: 1.1; }
  .promo { background: rgba(255,210,63,.15); border-radius: 10px; padding: 8px; margin: 0 0 14px; font-size: 18px; }
  #pauseBtn { position: absolute; top: 1.2%; right: 1%; width: max(40px, 5%); aspect-ratio: 1; border-radius: 10px;
    border: none; background: rgba(0,0,0,.35); color: #fff; font-size: clamp(14px, 2.4vw, 26px); cursor: pointer; z-index: 5; }
  #touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 6; }
  .tbtn { position: fixed; bottom: 18px; width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.5); color: #fff;
    font-size: 36px; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .tbtn.on { background: rgba(255,255,255,.45); }
  .tbtn[data-k="left"] { left: 18px; }
  .tbtn[data-k="right"] { left: 116px; }
  .tbtn[data-k="jump"] { right: 24px; width: 100px; height: 100px; background: rgba(255,210,63,.35); }
  /* Phone held upright: game on top, big buttons in the space underneath. */
  body.portrait #wrap { align-items: flex-start; padding-top: max(8px, env(safe-area-inset-top)); }
  body.portrait .tbtn { width: 100px; height: 100px; bottom: max(36px, env(safe-area-inset-bottom)); font-size: 40px; }
  body.portrait .tbtn[data-k="left"] { left: 12px; }
  body.portrait .tbtn[data-k="right"] { left: 122px; }
  body.portrait .tbtn[data-k="jump"] { right: 12px; width: 120px; height: 120px; }
  body.portrait .tbtn:not([data-k="jump"]) { bottom: calc(max(36px, env(safe-area-inset-bottom)) + 10px); }
  body.touch .keys { display: none; }
  body.racing .tbtn[data-k="jump"] { display: none; }
  .bigrow { margin: 4px 0 2px; }
  .pickh { margin: 12px 0 6px; font-size: 16px; color: #ffd23f; }
  .pickgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  #trackGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pick { font: inherit; font-weight: 800; color: #fff; background: rgba(255,255,255,.08); border: 3px solid transparent; border-radius: 12px;
    padding: 6px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
  .pick canvas { image-rendering: pixelated; width: 100%; max-width: 108px; height: auto; }
  .pick small { font-size: 11px; opacity: .8; }
  .pick.on { border-color: #ffd23f; }
  .pick:disabled { opacity: .5; cursor: default; }
  .pick.track { min-height: 84px; align-content: center; text-shadow: 0 2px 3px rgba(0,0,0,.8); }
  .pick.track b { font-size: 30px; }
  .homebar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 4px 0 2px; }
  .mathchip { font: inherit; font-weight: 800; font-size: 18px; color: #3a2200; background: #ffd23f; border: none; border-bottom: 4px solid #b8860b;
    border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  .mathchip .tier, .mathline .tier { color: #d35400; letter-spacing: 1px; }
  .mathline .tier { color: #ffd23f; }
  .iconrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); margin: 6px 0 4px; }
  .ibtn { font: inherit; font-weight: 800; font-size: 13px; color: #fff; background: rgba(255,255,255,.1); border: none; border-radius: 14px;
    padding: 8px 2px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
  .ibtn span { font-size: 26px; line-height: 1; }
  .ibtn b { color: #ffd23f; }
  .ibtn:hover { background: rgba(255,255,255,.18); }
  .setlist { display: grid; gap: 8px; margin: 10px 0 14px; }
  .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }
  .tabs button { font: inherit; font-weight: 800; font-size: 15px; border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; }
  .tabs button.on { background: #ffd23f; color: #3a2200; }
  .skillgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 14px; }
  .skill { font: inherit; text-align: left; border: 2px solid transparent; border-radius: 12px; padding: 8px 10px; cursor: pointer;
    background: rgba(255,255,255,.08); color: #fff; display: grid; gap: 1px; }
  .skill.on { border-color: #ffd23f; background: rgba(255,210,63,.15); }
  .skill .sn { font-weight: 800; font-size: 15px; }
  .skill .se { font-size: 13px; opacity: .75; }
  .skill .st { font-size: 13px; color: #ffd23f; letter-spacing: 1px; }
  .skill .sm { font-size: 12px; opacity: .85; }
  .howto { text-align: left; display: grid; gap: 8px; font-size: 16px; margin: 6px 0 14px; }
  .howto div { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; }
  .howto span { font-size: 24px; line-height: 1.1; }
  .badgegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0 14px; }
  .badge { background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px 8px; opacity: .55; }
  .badge.got { background: rgba(255,210,63,.14); border: 2px solid #ffd23f; opacity: 1; }
  .badge .bi { font-size: 34px; }
  .badge .bn { font-weight: 800; font-size: 15px; margin-top: 2px; }
  .badge .bt { font-size: 12px; opacity: .85; }
  #toast { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 30;
    background: #22224a; color: #fff; border: 3px solid #ffd23f; border-radius: 14px; padding: 10px 18px; font-size: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); animation: toastin .35s ease-out; white-space: nowrap; }
  #toast span { font-size: 24px; vertical-align: middle; }
  @keyframes toastin { from { transform: translate(-50%, -30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #toast { animation: none; } }
  .bigrow .btn { font-size: 17px; }
  .shopcard { width: min(720px, 100%); max-width: 720px; }
  .shoptop { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .shoptop canvas { image-rendering: pixelated; background: rgba(255,255,255,.06); border-radius: 10px; }
  .bankline { font-size: 22px; }
  .bankline b { color: #ffd23f; }
  .shophint { font-size: 14px; opacity: .75; }
  .shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .item { background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px; display: grid; gap: 4px; justify-items: center; }
  .item canvas { image-rendering: pixelated; }
  .item .nm { font-weight: 800; font-size: 14px; }
  .item .pr { font-size: 13px; opacity: .85; }
  .item button { font: inherit; font-weight: 800; font-size: 13px; border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; background: #5b6bd6; color: #fff; }
  .item button.buy { background: #2ecc71; }
  .item button:disabled { background: #555566; color: #bbb; cursor: default; }
  .buybox { background: rgba(255,210,63,.12); border: 2px solid #ffd23f; border-radius: 12px; padding: 10px; margin: 6px 0; }
  .buybox p { margin: 4px 0 10px; }
  .buybox .row button { font: inherit; font-weight: 800; font-size: 20px; min-width: 70px; border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; background: #5b6bd6; color: #fff; }
  .buybox .row button.no { background: #8a8aa0; font-size: 14px; }
  .padcard { width: min(440px, 100%); padding: 16px 18px 18px; }
  .padq { font-size: clamp(30px, 8vw, 44px); font-weight: 800; margin: 2px 0 4px; }
  .padq .padin { display: inline-block; min-width: 2.2ch; border-bottom: 4px solid #ffd23f; color: #ffd23f; }
  .padmsg { font-size: 15px; opacity: .85; min-height: 1.5em; margin-bottom: 10px; }
  .padkeys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .padkeys button { font: inherit; font-size: 24px; font-weight: 800; padding: 12px 0; border-radius: 10px; border: none;
    border-bottom: 4px solid #3a46a0; background: #5b6bd6; color: #fff; cursor: pointer; touch-action: manipulation; }
  .padkeys button:active { transform: translateY(2px); border-bottom-width: 2px; }
  .padkeys button.sel { outline: 3px solid #ffd23f; outline-offset: 2px; }
  .fusebar { height: 12px; border-radius: 6px; background: #3a3a5a; margin: 0 0 12px; overflow: hidden; }
  .fusebar i { display: block; height: 100%; width: 100%; border-radius: 6px;
    background: linear-gradient(90deg, #ff6a00, #ffd23f); box-shadow: 0 0 10px #ff9a3c; }
  .fusebar i.low { background: linear-gradient(90deg, #e8452c, #ff6a00); animation: fuseblink .3s steps(2) infinite; }
  @keyframes fuseblink { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .fusebar i.low { animation: none; } }

</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <button id="pauseBtn" class="hidden" aria-label="Pause">⏸</button>
  </div>
</div>

<div id="menu" class="overlay">
  <h1>MATH NINJA</h1>
  <div class="homebar">
    <button class="mathchip" id="skillChip" type="button"></button>
    <div class="rank" id="rank"></div>
  </div>
  <div class="iconrow">
    <button class="ibtn" id="raceBtn" type="button"><span>🐎</span>Race</button>
    <button class="ibtn" id="shopBtn" type="button"><span>🏯</span>Shop <b id="bankMenu">0</b></button>
    <button class="ibtn" id="badgeBtn" type="button"><span>🏅</span>Badges <b id="badgeMenu"></b></button>
    <button class="ibtn" id="settingsBtn" type="button"><span>⚙️</span>Settings</button>
    <button class="ibtn" id="helpBtn" type="button"><span>❓</span>How to</button>
  </div>
  <div class="worlds" id="worlds"></div>
</div>

<div id="settings" class="overlay hidden">
  <div class="card">
    <h2>Settings</h2>
    <div class="setlist">
      <button class="btn alt" id="muteBtn" type="button">🔊 Sound on</button>
      <button class="btn alt" id="musicBtn" type="button">🎵 Music on</button>
      <button class="btn alt" id="easyBtn" type="button">🐣 Easy mode: off</button>
      <button class="btn alt" id="unlockBtn" type="button">🔓 Unlock all levels</button>
      <button class="btn alt" id="storyBtn" type="button">📖 Story</button>
      <button class="btn alt" id="resetBtn" type="button">↺ Reset progress</button>
    </div>
    <div class="row"><button class="btn" id="settingsClose" type="button">Done</button></div>
  </div>
</div>

<div id="raceSetup" class="overlay hidden">
  <div class="card shopcard">
    <h2>Race</h2>
    <p class="mathline" id="raceMath"></p>
    <div class="row"><button class="btn ghost" id="raceMathBtn" type="button">Change math</button></div>
    <h3 class="pickh">Pick your ride</h3>
    <div class="pickgrid" id="rideGrid"></div>
    <h3 class="pickh">Pick a track</h3>
    <div class="pickgrid" id="trackGrid"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="raceGo" type="button">Start ▶</button><button class="btn alt" id="raceBack" type="button">Back</button></div>
  </div>
</div>

<div id="skills" class="overlay hidden">
  <div class="card shopcard">
    <h2>Pick your math</h2>
    <div class="shophint">Harder math ★ earns more gems and belt points!</div>
    <div class="tabs" id="skillTabs"></div>
    <div class="skillgrid" id="skillGrid"></div>
    <div class="row"><button class="btn alt" id="skillsClose" type="button">Back</button></div>
  </div>
</div>

<div id="msg" class="overlay hidden">
  <div class="card">
    <h2 id="msgTitle"></h2>
    <div id="msgBody"></div>
    <div class="row" id="msgBtns"></div>
  </div>
</div>

<div id="shop" class="overlay hidden">
  <div class="card shopcard">
    <h2>Dojo Shop</h2>
    <div class="shoptop"><canvas id="shopPreview" width="110" height="56"></canvas>
      <div><div class="bankline">💎 <b id="bank">0</b> gems</div><div class="shophint">Collect gems in levels and races.</div></div></div>
    <div class="buybox hidden" id="buyBox"></div>
    <div class="shopgrid" id="shopGrid"></div>
    <div class="row"><button class="btn alt" id="shopClose" type="button">Back</button></div>
  </div>
</div>

<div id="badges" class="overlay hidden">
  <div class="card shopcard">
    <h2>Badge Book</h2>
    <div class="shophint" id="badgeCount"></div>
    <div class="badgegrid" id="badgeGrid"></div>
    <div class="row"><button class="btn alt" id="badgesClose" type="button">Back</button></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<div id="pad" class="overlay hidden">
  <div class="card padcard">
    <div class="fusebar"><i id="fuse"></i></div>
    <div class="padq" id="padQ"></div>
    <div class="padmsg" id="padMsg"></div>
    <div class="padkeys" id="padKeys"></div>
  </div>
</div>

<div id="touch" class="hidden">
  <div class="tbtn" data-k="left">◀</div>
  <div class="tbtn" data-k="right">▶</div>
  <div class="tbtn" data-k="jump">▲</div>
</div>

<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VH = 540, T = 36, ROWS = 15, GR = 13;   // GR = first ground row
let VW = 960;                                 // 540 when the screen is taller than wide

// ---------------------------------------------------------------- helpers
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const R = (a, b) => ri(Math.random, a, b);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = R(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
const hash = i => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
const mk = (a, op, b, ans) => ({ a, op, b, ans, text: `${a} ${op} ${b}` });

// ---------------------------------------------------------------- story & worlds
const STORY = `Long ago, Sensei guarded four Magic Math Scrolls at the mountain dojo. One stormy night,
  the evil <b>Shadow Shogun</b> crept in and stole them all! He gave each scroll to one of his bosses to guard.
  <br><br>You are Sensei's bravest young ninja. Run through four worlds, collect the torn scroll pieces,
  solve the math gates, and beat the bosses to bring the scrolls home!`;
const ENDING = `The Shadow Shogun is beaten, and all four Magic Math Scrolls are back at the dojo!
  <br><br>Sensei bows low: <i>"You are a true Math Ninja."</i>`;

const WORLDS = [
  { key: 'japan', name: 'Japan Village', scroll: 'Scroll of Adding', walker: 'ninja', pit: 'water', flag: '#e63946',
    skies: [['#7cc6ff', '#ffe3ef'], ['#ff9a8b', '#ffe0b5'], ['#6fb4f0', '#ffd6e8']],
    brick: ['#c0392b', '#7b1f16'], pipe: ['#7cb342', '#33691e', '#c5e1a5'], stair: ['#b0794a', '#6e4627', '#d8a679'],
    gate: ['#d63a2f', '#7b1610', '#ff8a7a', '#ffd23f'], dojo: ['#f1e0c5', '#7b1610', '#3a2a20'],
    intro: `The Shogun's bandit ninjas are hiding in the cherry blossom village. Their leader, <b>Kage the Shadow Blade</b>, is guarding the Scroll of Adding.`,
    boss: { kind: 'kage', name: 'Kage the Shadow Blade', hp: 5, taunt: 'No one gets past my blade... unless they can add!' } },
  { key: 'lava', name: 'Lava Volcano', scroll: 'Scroll of Taking Away', walker: 'rock', pit: 'lava', flag: '#ff8c1a',
    skies: [['#1a0505', '#7a1f0a'], ['#2a0707', '#9a3a0a'], ['#150303', '#6b1a0a']],
    brick: ['#5a3a34', '#2a1a16'], pipe: ['#4a3530', '#241815', '#7a5a50'], stair: ['#4b3a36', '#221816', '#6e5a54'],
    gate: ['#2a1a1a', '#0d0606', '#ff6a00', '#ff8c1a'], dojo: ['#3a2a26', '#1a0d0a', '#ff6a00'],
    intro: `Deep inside the volcano, rock monsters stomp around and lava blobs leap out of the fire. The <b>Magma Golem</b> is guarding the Scroll of Taking Away.`,
    boss: { kind: 'golem', name: 'Magma Golem', hp: 6, taunt: 'ROCK SMASH! You will never take away my scroll!' } },

// ---------------------------------------------------------------- math skills
// Each skill is one consistent family of problems (like a times table). Any level can use any skill.
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
// Deals every problem in the family once, in a shuffled order, before repeating,
// and never repeats one of the last few problems across a reshuffle.
const deck = make => {
  let pile = [], recent = [];
  return () => {
    if (!pile.length) pile = shuffle(make());
    const size = make().length;
    const key = q => (q.op === '×' ? [q.a, q.b].sort((x, y) => x - y).join('×') : q.text);   // 7 × 5 and 5 × 7 are the same fact
    let i = pile.length - 1;
    while (i > 0 && recent.includes(key(pile[i]))) i--;
    const q = pile.splice(i, 1)[0];
    recent = [key(q), ...recent].slice(0, Math.max(1, Math.min(8, size - 2)));
    return { ...q };
  };
};
const pairs = (as, bs, ok) => as.flatMap(a => bs.filter(b => ok(a, b)).map(b => [a, b]));
const plus = (a, b) => mk(a, '+', b, a + b), minus = (a, b) => mk(a, '−', b, a - b);
const tens = q => ({ ...q, step: 10 });
const times = (n, k) => (R(0, 1) ? mk(n, '×', k, n * k) : mk(k, '×', n, n * k));
const table = n => deck(() => range(1, n > 10 ? 12 : 10).map(k => times(n, k)));
const divTable = n => deck(() => range(1, n > 10 ? 12 : 10).map(k => mk(n * k, '÷', n, k)));
const SKILLS = [
  { cat: 'add', id: 'add5', name: 'Add within 5', ex: '2 + 3', tier: 1, gen: deck(() => pairs(range(1, 4), range(1, 4), (a, b) => a + b <= 5).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'add10', name: 'Add within 10', ex: '4 + 5', tier: 1, gen: deck(() => pairs(range(1, 9), range(1, 9), (a, b) => a + b <= 10 && a + b > 3).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'make10', name: 'Make 10', ex: '7 + ? = 10', tier: 1, gen: deck(() => range(1, 9).map(a => ({ a, b: 10 - a, op: '+', ans: 10 - a, missing: true, text: `${a} + ? = 10` }))) },
  { cat: 'add', id: 'add20', name: 'Add within 20', ex: '8 + 7', tier: 2, gen: deck(() => pairs(range(2, 12), range(2, 12), (a, b) => a + b > 10 && a + b <= 20).map(([a, b]) => plus(a, b))) },
  { cat: 'add', id: 'addtens', name: 'Add tens', ex: '30 + 40', tier: 2, gen: deck(() => pairs(range(1, 8), range(1, 8), (a, b) => a + b <= 10).map(([a, b]) => tens(plus(a * 10, b * 10)))) },
  { cat: 'add', id: 'add2d1d', name: '2-digit + 1-digit', ex: '47 + 5', tier: 3, gen: () => plus(R(11, 89), R(2, 9)) },
  { cat: 'add', id: 'add2d', name: '2-digit + 2-digit', ex: '36 + 47', tier: 4, gen: () => { const a = R(11, 79); return plus(a, R(11, 99 - a)); } },
  { cat: 'sub', id: 'sub10', name: 'Take away within 10', ex: '9 − 4', tier: 1, gen: deck(() => pairs(range(2, 10), range(1, 9), (a, b) => b < a).map(([a, b]) => minus(a, b))) },
  { cat: 'sub', id: 'sub20', name: 'Take away within 20', ex: '15 − 7', tier: 2, gen: deck(() => pairs(range(11, 18), range(2, 9), (a, b) => a - b <= 10).map(([a, b]) => minus(a, b))) },
  { cat: 'sub', id: 'subtens', name: 'Take away tens', ex: '70 − 30', tier: 2, gen: deck(() => pairs(range(2, 10), range(1, 9), (a, b) => b < a).map(([a, b]) => tens(minus(a * 10, b * 10)))) },
  { cat: 'sub', id: 'sub2d1d', name: '2-digit − 1-digit', ex: '43 − 6', tier: 3, gen: () => minus(R(20, 99), R(2, 9)) },
  { cat: 'sub', id: 'sub2d', name: '2-digit − 2-digit', ex: '72 − 38', tier: 4, gen: () => { const a = R(30, 99); return minus(a, R(11, a - 10)); } },
  ...[2, 5, 10, 3, 4, 11, 6, 7, 8, 9, 12].map(n => ({ cat: 'mul', id: 'x' + n, name: `Times ${n}`, ex: `${n} × 4`, tier: [2, 5, 10].includes(n) ? 2 : [3, 4, 11].includes(n) ? 3 : 4, gen: table(n) })),
  { cat: 'mul', id: 'xmix25', name: 'Times 2 to 5', ex: '4 × 7', tier: 3, gen: deck(() => pairs(range(2, 5), range(1, 10), () => true).map(([n, k]) => times(n, k))) },
  { cat: 'mul', id: 'xmix69', name: 'Times 6 to 9', ex: '8 × 6', tier: 4, gen: deck(() => pairs(range(6, 9), range(2, 10), () => true).map(([n, k]) => times(n, k))) },
  { cat: 'mul', id: 'xtens', name: 'Times tens', ex: '3 × 40', tier: 4, gen: deck(() => pairs(range(2, 9), range(2, 9), () => true).map(([a, b]) => tens(mk(a, '×', b * 10, a * b * 10)))) },
  { cat: 'mul', id: 'xall', name: 'All times tables', ex: '7 × 12', tier: 5, gen: () => times(R(2, 12), R(2, 12)) },

  { cat: 'div', id: 'dmix', name: 'All division', ex: '56 ÷ 8', tier: 5, gen: () => { const n = R(2, 10); return mk(n * R(1, 10), '÷', n, 0); } },
];

const SKILL = Object.fromEntries(SKILLS.map(k => [k.id, k]));
const SKILL_CATS = [['add', '➕ Add'], ['sub', '➖ Take away'], ['mul', '✖️ Times'], ['div', '➗ Divide']];

const stars = t => '★'.repeat(t) + '☆'.repeat(5 - t);
function harderSkill(k) { return SKILLS.find(x => x.cat === k.cat && x.tier > k.tier) || k; }
const qShow = q => (q.missing ? q.text : `${q.text} = ?`);
const qSolved = q => (q.missing ? q.text.replace('?', q.ans) : `${q.text} = ${q.ans}`);

// The adventure: levels are places now; the math comes from the chosen skill.
const STAGES = [
  { w: 0, name: 'Cherry Path', n: 6, enemy: 0.15, pit: 2 }, { w: 0, name: 'Bamboo Grove', n: 7, enemy: 0.22, pit: 2 }, { w: 0, boss: true },
  { w: 1, name: 'Ash Trail', n: 7, enemy: 0.25, pit: 3 }, { w: 1, name: 'Lava Falls', n: 7, enemy: 0.3, pit: 3 }, { w: 1, boss: true },
  { w: 2, name: 'Gear Works', n: 7, enemy: 0.3, pit: 3 }, { w: 2, name: 'Conveyor Run', n: 8, enemy: 0.35, pit: 3 }, { w: 2, boss: true },
  { w: 3, name: 'Lantern Roofs', n: 8, enemy: 0.4, pit: 3 }, { w: 3, name: 'Moon Tower', n: 9, enemy: 0.45, pit: 3 }, { w: 3, boss: true },
];
STAGES.forEach((s, i) => { s.k = i % 3; s.label = s.boss ? 'BOSS' : `${s.w + 1}-${s.k + 1}`; });

// Ninja points for a stage = accuracy (1-3) × math difficulty (1-5), so harder math climbs the belts faster.
const BELTS = [
  ['White', 0, '#f4f4f4'], ['Yellow', 6, '#ffd23f'], ['Orange', 15, '#ff8c1a'], ['Green', 30, '#2ecc71'],
  ['Blue', 50, '#3498db'], ['Purple', 75, '#9b59b6'], ['Red', 100, '#e63946'], ['Brown', 130, '#8b5a2b'], ['Black', 160, '#151515'],
].map(([name, need, col], idx) => ({ name, need, col, idx }));
const MAX_POINTS = STAGES.length * 15;

// The right answer plus n-1 believable wrong ones, shuffled. Wrong ones favour the mistakes kids really
// make: off by a little, the wrong operation, or swapped digits.
function choices(q, n = 3) {
  const a = q.ans, st = q.step || 1, seen = new Set([a]), out = [a];
  const near = [a + st, a - st, a + 2 * st, a - 2 * st];
  const more = [a + 3 * st, a - 3 * st, a + 4 * st, a - 4 * st, a + 5 * st, a - 5 * st];
  if (st === 1 && a >= 20) near.push(a + 10, a - 10);
  if (st === 1 && a >= 10 && a % 10 !== a / 10 % 10) more.push(+String(a).split('').reverse().join(''));
  if (q.op === '×' && st === 1) near.push(a + q.a, a - q.a, a + q.b, a - q.b), more.push(q.a + q.b);
  if (q.op === '×' && st > 1) near.push(a + q.b, a - q.b);
  if (q.op === '+') more.push(Math.abs(q.a - q.b));
  if (q.op === '−') more.push(q.a + q.b);
  if (q.op === '÷') more.push(q.a - q.b);
  for (const c of [...shuffle(near), ...shuffle(more)]) {
    if (out.length === n) break;
    if (c >= 0 && Number.isInteger(c) && !seen.has(c)) { seen.add(c); out.push(c); }
  }
  for (let k = 0; out.length < n; k++) { const c = a + R(-12 - k, 12 + k) * st; if (c >= 0 && !seen.has(c)) { seen.add(c); out.push(c); } }
  return shuffle(out);
}
// Answers in a sorted row, with the right one at a random spot so "pick the middle" never works.
function rowChoices(q, n) {
  const a = q.ans, pool = choices(q, n * 2).filter(v => v !== a);
  const lows = pool.filter(v => v < a), highs = pool.filter(v => v > a);
  const below = clamp(R(0, n - 1), n - 1 - highs.length, lows.length);
  return [...lows.slice(0, below), a, ...highs.slice(0, n - 1 - below)].sort((x, y) => x - y);
}

// ---------------------------------------------------------------- level builders
function newMap() { const m = []; for (let r = 0; r < ROWS; r++) m.push([]); return m; }

function walkerFor(kind, c, speed) {
  const size = { ninja: [24, 44], shadow: [24, 44], rock: [34, 30], robot: [30, 36] }[kind];
  return { kind, x: c * T + 4, y: GR * T - size[1], w: size[0], h: size[1], vx: -speed, vy: 0, onGround: false, dead: null, t: R(0, 60) };
}

function buildLevel(idx, easy = false, skill = curSkill()) {
  const def = STAGES[idx], W = WORLDS[def.w], rng = mulberry32(1234 + idx * 7919);
  const map = newMap();
  const L = { idx, def, skill, gen: skill.gen, world: W, sky: W.skies[def.k], map, w: 0, enemies: [], coins: [], stations: [], bridges: [], doors: [], decor: [], flagC: 0, castleC: 0, boss: null, proj: [] };
  const addCols = n => { for (let i = 0; i < n; i++) { for (let r = 0; r < ROWS; r++) map[r].push('.'); L.w++; } return L.w - n; };
  const flat = n => {
    const s = addCols(n);
    for (let c = s; c < s + n; c++) { map[GR][c] = '#'; map[GR + 1][c] = '#'; }
    if (n >= 4 && rng() < 0.35) L.decor.push(s + ri(rng, 0, n - 2));
    return s;
  };
  const coin = (c, r, v = 1) => L.coins.push({ x: c * T + T / 2, y: r * T + T / 2, v, taken: false });
  const speed = (0.9 + idx * 0.05) * (easy ? 0.7 : 1);
  const maybeEnemy = c => { if (rng() < def.enemy * (easy ? 0.4 : 1)) L.enemies.push(walkerFor(W.walker, c, speed)); };

  function chunk(type) {
    switch (type) {
      case 'coins': { const s = flat(6); [10, 9, 9, 10].forEach((r, i) => coin(s + 1 + i, r)); maybeEnemy(s + 4); break; }
      case 'pit': {
        flat(2); const w = ri(rng, 2, def.pit), s = addCols(w);
        for (let i = 0; i < w; i++) coin(s + i, 9);
        if (W.pit === 'lava' && rng() < 0.7) {
          L.enemies.push({ kind: 'blob', x: (s + w / 2) * T - 13, y: VH + 20, home: VH + 20, w: 26, h: 26, vy: 0, t: 0, delay: R(30, 120), up: false, dead: null });
        }
        flat(2); break;
      }
      case 'bricks': {
        const s = flat(7), r = GR - 4;
        for (let i = 1; i <= 5; i++) map[r][s + i] = (i % 2 === 0 && rng() < 0.85) ? '?' : 'B';
        if (rng() < 0.5) {
          for (let i = 2; i <= 4; i++) map[GR - 7][s + i] = i === 3 ? '?' : 'B';
          coin(s + 2, GR - 8, 5); coin(s + 4, GR - 8, 5);   // blue gems up high
        }
        maybeEnemy(s + 6); break;
      }
      case 'pipe': {
        const s = flat(6), h = ri(rng, 2, 3);
        for (let k = 0; k < h; k++) {
          const r = GR - 1 - k, top = k === h - 1;
          map[r][s + 2] = top ? 'P' : 'p'; map[r][s + 3] = top ? 'Q' : 'q';
        }
        coin(s + 2, GR - h - 2); coin(s + 3, GR - h - 2);
        maybeEnemy(s + 5); break;
      }
      case 'stairs': {
        const s = flat(8);
        [1, 2, 3, 3, 2, 1].forEach((h, i) => { for (let k = 0; k < h; k++) map[GR - 1 - k][s + 1 + i] = 'S'; });
        coin(s + 3, GR - 5, 5); coin(s + 4, GR - 5); break;
      }
      case 'float': {
        if (def.pit < 3) return chunk('coins');
        flat(1); const s = addCols(5);
        for (let i = 1; i <= 3; i++) map[GR - 3][s + i] = i === 2 ? '?' : 'B';
        coin(s + 1, GR - 5); coin(s + 3, GR - 5);
        flat(1); break;
      }
    }
  }

  // Number-stone bridge: stones float on the left, the altar sits at the edge of a pit too wide to jump.
  function bridgeChunk() {
    const { target, stones } = bridgePuzzle(Math.min(3, skill.tier - 1)), s = flat(15);
    const b = { target, total: 0, overs: 0, done: false, signC: s, startX: s * T, altarC: s + 14, c0: 0, w: 7, stones: [] };
    stones.forEach((v, i) => { const c = s + 4 + i * 2, r = GR - 4; map[r][c] = 'N'; b.stones.push({ c, r, val: v, state: 'home' }); });
    b.c0 = addCols(7);
    flat(2);
    L.bridges.push(b);
  }
  function doorChunk() { const s = flat(7); L.doors.push({ c: s + 3, used: false }); }

  const kinds = easy ? ['coins', 'bricks', 'pipe', 'stairs'] : ['coins', 'pit', 'bricks', 'pipe', 'stairs', 'float'];
  const doorAt = def.n > 6 ? 4 : 3, goldAt = 1 + idx % Math.max(1, def.n - 2);
  flat(10);
  for (let i = 0; i < def.n; i++) {
    const n = ri(rng, 2, 3);
    for (let k = 0; k < n; k++) chunk(kinds[ri(rng, 0, kinds.length - 1)]);
    if (i === 2 || (i === 5 && def.w >= 2)) bridgeChunk();
    if (i === doorAt) doorChunk();
    // Question station: sign, three answer blocks, and a locked gate.
    const s = flat(16), q = skill.gen();
    const answers = choices(q).map((v, j) => ({ c: s + 4 + j * 3, r: GR - 4, val: v, state: 'idle', shake: 0 }));
    answers.forEach(a => { map[a.r][a.c] = 'A'; });
    for (let r = 0; r < GR; r++) { map[r][s + 13] = 'G'; map[r][s + 14] = 'G'; }
    L.stations.push({ s, q, answers, gate: [s + 13, s + 14], solved: false, opening: null, openT: 0 });
    if (i === goldAt && !def.boss) map[GR - 5][s + 1] = 'H';   // hidden block above the sign
  }
  // Finale: staircase, flag, dojo.
  const s = flat(24);
  [1, 2, 3, 4, 5, 6, 6].forEach((h, i) => { for (let k = 0; k < h; k++) map[GR - 1 - k][s + 2 + i] = 'S'; });
  coin(s + 8, GR - 8, 10);   // a red gem for climbing to the top
  L.flagC = s + 13; L.castleC = s + 17;
  return L;
}

// The secret vault: one screen of platforms covered in gems, with an exit door on the right.
function buildVault(src) {
  const cols = Math.ceil(VW / T), map = newMap();
  for (let c = 0; c < cols; c++) { for (let r = 0; r < ROWS; r++) map[r].push('.'); map[GR][c] = '#'; map[GR + 1][c] = '#'; }
  const V = { idx: src.idx, def: src.def, world: src.world, sky: ['#1a1206', '#6b4a10'], map, w: cols, enemies: [], coins: [], stations: [], bridges: [], doors: [],
    decor: [], flagC: 9999, castleC: 9999, proj: [], vault: true, exitC: cols - 2 };
  const coin = (c, r, v = 1) => V.coins.push({ x: c * T + T / 2, y: r * T + T / 2, v, taken: false });
  for (let off = 0; off + 13 <= cols; off += 11) {
    for (let c = 3; c <= 5; c++) { map[GR - 4][off + c] = 'B'; coin(off + c, GR - 5, 5); }
    for (let c = 8; c <= 10; c++) { map[GR - 4][off + c] = 'B'; coin(off + c, GR - 5, 5); }
    for (let c = 6; c <= 7; c++) { map[GR - 7][off + c] = 'B'; coin(off + c, GR - 8, 5); coin(off + c, GR - 9, 10); }
  }
  for (let c = 2; c < cols - 3; c++) coin(c, GR - 1);
  return V;
}

const BOSS_SPECS = {

// Boss stage: one screen-wide arena, answer blocks on the left, the boss on the right.
// Upright phones get a narrower arena so the boss stays on screen.
function buildArena(idx, easy = false, skill = curSkill()) {
  const def = STAGES[idx], W = WORLDS[def.w], map = newMap(), narrow = VW < 700, cols = narrow ? 18 : 27;
  for (let c = 0; c < cols; c++) { for (let r = 0; r < ROWS; r++) map[r].push('.'); map[GR][c] = '#'; map[GR + 1][c] = '#'; }
  const L = { idx, def, skill, gen: skill.gen, world: W, sky: W.skies[2], map, w: cols, enemies: [], coins: [], stations: [], bridges: [], doors: [], decor: [1, cols - 4], flagC: -99, castleC: -99, proj: [] };
  // Bonking the keypad block opens the number pad.
  const padC = narrow ? 5 : 7;
  map[GR - 4][padC] = 'K';
  // Fights take turns: a 'dodge' phase where the boss attacks, then an 'open' phase where it is dizzy and you answer.
  L.arena = { q: skill.gen(), padC, wait: 0, phase: 'dodge', phaseT: 150 };
  const sp = BOSS_SPECS[W.boss.kind];
  L.boss = {
    ...W.boss, spec: sp, max: W.boss.hp, x: (cols - 4) * T, y: GR * T - sp.h, w: sp.w, h: sp.h,
    vx: -sp.speed * (easy ? 0.7 : 1), vy: 0, onGround: false, t: 0, atk: 150, flash: 0, dying: 0, dead: false,
    face: -1, minX: (narrow ? 11 : 15) * T, maxX: (cols - 1) * T - sp.w, flip: 0,
  };
  return L;
}

// ---------------------------------------------------------------- sprites
// Characters are drawn with simple shapes on a small pixel grid, get a 1px dark outline automatically,
// and are baked to canvases at 3x for the game.
const OUTLINE = '#120f1a', PX = 3;
function makeFrames(w, h, pal, draw, count) {
  const frames = [];
  for (let f = 0; f < count; f++) {
    const g = Array.from({ length: h }, () => Array(w).fill(null));
    const inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h;
    const P = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (inb(x, y)) g[y][x] = c; };
    const R = (x, y, ww, hh, c) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) P(x + i, y + j, c); };
    const E = (cx, cy, rx, ry, c) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1) g[y][x] = c;
      }
    };
    const L = (x0, y0, x1, y1, c) => {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
      for (let i = 0; i <= n; i++) P(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c);
    };
    draw({ P, R, E, L }, f);
    const out = g.map(r => r.slice());
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (g[y][x]) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inb(x + dx, y + dy) && g[y + dy][x + dx] && g[y + dy][x + dx] !== 'k')) out[y][x] = 'k';
    }
    frames.push(out);
  }

const SOLID = new Set(['#', 'B', '?', 'U', 'S', 'P', 'Q', 'p', 'q', 'G', 'A', 'K', 'N', 'b']);
function solid(c, r) {
  if (c < 0 || c >= L.w) return true;
  if (r >= ROWS) return false;

function moveX(b) {
  b.x += b.vx;

  if (b.vx > 0) {
    const c = Math.floor((b.x + b.w) / T);
    for (let r = top; r <= bot; r++) if (solid(c, r)) { b.x = c * T - b.w - 0.01; b.vx = 0; return true; }
  } else if (b.vx < 0) {
    const c = Math.floor(b.x / T);
    for (let r = top; r <= bot; r++) if (solid(c, r)) { b.x = (c + 1) * T; b.vx = 0; return true; }
  }

}
// Returns the tile bumped from below, if any.
function moveY(b) {
  b.y += b.vy; b.onGround = false;
  const l = Math.floor(b.x / T), rr = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy > 0) {
    const r = Math.floor((b.y + b.h) / T);
    for (let c = l; c <= rr; c++) if (solid(c, r)) { b.y = r * T - b.h; b.vy = 0; b.onGround = true; return null; }
  } else if (b.vy < 0) {
    const r = Math.floor(b.y / T);
    let hit = null, best = 1e9;

    for (let c = l; c <= rr; c++) if (solid(c, r) || (r >= 0 && c >= 0 && c < L.w && L.map[r][c] === 'H')) {
      const d = Math.abs((c + 0.5) * T - (b.x + b.w / 2));

}

function circleHits(px, py, r, b) {

// Two misses in a row brings Sensei with a tip for the fact that was missed.
function tipFor(q) {
  const { a, b, op, ans } = q;
  if (q.missing) return `Count up from ${a} to ${a + ans}. That's ${ans}.`;
  if (q.step && op === '+') return `Think in tens: ${a / 10} tens + ${b / 10} tens = ${ans / 10} tens, which is ${ans}.`;
  if (q.step && op === '−') return `Think in tens: ${a / 10} tens − ${b / 10} tens = ${ans / 10} tens, which is ${ans}.`;
  if (q.step && op === '×') return `Do ${a} × ${b / 10} = ${a * b / 10} first, then put a zero on the end: ${ans}.`;
  if (op === '+') {
    if (a === b) return `Doubles! ${a} + ${a} is double ${a}, which is ${ans}.`;
    if (Math.abs(a - b) === 1) { const m = Math.min(a, b); return `Near double: ${m} + ${m} = ${m * 2}, plus 1 more is ${ans}.`; }
    if (a < 10 && b < 10 && ans > 10) { const big = Math.max(a, b), small = Math.min(a, b), need = 10 - big; return `Make 10 first: ${big} + ${need} = 10, then ${small - need} more is ${ans}.`; }
    if (a >= 10 && b >= 10) { const t = Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10, o = a % 10 + b % 10; return `Add the tens, then the ones: ${t} + ${o} = ${ans}.`; }
    return `Start at the bigger number and count on ${Math.min(a, b)} more: ${ans}.`;
  }
  if (op === '−') {
    if (b <= 3) return `Count back ${b} from ${a}: ${ans}.`;
    if (a >= 20 && b >= 10) { const t = Math.floor(b / 10) * 10; return `Take away the tens, then the ones: ${a} − ${t} = ${a - t}, then take away ${b % 10} more: ${ans}.`; }
    return `Count up from ${b} to ${a}. That's ${ans} steps.`;
  }
  if (op === '×') {
    const other = n => (a === n ? b : a);
    if (a === 1 || b === 1) return `Anything times 1 stays the same: ${ans}.`;
    if (a === 2 || b === 2) return `Times 2 is doubling: double ${other(2)} is ${ans}.`;
    if (a === 10 || b === 10) return `Times 10: put a zero on the end. ${other(10)} becomes ${ans}.`;
    if (a === 5 || b === 5) return `Count by 5s, ${other(5)} times: 5, 10, 15... all the way to ${ans}.`;
    if (a === 9 || b === 9) { const o = other(9); return `Times 9: do times 10, then take one away. ${o * 10} − ${o} = ${ans}.`; }
    if (a === 4 || b === 4) { const o = other(4); return `Times 4: double, then double again. ${o}, ${o * 2}, ${ans}.`; }
    return `Use one you know: ${a} × ${b - 1} = ${a * (b - 1)}, plus one more ${a} is ${ans}.`;
  }
  return `Think times tables: what times ${b} makes ${a}? ${ans} × ${b} = ${a}.`;
}
function senseiTip(txt) {
  G.tip = { txt, t: 420 };
  [392, 523, 659].forEach((f, i) => tone(f, 0.25, 'triangle', 0.04, null, i * 0.1));
}
function missed(q) {
  petSay('sad');
  if (++G.wrongRun >= 2) { senseiTip(tipFor(q)); G.wrongRun = 0; }
}
function gotIt() { petSay('happy'); G.wrongRun = 0; }

// ---------------------------------------------------------------- streak power-ups
// Every 5 answers in a row grants a power for a while: double jump, a shield, or a fire aura.
const POWERS = {
  double: { name: 'Double jump', icon: '🪽', time: 1200 },
  shield: { name: 'Shield', icon: '🛡️', time: 1500 },
  fire: { name: 'Fire aura', icon: '🔥', time: 600 },
};
const hasPower = k => !!(G && G.power && G.power.kind === k);
function grantPower() {
  const kinds = Object.keys(POWERS), kind = kinds[G.powerN++ % kinds.length];
  G.power = { kind, t: POWERS[kind].time };
  floatText(P.x + P.w / 2, P.y - 110, `Power up: ${POWERS[kind].name}!`, '#7df9ff', 26);
  sfx.power(); petSay('wow'); award('power');
}

// ---------------------------------------------------------------- number-stone bridges
// A pit too wide to jump. The target follows the math difficulty: 10, 20, 50 or 100. Bonk number stones to pick them up and carry them to the altar;
// the stones have to add up to exactly the target or the bridge cracks.
function bridgePuzzle(band) {
  const w = band, unit = w >= 2 ? 5 : 1, target = [10, 20, 50, 100][w], k = w === 0 ? 2 : 3, units = target / unit;
  const cuts = new Set();
  while (cuts.size < k - 1) cuts.add(R(1, units - 1));
  const marks = [0, ...[...cuts].sort((a, b) => a - b), units];
  const parts = marks.slice(1).map((m, i) => (m - marks[i]) * unit);
  // Two extra stones that differ from the answer stones (and each other) where possible.
  const extra = [];
  for (let tries = 0; extra.length < 2 && tries < 40; tries++) {
    const v = R(1, Math.max(2, Math.floor(units * 0.7))) * unit;
    if ((!parts.includes(v) && !extra.includes(v)) || tries > 30) extra.push(v);
  }
  return { target, stones: shuffle([...parts, ...extra]) };
}
function bridgeStone(c, r) {
  for (const b of L.bridges) for (const st of b.stones) {
    if (st.c !== c || st.r !== r) continue;
    if (b.done || st.state === 'used') { sfx.bump(); return; }
    if (st.state === 'carried') { st.state = 'home'; G.carry = null; sfx.bump(); return; }   // bonk again to put it back
    if (G.carry) G.carry.stone.state = 'home';
    st.state = 'carried'; G.carry = { b, stone: st };
    sfx.coin(); floatText(c * T + T / 2, r * T - 10, `Got ${st.val}`, '#fff', 22);
    return;
  }
}
function placeStone(b) {
  const st = G.carry.stone; G.carry = null; st.state = 'used'; b.total += st.val;
  const x = b.altarC * T + T / 2, y = (GR - 2) * T;
  if (b.total === b.target) {
    b.done = true; shake(8, 4); award('bridge');
    if (++prog.stats.bridges >= 10) award('bridge10'); save();
    for (let c = b.c0; c < b.c0 + b.w; c++) L.map[GR][c] = 'b';
    sfx.gate(); confetti(x, y); streakUp(x, y); gotIt();
    floatText(x, y - 30, `${b.target}! Bridge built!`, '#3ae374', 30);
    G.parts.push({ k: 'coin', x, y: y - 10, vx: 0, vy: -9, life: 34, v: 10 }); G.coins += 10;   // a red gem as a reward
  } else if (b.total > b.target) {
    floatText(x, y - 30, `${b.total} is too much! Try again`, '#ff6b6b', 26); sfx.wrong(); petSay('sad');
    if (++b.overs === 2) senseiTip(`Add the stones up in your head before you carry them. You need exactly ${b.target}.`);
    for (let c = b.c0; c < b.c0 + b.w; c++) burst(c * T + T / 2, GR * T, '#8b5a2b', 3);
    b.total = 0; b.stones.forEach(t => { t.state = 'home'; });
  } else {
    sfx.coin(); floatText(x, y - 30, `So far: ${b.total}`, '#ffd23f', 26);
  }
}
const activeBridge = () => L.bridges.find(b => !b.done && P.x > b.startX - 3 * T && P.x < (b.c0 + b.w) * T);

// ---------------------------------------------------------------- secret doors and the vault
const doorBox = c => ({ x: c * T, y: GR * T - 2.5 * T, w: 1.4 * T, h: 2.5 * T });
function harderGen() { return harderSkill(L.skill).gen; }
function openDoor(d) {
  d.used = true;
  const locked = () => { sfx.wrong(); floatText(P.x + P.w / 2, P.y - 20, 'The door stays locked', '#ff9a3c', 24); };
  askQuestion({
    q: harderGen()(), n: 5, time: prog.easy ? 18 : 12, msg: 'A secret door! Answer this harder one to open it.',
    onRight() { streakUp(P.x + P.w / 2, P.y); enterVault(); },
    onWrong: locked, onTimeout: locked,
  });
}
function enterVault() {
  award('vault');
  G.saved = { L, x: P.x, y: P.y };
  L = buildVault(L);
  P.x = 1.5 * T; P.y = GR * T - P.h; P.vx = P.vy = 0; cam = 0;
  sfx.win(); floatText(P.x + 40, P.y - 30, 'Secret vault!', '#ffd23f', 30);
}
function leaveVault() {
  L = G.saved.L; P.x = G.saved.x + T; P.y = G.saved.y; P.vx = P.vy = 0; G.saved = null;
  sfx.gate();
}

function hurt() {
  if (P.inv > 0 || mode !== 'play') return;
  if (hasPower('shield')) {
    G.power = null; P.inv = 60; sfx.stomp();
    burst(P.x + P.w / 2, P.y + P.h / 2, '#7df9ff', 16, 5); floatText(P.x + P.w / 2, P.y - 20, 'Shield blocked it!', '#7df9ff', 24);
    return;
  }
  G.hearts--; sfx.hurt(); shake(10, 5); petSay('hurt'); G.hit = true;
  P.inv = 100; P.vy = -7; P.vx = -P.face * 4;
  if (G.hearts <= 0) gameOver();
}
function fell() {
  // In Easy mode a fall (only possible at a bridge) costs no heart.
  if (prog.easy) sfx.bump();
  else { G.hearts--; G.hit = true; sfx.hurt(); if (G.hearts <= 0) { gameOver(); return; } }
  if (G.carry) { G.carry.stone.state = 'home'; G.carry = null; }
  P.x = G.checkpoint; P.y = GR * T - P.h; P.vx = P.vy = 0; P.inv = 100;
}
function gameOver() {
  mode = 'over'; stopMusic(); sfx.over(); showTouch(false); hide('pauseBtn');
  setTimeout(() => showMsg('Out of hearts!', '<p>Every ninja falls sometimes. Get up and try again!</p>', [
    { label: 'Try again', fn: () => startStage(G.idx), primary: true },
    { label: 'Levels', fn: toMenu, alt: true },
  ]), 900);
}

function updatePlayer() {
  const p = P;
  const acc = p.onGround ? 0.55 : 0.38;
  if (keys.left && !keys.right) { p.vx -= acc; p.face = -1; }
  else if (keys.right && !keys.left) { p.vx += acc; p.face = 1; }
  else { p.vx *= p.onGround ? 0.78 : 0.95; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  p.vx = clamp(p.vx, -4.6, 4.6);

  if (keys.jumpPressed) { p.jbuf = 8; keys.jumpPressed = false; }
  if (p.jbuf > 0) p.jbuf--;
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0 && p.coyote > 0) { p.vy = -13.2; p.onGround = false; p.coyote = 0; p.jbuf = 0; p.squash = -8; sfx.jump(); }
  if (p.onGround) p.usedDouble = false;
  else if (p.jbuf > 0 && p.coyote === 0 && hasPower('double') && !p.usedDouble) {
    p.vy = -12; p.usedDouble = true; p.jbuf = 0; sfx.jump(); burst(p.x + p.w / 2, p.y + p.h, '#ffffff', 8, 2);
  }
  if (!keys.jump && p.vy < -4.5) p.vy = -4.5;   // short hop when jump is released early
  p.vy = Math.min(p.vy + 0.55, 12);

  moveX(p);
  const wasAir = !p.onGround, fallSpeed = p.vy;
  const hit = moveY(p);
  if (hit) bump(hit.c, hit.r);
  if (wasAir && p.onGround && fallSpeed > 6) { p.squash = 8; burst(p.x + p.w / 2, p.y + p.h, '#e8e0d0', 4, 1.5); }
  if (p.squash > 0) p.squash--; else if (p.squash < 0) p.squash++;
  if (p.inv > 0) p.inv--;
  if (p.throwT > 0) p.throwT--;
  p.anim += Math.abs(p.vx) * 0.06;

  if (p.y > VH + 60) fell();

  if (G.power && --G.power.t <= 0) { G.power = null; floatText(p.x + p.w / 2, p.y - 20, 'Power faded', '#cccccc', 20); }
  if (hasPower('fire') && tick % 2 === 0) G.parts.push({ k: 'bit', x: p.x + Math.random() * p.w, y: p.y + p.h - Math.random() * p.h, vx: 0, vy: -1.5, life: 22, col: ['#ff6a00', '#ffd23f', '#ff3b1f'][R(0, 2)], s: 5 });
  const trail = prog.equip.trail;
  if (trail && p.onGround && Math.abs(p.vx) > 2 && tick % 3 === 0) {
    const cols = trail === 'trail-fire' ? ['#ff6a00', '#ffd23f', '#ff3b1f'] : ['#ffffff', '#fff3a0', '#9be7ff'];
    G.parts.push({ k: 'bit', x: p.x + p.w / 2 - p.face * 10, y: p.y + p.h - 6, vx: -p.face * 0.5, vy: -1 - Math.random(), life: 26, col: cols[R(0, 2)], s: 4 });
  }
  petTick();

  // Bridges: carry stones to the altar; reaching a bridge makes it the respawn point.
  for (const b of L.bridges || []) {
    if (b.done) continue;
    if (p.x > b.startX && G.checkpoint < b.startX) G.checkpoint = b.startX + T;
    if (G.carry && G.carry.b === b && overlap(p, { x: b.altarC * T, y: GR * T - 2 * T, w: T, h: 2 * T })) placeStone(b);
  }
  for (const d of L.doors || []) if (!d.used && p.onGround && overlap(p, doorBox(d.c))) { openDoor(d); return; }
  if (L.vault && overlap(p, doorBox(L.exitC))) { leaveVault(); return; }

  for (const c of L.coins) {
    if (!c.taken && Math.abs(c.x - (p.x + p.w / 2)) < 22 && Math.abs(c.y - (p.y + p.h / 2)) < 30) {
      c.taken = true; G.coins += c.v; G.score += 100 * c.v; gemSound(); flyGem(c.x, c.y, c.v);
      if (c.v > 1) floatText(c.x, c.y - 24, '+' + c.v, GEM_COL[c.v][0], 22);
    }
  }
  if (L.prize && overlap(p, L.prize)) {
    L.prize = null; mode = 'win'; G.winT = 0; stopMusic(); sfx.win(); hide('pauseBtn'); showTouch(false); petSay('dance');
    G.score += G.hearts * 300; confetti(p.x + p.w / 2, p.y);
    floatText(p.x + p.w / 2, p.y - 20, 'Scroll recovered!', '#ffd23f', 30);
  }
  if (!L.boss && !L.vault && p.x + p.w >= L.flagC * T + T / 2 - 6) {
    mode = 'win'; G.winT = 0; stopMusic(); sfx.win(); hide('pauseBtn'); showTouch(false); petSay('dance');
    const bonus = Math.max(0, GR - Math.floor((p.y + p.h) / T)) * 100 + G.hearts * 300;
    G.score += bonus; floatText(p.x, p.y - 10, '+' + bonus, '#ffd23f', 26);
  }
}

function updateEnemies() {
  for (const e of L.enemies) {
    if (e.dead === 'squash') { e.t++; continue; }
    if (e.dead === 'flip') { e.vy += 0.5; e.y += e.vy; e.x += (e.vx || 0) * 0.5; continue; }
    if (e.dead) continue;
    if (Math.abs(e.x - P.x) > VW * 1.2) continue;   // sleep until nearby
    e.t++;
    if (e.kind === 'blob') {
      // Lava blobs leap out of the pit, then sink back and wait.
      if (!e.up) { if (e.t > e.delay) { e.up = true; e.vy = -12.5; } }
      else {
        e.vy += 0.4; e.y += e.vy;
        if (e.y >= e.home) { e.y = e.home; e.up = false; e.t = 0; e.delay = R(70, 140); }
      }
      if (mode === 'play' && e.up && overlap(P, e)) {
        if (hasPower('fire')) { e.up = false; e.y = e.home; burst(e.x + 13, e.y - 40, '#ffd23f', 6); } else hurt();
      }
      continue;
    }
    e.vy = Math.min(e.vy + 0.5, 10);
    if (e.kind === 'shadow' && e.onGround && e.t % 100 === 50) e.vy = -9;   // shadow ninjas hop
    const vx0 = e.vx;
    if (moveX(e)) e.vx = -vx0;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
      if (!solid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > VH + 100) e.dead = 'gone';
    if (mode === 'play' && overlap(P, e)) {
      if (hasPower('fire')) {
        e.dead = 'flip'; e.vy = -7; G.score += 200; sfx.stomp();
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff6a00', 10); floatText(e.x + e.w / 2, e.y, '+200');
      } else if (P.vy > 0 && P.y + P.h - e.y < 18) {
        e.dead = 'squash'; e.t = 0; P.vy = keys.jump ? -11 : -7; shake(6, 3);
        burst(e.x + e.w / 2, e.y + e.h, '#ffffff', 6, 2);
        G.score += 200; sfx.stomp(); floatText(e.x + e.w / 2, e.y, '+200');
        if (e.kind === 'robot') burst(e.x + 15, e.y + 10, '#c8d3de', 8);
        if (e.kind === 'rock') burst(e.x + 17, e.y + 10, '#7d706a', 8);
      } else hurt();
    }
  }
}

function bossAttack(b) {
  const easy = prog.easy ? 0.7 : 1, sx = b.x + (b.face > 0 ? b.w : 0), kind = b.spec.attack;
  const lob = k => {
    const t = prog.easy ? 85 : 70, g = 0.3, px = P.x + P.w / 2;
    L.proj.push({ k, x: sx, y: b.y + 14, vx: (px - sx) / t, vy: -0.5 * g * t, g, r: 13 });
  };
  const low = (k, speed, r) => L.proj.push({ k, x: sx, y: GR * T - 18, vx: b.face * speed * easy, vy: 0, g: 0, r });
  if (kind === 'star') low('star', 4.5, 11);
  else if (kind === 'laser') low('laser', 5.5, 9);
  else if (kind === 'rock') lob('rock');
  else { b.flip ^= 1; if (b.flip) low('star', 5, 11); else lob('orb'); }
  sfx.attack();
}

const DODGE_FRAMES = () => (prog.easy ? 200 : 260);
const OPEN_FRAMES = () => (prog.easy ? 900 : 600);
function startDodge() {
  const ar = L.arena; ar.phase = 'dodge'; ar.phaseT = DODGE_FRAMES(); L.boss.atk = 30;
}
function updateArena() {
  const ar = L.arena, b = L.boss;
  if (!ar || b.dying || b.dead || ar.wait) return;
  if (--ar.phaseT > 0) return;
  if (ar.phase === 'dodge') {
    // The boss tires out: clear its attacks and open a window to answer.
    ar.phase = 'open'; ar.phaseT = OPEN_FRAMES();
    for (const p of L.proj) burst(p.x, p.y, '#ffffff', 5, 2);
    L.proj = [];
    floatText(b.x + b.w / 2, b.y - 16, 'Dizzy!', '#ffd23f', 28); sfx.gate();
  } else {
    floatText(b.x + b.w / 2, b.y - 16, 'Back on guard!', '#ff9a3c', 24);
    startDodge();
  }
}

function updateBoss() {
  const b = L.boss; if (!b || b.dead) return;
  if (b.dying > 0) {
    b.dying--;
    if (b.dying % 6 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffd23f', '#ff6a00', '#fff'][R(0, 2)], 6, 5);
    if (b.dying === 0) {
      b.dead = true; burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd23f', 30, 7);
      L.prize = { x: b.x + b.w / 2 - 20, y: b.y, w: 40, h: 30, vy: -8 };
    }
    return;
  }
  b.t++; if (b.flash > 0) b.flash--;
  b.vy = Math.min(b.vy + 0.55, 12);
  const dizzy = L.arena.phase === 'open';
  b.face = P.x + P.w / 2 < b.x + b.w / 2 ? -1 : 1;
  if (dizzy) { moveY(b); return; }   // a dizzy boss stands still and can't hurt you
  if (b.x <= b.minX) b.vx = Math.abs(b.vx); else if (b.x >= b.maxX) b.vx = -Math.abs(b.vx);
  const vx0 = b.vx;
  if (moveX(b)) b.vx = -vx0;
  moveY(b);
  if (b.spec.hop && b.onGround && b.t % b.spec.hop === 0) b.vy = -10;
  if (mode === 'play' && --b.atk <= 0) {
    bossAttack(b);
    b.atk = b.spec.every * 0.8 * (prog.easy ? 1.6 : 1) * (0.8 + Math.random() * 0.4);
  }
  if (mode === 'play' && overlap(P, b) && !hasPower('fire')) hurt();
}

function updateShotsAndProjectiles() {
  const b = L.boss;
  for (const s of G.shots) {
    s.spin += 0.5;
    const tx = b.x + b.w / 2, ty = b.y + b.h / 2, dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
    if (d < 16) {
      s.done = true; b.hp--; b.flash = 36; sfx.hit(); shake(12, 6); G.freeze = 5;
      burst(tx, ty, '#ffd23f', 14, 5); floatText(tx, b.y - 10, 'POW!', '#ffd23f', 34);
      if (b.hp <= 0) { b.dying = 90; L.proj = []; sfx.bossDown(); shake(30, 8); G.slow = 120; G.flash = 1; }
      else L.arena.wait = 45;   // short breather, then a new question
    } else { s.x += dx / d * 13; s.y += dy / d * 13; }
  }
  G.shots = G.shots.filter(s => !s.done);
  if (L.arena && L.arena.wait > 1 && --L.arena.wait === 1 && !b.dying && !b.dead) nextBossQuestion();

  for (const p of L.proj) {
    p.x += p.vx; p.vy += p.g; p.y += p.vy;
    if (p.g && p.y > GR * T - p.r) { p.done = true; burst(p.x, GR * T - 4, p.k === 'rock' ? '#ff6a00' : '#b388ff', 8); }
    if (p.x < -40 || p.x > L.w * T + 40) p.done = true;
    if (!p.done && mode === 'play' && circleHits(p.x, p.y, p.r - 2, P)) { p.done = true; if (hasPower('fire')) burst(p.x, p.y, '#ff6a00', 8); else hurt(); }
  }
  L.proj = L.proj.filter(p => !p.done);

  if (L.prize) {
    const z = L.prize;
    z.vy = Math.min(z.vy + 0.4, 8); z.y += z.vy;
    if (z.y + z.h > GR * T) { z.y = GR * T - z.h; z.vy = 0; }
  }
}

function updateGates() {
  for (const st of L.stations) {
    if (st.opening === null || st.opening < 0) continue;
    st.openT++;
    if (st.openT % 3 !== 0) continue;
    const r = st.opening;
    for (const gc of st.gate) if (L.map[r][gc] === 'G') { L.map[r][gc] = '.'; burst(gc * T + T / 2, r * T + T / 2, L.world.gate[2], 3, 3); }
    st.opening--;
  }
  for (const st of L.stations) {
    for (const a of st.answers) if (a.shake > 0) a.shake--;
    if (st.swap && --st.swap === 0) setStationQ(st, freshQ(st.q.text));
  }
}

function updateWin() {
  const p = P; G.winT++; petTick();
  if (L.boss) {
    p.vx *= 0.8; p.vy = Math.min(p.vy + 0.55, 12); moveX(p); moveY(p);
    if (G.winT === 120) finishLevel();
    return;
  }
  if (G.winT < 50) {
    p.vx *= 0.8; p.vy = Math.min(p.vy + 0.55, 12); moveX(p); moveY(p);   // stop and catch the scroll
  } else {
    p.face = 1; p.vx = 2.6; p.vy = Math.min(p.vy + 0.55, 12);
    moveX(p); moveY(p); p.anim += 0.16;
  }
  if (G.winT === 210) finishLevel();
}

function updateAmbient() {
  const k = L.world.key;
  if ((k === 'japan' || k === 'lava') && ambient.length < 28 && tick % 6 === 0) {
    ambient.push(k === 'japan'
      ? { k: 'petal', x: Math.random() * (VW + 200), y: -10, vx: -0.6 - Math.random() * 0.8, vy: 0.7 + Math.random() * 0.6, a: Math.random() * 6 }
      : { k: 'ember', x: Math.random() * VW, y: VH + 5, vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 1.2, a: Math.random() * 6 });
  }
  for (const p of ambient) { p.a += 0.05; p.x += p.vx + Math.sin(p.a) * 0.4; p.y += p.vy; }
  for (let i = ambient.length - 1; i >= 0; i--) {
    const p = ambient[i];
    if (p.y > VH + 20 || p.y < -20 || p.x < -20 || (p.k === 'petal') !== (k === 'japan')) ambient.splice(i, 1);
  }
}

function finishLevel() {
  mode = 'done';
  const i = G.idx, st = STAGES[i], W = WORLDS[st.w];
  const dots = G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1, sk = G.skill, pts = dots * sk.tier;
  const before = currentBelt();
  if (!prog.best[i] || pts > prog.best[i].pts) prog.best[i] = { pts, dots, tier: sk.tier };
  prog.mastery[sk.id] = Math.max(prog.mastery[sk.id] || 0, dots);
  save();
  const after = currentBelt(), last = i === STAGES.length - 1;
  let title = 'Level complete!', body = '';
  if (st.boss) { title = `You got the ${W.scroll} back!`; body = `<div class="bigicon">📜</div><p>${W.boss.name} is beaten!</p>`; }
  else {

function updateRace(dt) {

  if (r.goT > 0) r.goT -= dt;

    return;

  if (r.finished) r.speed = Math.max(0, r.speed - 2500 * dt);
  else if (r.speed < r.cruise) r.speed = Math.min(r.cruise, r.speed + 1800 * dt);
  else r.speed = Math.max(r.cruise, r.speed - 1100 * dt);
  r.z += r.speed * dt;
  if (!r.finished) r.time += dt;
  r.bg += (r.curves[Math.floor(r.z / SEG)] || 0) * r.speed * dt * 0.00004;
  for (const g of r.gates) if (!g.done && r.z >= g.z) judgeGate(g);
  for (const v of r.rivals) {
    v.speed = Math.min(v.base, v.speed + 1500 * dt);

// A shaded cone with a glowing crater, lava rivers that flow, smoke, and an eruption now and then.
function volcano(x, base, h, i) {

      const x0 = x + sx, y0 = top + 4, x2 = x + ex, y2 = base, x1 = x + cx2, y1 = base - h * 0.45, u = 1 - t;
      return [u * u * x0 + 2 * u * t * x1 + t * t * x2, u * u * y0 + 2 * u * t * y1 + t * t * y2];

// ---------------------------------------------------------------- drawing: tiles
function block(x, y, fill, dark, light) {
  ctx.fillStyle = dark; ctx.fillRect(x, y, T, T);
  ctx.fillStyle = fill; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
  ctx.fillStyle = light; ctx.fillRect(x + 2, y + 2, T - 4, 3); ctx.fillRect(x + 2, y + 2, 3, T - 4);
  ctx.fillStyle = dark;
  [[5, 5], [T - 8, 5], [5, T - 8], [T - 8, T - 8]].forEach(([a, b]) => ctx.fillRect(x + a, y + b, 3, 3));
}

function drawGround(x, y, c, r, top) {
  switch (L.world.key) {
    case 'japan': {
      ctx.fillStyle = '#b97a4a'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#9a5f35'; const h = (c * 73 + r * 31) % 9;
      ctx.fillRect(x + 4 + h, y + 14, 5, 5); ctx.fillRect(x + 24 - h, y + 26, 5, 4);
      if (top) { ctx.fillStyle = '#6fd36f'; ctx.fillRect(x, y, T, 9); ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x, y + 9, T, 3); }
      break;
    }
    case 'lava': {
      ctx.fillStyle = '#241a18'; ctx.fillRect(x, y, T, T);
      const h = (c * 37 + r * 11) % 7, glow = 0.5 + 0.5 * Math.sin(tick * 0.05 + c);
      ctx.fillStyle = `rgba(255,${90 + glow * 60 | 0},0,.8)`; ctx.fillRect(x + 6 + h, y + 18, 4, 4); ctx.fillRect(x + 22 - h, y + 28, 3, 3);
      if (top) {
        ctx.fillStyle = '#3a2a26'; ctx.fillRect(x, y, T, 9);
        ctx.strokeStyle = `rgba(255,${100 + glow * 80 | 0},0,.9)`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x + 10, y + 13); ctx.lineTo(x + 20, y + 10); ctx.lineTo(x + T, y + 12); ctx.stroke();
      }
      break;
    }
    case 'robot': {
      ctx.fillStyle = '#2f3846'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#4a5668'; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
      ctx.fillStyle = '#8a99ad'; [[4, 4], [T - 7, 4], [4, T - 7], [T - 7, T - 7]].forEach(([a, b]) => ctx.fillRect(x + a, y + b, 3, 3));
      if (top) {
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, T, 8); ctx.clip();
        ctx.fillStyle = '#ffd23f'; ctx.fillRect(x, y, T, 8);
        for (let k = -1; k < 4; k++) poly([[x + k * 12, y], [x + k * 12 + 6, y], [x + k * 12 + 14, y + 8], [x + k * 12 + 8, y + 8]], '#222');
        ctx.restore();
      }
      break;
    }
    case 'castle': {
      ctx.fillStyle = '#283055'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#1c2240'; ctx.fillRect(x, y + T / 2, T, 2); ctx.fillRect(x + (r % 2 ? 0 : T / 2), y, 2, T);
      if (top) {
        ctx.fillStyle = '#3c4a80'; ctx.fillRect(x, y, T, 10);
        ctx.fillStyle = '#2a3566';
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + 6 + k * 12, y + 10, 6, Math.PI, 0); ctx.fill(); }
      }
      break;
    }
  }
}

function drawTile(t, x, y, c, r) {
  const W = L.world;
  switch (t) {
    case '#': drawGround(x, y, c, r, L.map[r - 1][c] !== '#'); break;
    case 'B':
      ctx.fillStyle = W.brick[1]; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = W.brick[0];
      ctx.fillRect(x + 1, y + 1, T / 2 - 2, T / 2 - 2); ctx.fillRect(x + T / 2 + 1, y + 1, T / 2 - 2, T / 2 - 2);
      ctx.fillRect(x, y + T / 2 + 1, T / 4 - 1, T / 2 - 2); ctx.fillRect(x + T / 4 + 1, y + T / 2 + 1, T / 2 - 2, T / 2 - 2);
      ctx.fillRect(x + 3 * T / 4 + 1, y + T / 2 + 1, T / 4 - 1, T / 2 - 2);
      break;
    case '?': {
      const glow = 0.5 + 0.5 * Math.sin(tick * 0.1);
      block(x, y, `rgb(247,${170 + glow * 30 | 0},40)`, '#a8600a', '#ffe08a');
      ctx.fillStyle = '#7a3e00'; ctx.font = 'bold 24px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', x + T / 2 + 1, y + T / 2 + 2);
      break;
    }
    case 'U': block(x, y, '#9b6a3c', '#5e3a1c', '#b8875a'); break;
    case 'H':   // invisible, but it twinkles now and then as a hint
      if (tick % 150 < 24) {
        const a = Math.sin((tick % 150) / 24 * Math.PI), cx = x + T / 2, cy = y + T / 2;
        ctx.fillStyle = `rgba(255,255,220,${a})`;
        poly([[cx, cy - 10 * a], [cx + 3, cy - 3], [cx + 10 * a, cy], [cx + 3, cy + 3], [cx, cy + 10 * a], [cx - 3, cy + 3], [cx - 10 * a, cy], [cx - 3, cy - 3]], ctx.fillStyle);
      }
      break;
    case 'S': block(x, y, W.stair[0], W.stair[1], W.stair[2]); break;
    case 'P': case 'Q': case 'p': case 'q': {
      const top = t === 'P' || t === 'Q', left = t === 'P' || t === 'p';
      const x0 = top ? (left ? x - 3 : x) : (left ? x + 2 : x), w = top ? T + 3 : T - 2;
      ctx.fillStyle = W.pipe[1]; ctx.fillRect(x0, y, w, T);
      ctx.fillStyle = W.pipe[0]; ctx.fillRect(x0 + (left ? 2 : 0), y + (top ? 2 : 0), w - 2, T - (top ? 4 : 0));
      if (left) { ctx.fillStyle = W.pipe[2]; ctx.fillRect(x0 + 7, y + (top ? 4 : 0), 5, T - (top ? 8 : 0)); }
      if (W.key === 'japan' && !top) { ctx.fillStyle = W.pipe[1]; ctx.fillRect(x0, y + T / 2 - 1, w, 3); }   // bamboo joints
      break;
    }
    case 'G': {
      const [fill, dark, light, lock] = W.gate;
      ctx.fillStyle = dark; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = fill; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
      ctx.fillStyle = light; ctx.fillRect(x + 2, y + 2, T - 4, 3);
      if (r === GR - 3 || r === GR - 8) {   // padlock
        ctx.strokeStyle = lock; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x + T / 2, y + 15, 6, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = lock; ctx.fillRect(x + T / 2 - 9, y + 15, 18, 13);
        ctx.fillStyle = dark; ctx.fillRect(x + T / 2 - 1.5, y + 19, 3, 5);
      }
      break;
    }
    case 'A': drawAnswer(x, y, c, r); break;
    case 'N': {
      const st = L.bridges.flatMap(b => b.stones).find(t => t.c === c && t.r === r);
      if (!st || st.state !== 'home') { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([4, 4]); ctx.strokeRect(x + 3, y + 3, T - 6, T - 6); ctx.setLineDash([]); break; }
      block(x, y, '#9aa3b5', '#4a5266', '#d5dbe6');
      ctx.fillStyle = '#1f2433'; ctx.font = `bold ${st.val >= 100 ? 15 : 20}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(st.val, x + T / 2, y + T / 2 + 1);
      break;
    }
    case 'b':
      ctx.fillStyle = '#5e3a1c'; ctx.fillRect(x, y, T, 14);
      ctx.fillStyle = '#a8743f'; for (let k = 0; k < 3; k++) ctx.fillRect(x + 1 + k * 12, y + 2, 10, 10);
      ctx.fillStyle = '#d9b26a'; ctx.fillRect(x, y - 10, T, 2);
      break;
    case 'K': {
      const on = !!currentStation();
      if (!on) ctx.globalAlpha = 0.3;
      block(x, y, on ? '#f7b928' : '#9b6a3c', on ? '#a8600a' : '#5e3a1c', on ? '#ffe08a' : '#b8875a');
      ctx.fillStyle = on ? '#5a2a00' : '#3a2410';
      for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) ctx.fillRect(x + 8 + i * 8, y + 8 + j * 8, 5, 5);
      ctx.globalAlpha = 1;
      if (on) {
        ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(tick * 0.15)})`; ctx.lineWidth = 3; ctx.strokeRect(x - 2, y - 2, T + 4, T + 4);
        hudText('Bonk me!', x + T / 2, y - 16 + Math.sin(tick * 0.12) * 3, 15, '#ffd23f', 'center');
      }
      break;
    }
  }
}

function drawAnswer(x, y, c, r) {
  const f = findAnswer(c, r); if (!f) return;
  const { st, a } = f;
  if (a.shake) x += Math.sin(a.shake * 1.6) * 4;
  const cur = st === currentStation();
  if (a.state === 'right') block(x, y, '#2ecc71', '#1e8449', '#8ff0b5');
  else if (a.state === 'wrong') block(x, y, '#e74c3c', '#922b21', '#f1948a');
  else if (a.state === 'done') block(x, y, '#9b6a3c', '#5e3a1c', '#b8875a');
  else block(x, y, '#f7b928', '#a8600a', '#ffe08a');
  if (cur && a.state === 'idle') {
    ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(tick * 0.15)})`; ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, T + 4, T + 4);
  }
  const s = String(a.val);
  ctx.fillStyle = a.state === 'idle' ? '#5a2a00' : '#fff';
  ctx.font = `bold ${s.length >= 3 ? 16 : 22}px "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x + T / 2, y + T / 2 + 1);
  if (a.state === 'wrong') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 7, y + 7); ctx.lineTo(x + T - 7, y + T - 7); ctx.stroke();
  }
}

function drawPits(c0, c1) {
  const kind = L.world.pit;
  if (kind === 'void') return;
  for (let c = c0; c <= c1; c++) {
    if (L.map[GR][c] !== '.' && L.map[GR][c] !== 'b') continue;
    const x = c * T, y = GR * T + 14 + Math.sin(tick * 0.08 + c) * 3;
    if (kind === 'water') {
      ctx.fillStyle = '#3a8fd6'; ctx.fillRect(x, y, T, VH - y);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x + 4, y, T - 14, 3);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, VH);
      g.addColorStop(0, '#ffd23f'); g.addColorStop(0.25, '#ff6a00'); g.addColorStop(1, '#b3200a');
      ctx.fillStyle = g; ctx.fillRect(x, y, T, VH - y);
    }
  }
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(L.w - 1, c0 + Math.ceil(VW / T) + 1);
  for (let c = c0; c <= c1; c++) for (let r = 0; r < ROWS; r++) {
    const t = L.map[r][c]; if (t === '.') continue;
    let y = r * T;
    if (G) { const b = G.bumps.get(c + ',' + r); if (b) y -= Math.sin((10 - b) / 10 * Math.PI) * 9; }
    drawTile(t, c * T, y, c, r);
  }
}

// Bridge signs, the altar, preview planks over the pit, and secret doors.
function drawPuzzles() {
  for (const b of L.bridges) {
    const sx = b.signC * T + 4, sy = (GR - 3.1) * T, sw = 3.5 * T, sh = 1.25 * T;
    if (sx < cam + VW && (b.c0 + b.w) * T > cam) {
      ctx.fillStyle = '#6e4627'; ctx.fillRect(sx + sw / 2 - 4, sy + sh, 8, GR * T - sy - sh);
      ctx.fillStyle = '#5e3a1c'; rrect(sx - 3, sy - 3, sw + 6, sh + 6, 6); ctx.fill();
      ctx.fillStyle = b.done ? '#c8f7d4' : '#f6e1b5'; rrect(sx, sy, sw, sh, 5); ctx.fill();
      ctx.fillStyle = '#3a2200'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 16px "Trebuchet MS", sans-serif'; ctx.fillText(`Bridge needs ${b.target}`, sx + sw / 2, sy + 14);
      ctx.font = 'bold 14px "Trebuchet MS", sans-serif'; ctx.fillText(b.done ? 'Built!' : `So far: ${b.total}`, sx + sw / 2, sy + 32);

      ctx.fillStyle = '#6a6f8a'; ctx.fillRect(ax + 6, ay - 30, T - 12, 30); ctx.fillStyle = '#8a90ad'; ctx.fillRect(ax + 2, ay - 36, T - 4, 8);
      if (!b.done) {
        ctx.fillStyle = `rgba(255,210,63,${0.5 + 0.4 * Math.sin(tick * 0.15)})`; ctx.fillRect(ax + 8, ay - 40, T - 16, 4);
        if (G && G.carry && G.carry.b === b) hudText('Drop here!', ax + T / 2, ay - 56 + Math.sin(tick * 0.12) * 3, 15, '#ffd23f', 'center');
        const built = Math.floor(b.total / b.target * b.w);
        ctx.globalAlpha = 0.45; ctx.fillStyle = '#a8743f';
        for (let c = b.c0; c < b.c0 + built; c++) ctx.fillRect(c * T, GR * T, T - 2, 12);
        ctx.globalAlpha = 1;
      }
