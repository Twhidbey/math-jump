<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninja Parents">
<meta name="theme-color" content="#14142b">
<meta name="robots" content="noindex">
<title>Math Ninja: Parent page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* Math Ninja's parent page (owner, Nov 2026). Notes: docs/parent.md. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #14142b; color: #f4f4f8; font: 600 16px/1.4 Nunito, system-ui, sans-serif; padding: max(14px, env(safe-area-inset-top)) 14px 40px; }
  h1, h2, h3 { font-family: "Lilita One", "Trebuchet MS", sans-serif; font-weight: 400; margin: 0 0 8px; letter-spacing: .3px; }
  h1 { font-size: 26px; color: #ffd23f; }
  h2 { font-size: 22px; }
  h3 { font-size: 17px; color: #cfd2ff; margin-top: 14px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card { background: #232347; border: 2px solid #3a3a6e; border-radius: 16px; padding: 16px; margin: 14px 0; }
  .muted { color: #a9abd0; font-size: 14px; }
  .btn { font: 18px "Lilita One", "Trebuchet MS", sans-serif; border: 0; border-radius: 12px; padding: 10px 16px; background: #ffd23f; color: #2a1a00; cursor: pointer; }
  .btn.alt { background: #3a3a6e; color: #fff; }
  .btn.small { font-size: 15px; padding: 7px 12px; }
  .btn.stop { background: #ff6b6b; color: #fff; }
  .btn:disabled { opacity: .45; }
  input { font: 800 22px Nunito, sans-serif; padding: 10px 12px; border-radius: 12px; border: 2px solid #4a4a86; background: #14142b; color: #fff; width: 100%; letter-spacing: 2px; text-transform: uppercase; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .code { font: 34px "Lilita One", sans-serif; letter-spacing: 4px; color: #ffd23f; }
  .kidhead { display: flex; align-items: center; gap: 12px; }
  .kidhead img { width: 56px; height: 56px; image-rendering: pixelated; background: #14142b; border-radius: 12px; }
  .kidhead .nm { flex: 1; }
  .linkish { background: none; border: 0; color: #9fb0ff; font: 700 14px Nunito, sans-serif; text-decoration: underline; cursor: pointer; padding: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #6a6c90; margin-right: 6px; }
  .dot.on { background: #3ae374; box-shadow: 0 0 8px #3ae374; }
  .week { display: flex; gap: 6px; align-items: flex-end; height: 90px; margin-top: 8px; }
  .week div { flex: 1; text-align: center; font-size: 12px; color: #a9abd0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .week i { display: block; background: #4cc9f0; border-radius: 6px 6px 2px 2px; min-height: 3px; margin-bottom: 4px; }
  .week i.over { background: #ff8c1a; }
  .week .today i { background: #ffd23f; }
  .switch { position: relative; width: 58px; height: 32px; border-radius: 16px; background: #3a3a6e; border: 0; cursor: pointer; flex: none; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: #2ecc71; }
  .switch.on::after { left: 30px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 2px solid #4a4a86; background: #14142b; color: #fff; border-radius: 999px; padding: 6px 12px; font: 800 15px Nunito, sans-serif; cursor: pointer; }
  .chip.on { background: #ffd23f; color: #2a1a00; border-color: #ffd23f; }
  .fact { border-radius: 10px; padding: 4px 10px; font-weight: 800; font-size: 15px; }
  .fact.weak { background: #4a1f2e; color: #ffb3c3; }
  .fact.slow { background: #4a3a1a; color: #ffd9a0; }
  .trk { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 15px; }
  .bar { height: 12px; border-radius: 6px; background: #14142b; overflow: hidden; }
  .bar b { display: block; height: 100%; background: linear-gradient(90deg, #2ecc71, #a6f06b); }
  .trk small { grid-column: 2 / 4; margin-top: -4px; color: #a9abd0; font-size: 13px; }
  ul.sugg { padding-left: 20px; margin: 6px 0 0; }
  ul.sugg li { margin: 6px 0; }
  .left { font-weight: 900; }
  .left.out { color: #ff8c8c; }
  .pinpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; margin-top: 14px; }
  .pinpad button { height: 60px; font: 26px "Lilita One", sans-serif; border-radius: 14px; border: 0; background: #3a3a6e; color: #fff; }
  .pins { text-align: center; font: 34px "Lilita One", sans-serif; letter-spacing: 12px; min-height: 44px; color: #ffd23f; }
  .err { color: #ff8c8c; font-weight: 800; }
  /* tap to open the detail (owner, Nov 2026) */
  details > summary { cursor: pointer; list-style: none; position: relative; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: '›'; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font: 22px "Lilita One", sans-serif; color: #9fb0ff; transition: transform .15s; }
  details[open] > summary::after { transform: translateY(-50%) rotate(90deg); }
  details > summary .trk, details > summary .week, details > summary .sk { margin-right: 20px; }
  .more { background: #1b1b3a; border-radius: 12px; padding: 10px 12px; margin: 6px 0 10px; font-size: 15px; }
  .sk { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 4px 0; }
  .sk .ic { text-align: center; font-weight: 900; }
  .sk .ic.pass { color: #ffd23f; } .sk .ic.now { color: #3ae374; } .sk .ic.later { color: #6a6c90; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .fc { border: 0; border-radius: 8px; padding: 5px 8px; font: 800 14px Nunito, sans-serif; cursor: pointer; color: #1a1426; }
  .fc.gold { background: #ffd23f; } .fc.silver { background: #cfd6e4; } .fc.tricky { background: #ff8c9a; } .fc.new { background: #3a3a6e; color: #cfd2ff; }
  .fc.sel { outline: 3px solid #fff; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #a9abd0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .finfo { background: #2c2c5a; border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
  .finfo b { font-size: 18px; }
  .day { padding: 6px 0; border-top: 1px solid #2f2f5c; }
  .day:first-child { border-top: 0; }
  .lv { font-size: 14px; color: #cfd2ff; margin-left: 10px; }
  .tries i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 3px; background: #3a3a6e; }
  .tries i.y { background: #3ae374; }
  .fact { cursor: pointer; border: 0; font-family: Nunito, sans-serif; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(() => {
  // Math Ninja's parent page (owner, Nov 2026): play time, a daily time limit, math level and suggestions for each kid.
  // Everything lives in the game's team database under families/<code>: kids/<kidId> (the game's reports: numbers, the
  // grade and the picture, never a name) and limits/<kidId>. Kids' names and the PIN stay on this phone only.
  const DB = 'https://math-ninja-team-default-rtdb.firebaseio.com';
  const ABC = 'BCDFGHJKLMNPRSTVWXZ2345679';
  const LS = 'mathninja-parent';
  let st = {}; try { st = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { st = {}; }
  st.names = st.names || {};
  const keep = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) { /* no storage */ } };
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const url = p => `${DB}/families/${st.fam}${p}.json`;
  const dayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const mins = s => { const m = Math.round((s || 0) / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const ago = t => { const s = (Date.now() - t) / 1000; return s < 3600 ? `${Math.max(1, Math.round(s / 60))} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`; };
  let data = null, unlocked = sessionStorage.getItem('mn-parent-ok') === '1', timer = null, msg = '';
  let openSet = new Set(); try { openSet = new Set(JSON.parse(sessionStorage.getItem('mn-parent-open')) || []); } catch (e) { /* none */ }
  const sel = {};   // kid -> { key, where }: the fact tapped, and which list it was tapped in
  const dt = (id, key, sum, body) => `<details data-o="${esc(id + ':' + key)}"${openSet.has(id + ':' + key) ? ' open' : ''}><summary>${sum}</summary>${body}</details>`;
  const STATUS = { gold: 'Knows it by heart (right and fast on two different days).', silver: 'Right and fast once. One more good day makes it gold.', tricky: 'Missed it last time. It keeps coming back in levels until it is right and fast twice.', new: 'Not seen yet.' };
  function factInfo(f) {
    if (!f) return '';
    const seen = f.ago < 0 ? 'never' : f.ago === 0 ? 'today' : f.ago === 1 ? 'yesterday' : `${f.ago} days ago`;
    return `<div class="finfo"><b>${esc(f.t)} = ${esc(f.a)}</b><div>${esc(STATUS[f.s] || '')}</div>
      <div class="muted">Right and fast: ${+f.ok || 0} · Wrong: ${+f.miss || 0} · Last seen: ${seen}${f.slow ? ' · Gets it right but slowly (probably counting)' : ''}</div></div>`;
  }
  function factGrid(id, where, keys, facts) {
    const s = sel[id] && sel[id].where === where ? sel[id].key : null;
    return `<div class="grid">${keys.map(k => { const f = facts[k]; return f ? `<button class="fc ${esc(f.s)}${k === s ? ' sel' : ''}" data-fact="${esc(k)}" data-where="${esc(where)}">${esc(f.t)}</button>` : ''; }).join('')}</div>${s ? factInfo(facts[s]) : ''}`;
  }
  function trackBody(id, t, facts) {
    if (!t) return '<div class="more muted">More detail shows up after the next level they play.</div>';
    return `<div class="more">${t.skills.map(sk => {
      const ic = sk.st === 'pass' ? '✓' : sk.st === 'now' ? '▶' : '·', line = `<div class="sk"><span class="ic ${esc(sk.st)}">${ic}</span><span>${esc(sk.n)}</span><span class="muted">${sk.st === 'pass' ? 'passed' : `${+sk.gold || 0} gold / ${+sk.of || 0}`}</span></div>`;
      const body = sk.f ? factGrid(id, 'sk:' + sk.id, sk.f, facts) : sk.win ? `<div class="tries">Last ${sk.win.length} tries: ${sk.win.map(x => `<i class="${x ? 'y' : ''}"></i>`).join('')} <span class="muted">(green = right and fast)</span></div>` : '';
      return sk.st === 'now' ? `${line}${body}` : body ? dt(id, 'sk:' + sk.id, line, body) : line;
    }).join('')}<div class="legend"><span><i style="background:#ffd23f"></i>gold</span><span><i style="background:#cfd6e4"></i>silver</span><span><i style="background:#ff8c9a"></i>tricky</span><span><i style="background:#3a3a6e"></i>not seen yet</span> · tap a fact for more</div></div>`;
  }
  function timeBody(d) {
    if (!d) return '<div class="more muted">More detail shows up after the next level they play.</div>';
    const list = []; for (let i = 0; i < 14; i++) { const x = new Date(); x.setDate(x.getDate() - i); list.push([dayStr(x), x]); }
    return `<div class="more">${list.map(([k, x], i) => {
      const lv = (d.plog || []).filter(e => e.d === k), s = (d.days || {})[k] || 0;
      if (!s && !lv.length) return '';
      return `<div class="day"><b>${i === 0 ? 'Today' : i === 1 ? 'Yesterday' : x.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</b> · ${mins(s)}
        ${lv.map(e => `<div class="lv">${esc(e.t)} · ${esc(e.n)}${e.sk ? ` <span class="muted">(${esc(e.sk)})</span>` : ''}: ${+e.r || 0} right, ${+e.w || 0} wrong · ${e.won ? `${'●'.repeat(+e.dots || 0)}${'○'.repeat(3 - (+e.dots || 0))}` : 'ran out of hearts'}</div>`).join('')}</div>`;
    }).join('') || '<span class="muted">No play in the last 14 days.</span>'}<p class="muted" style="margin:6px 0 0">Levels played are listed from Nov 20, 2026 on.</p></div>`;
  }
  function progBody(d) {
    if (!d) return '<div class="more muted">More detail shows up after the next level they play.</div>';
    return `<div class="more">
      <div>${+d.gems || 0} gems saved · ${+d.gates || 0} gates opened · ${+d.golden || 0} golden gems</div>
      <h3>Levels won (${(d.levels || []).length})</h3>${(d.levels || []).map(l => `<div class="lv" style="margin-left:0">${esc(l.n)} ${'●'.repeat(+l.dots || 0)}${'○'.repeat(Math.max(0, 3 - (+l.dots || 0)))}${l.gold ? ' · golden gem' : ''}</div>`).join('') || '<span class="muted">None yet</span>'}
      <h3>Almost there</h3>${(d.close || []).map(b => `<div class="lv" style="margin-left:0"><b>${esc(b.n)}</b>: ${+b.now} / ${+b.need} <span class="muted">· ${esc(b.t)}</span></div>`).join('') || '<span class="muted">Nothing close yet</span>'}
      <h3>Badges (${(d.badges || []).length})</h3><div class="chips">${(d.badges || []).map(b => `<span class="chip" style="cursor:default">${esc(b)}</span>`).join('') || '<span class="muted">None yet</span>'}</div>
      <h3>Lost friends rescued</h3><div>${(d.friends || []).map(esc).join(', ') || '<span class="muted">None yet</span>'}</div></div>`;
  }

  function setup() {   // no family yet: make one, or join one made on another phone
    app.innerHTML = `<h1>Math Ninja · Parent page</h1>
      <div class="card"><h2>Set up</h2>
        <p>See how long your kids play, set a daily time limit, and see how their math is going.</p>
        <div class="row"><button class="btn" id="make">Make a family code</button></div>
        <h3>Already made one on another phone?</h3>
        <input id="have" maxlength="8" placeholder="Family code" autocomplete="off">
        <div class="row"><button class="btn alt" id="join">Use this code</button></div>
        <p class="err">${esc(msg)}</p></div>`;
    document.getElementById('make').onclick = async () => {
      let code;
      for (let i = 0; i < 5; i++) {
        code = Array.from({ length: 8 }, () => ABC[Math.floor(Math.random() * ABC.length)]).join('');
        const used = await fetch(`${DB}/families/${code}/made.json`).then(r => r.json()).catch(() => 'x');
        if (used === 'x') { msg = "Couldn't reach the internet. Try again."; return setup(); }
        if (!used) break;
      }
      const ok = await fetch(`${DB}/families/${code}/made.json`, { method: 'PUT', body: JSON.stringify({ '.sv': 'timestamp' }) }).then(r => r.ok).catch(() => false);
      if (!ok) { msg = "Couldn't make the code. Try again."; return setup(); }
      st.fam = code; keep(); msg = ''; route();
    };
    document.getElementById('join').onclick = async () => {
      const c = document.getElementById('have').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!/^[A-Z0-9]{8}$/.test(c)) { msg = 'A family code has 8 letters and numbers.'; return setup(); }
      const made = await fetch(`${DB}/families/${c}/made.json`).then(r => r.json()).catch(() => null);
      if (!made) { msg = "That code wasn't found."; return setup(); }
      st.fam = c; keep(); msg = ''; route();
    };
  }

  function pinScreen(making) {   // a 4-digit PIN, so a kid who finds this page can't change their own limit
    let typed = '', first = null;
    const draw = (txt) => {
      app.innerHTML = `<h1>Math Ninja · Parent page</h1><div class="card"><h2>${making ? (first ? 'Type it again' : 'Choose a 4-digit PIN') : 'Parent PIN'}</h2>
        <p class="muted">${making ? "You type it each time you open this page. The kids' games ask for it too, before anyone switches or adds a player." : ''}</p>
        <div class="pins">${'●'.repeat(typed.length)}</div><p class="err" style="text-align:center">${esc(txt || '')}</p>
        <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>
        ${making ? '' : '<div class="row" style="justify-content:center"><button class="linkish" id="forgot">Forgot the PIN?</button></div>'}</div>`;
      app.querySelectorAll('.pinpad button').forEach(b => b.onclick = () => press(b.dataset.k));
      const f = document.getElementById('forgot');
      if (f) f.onclick = () => {
        const c = (prompt('Type your family code to choose a new PIN:') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (c && c === st.fam) { delete st.pin; keep(); route(); } else if (c) alert("That's not the family code.");
      };
    };
    const press = k => {
      if (k === '⌫') typed = typed.slice(0, -1); else if (typed.length < 4) typed += k;
      if (typed.length < 4) return draw();
      if (making) {
        if (!first) { first = typed; typed = ''; return draw(); }
        if (typed !== first) { first = null; typed = ''; return draw("They didn't match. Try again."); }
        st.pin = typed; delete st.pinSent; keep(); unlocked = true; sessionStorage.setItem('mn-parent-ok', '1'); return route();
      }
      if (typed === st.pin) { unlocked = true; sessionStorage.setItem('mn-parent-ok', '1'); return route(); }
      typed = ''; draw('Wrong PIN');
    };
    draw();
  }

  async function load() {
    try { const d = await fetch(url('')).then(r => r.json()); if (d) data = d; } catch (e) { /* offline: keep showing the last data */ }
    render();
  }

  function weekHTML(days) {
    const list = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); list.push([dayStr(d), d]); }
    const max = Math.max(1800, ...list.map(([k]) => (days || {})[k] || 0));
    return `<div class="week">${list.map(([k, d], i) => { const s = (days || {})[k] || 0;
      return `<div class="${i === 6 ? 'today' : ''}"><i style="height:${Math.round(s / max * 64)}px"></i>${i === 6 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })}<br>${Math.round(s / 60)}m</div>`; }).join('')}</div>`;
  }

  function kidHTML(id, k, lm) {
    const name = st.names[id] || 'Unnamed player', m = k.math || {}, today = (k.days || {})[dayStr()] || 0;
    const live = k.seen && Date.now() - k.seen < 150000;
    const pic = typeof k.pic === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(k.pic) ? k.pic : '';
    const on = !!(lm && lm.on), lmins = lm && lm.mins || 30, extra = lm && lm.extra && lm.extra.day === dayStr() ? lm.extra.mins || 0 : 0;
    const left = on ? (lmins + extra) * 60 - today : null, stopped = !!(lm && lm.stop === dayStr());
    const d = (data && data.detail || {})[id], facts = (d && d.facts) || {};
    const keyOf = txt => Object.keys(facts).find(k => `${facts[k].t} = ${facts[k].a}` === txt);
    const chips = (list, cls, where) => `<div class="chips">${list.map(f => { const k = keyOf(f); return `<button class="fact ${cls}${sel[id] && sel[id].where === where && sel[id].key === k ? ' sel' : ''}" ${k ? `data-fact="${esc(k)}" data-where="${where}"` : ''}>${esc(f)}</button>`; }).join('')}</div>${sel[id] && sel[id].where === where ? factInfo(facts[sel[id].key]) : ''}`;
    const tracks = (m.tracks || []).map((t, i) => dt(id, 'trk' + i, `<div class="trk"><span>${esc(t.n)}</span><span class="bar"><b style="width:${Math.max(0, Math.min(100, +t.p || 0))}%"></b></span><span>${+t.p || 0}%</span>
      <small>${t.now ? `Now: ${esc(t.now)}${t.wait ? ' (needs one more good day)' : ''}${t.lock ? ' (comes later)' : ''}` : 'Done!'}</small></div>`, trackBody(id, d && (d.tracks || []).find(x => x.n === t.n), facts))).join('');
    return `<div class="card" data-kid="${esc(id)}">
      <div class="kidhead">${pic ? `<img src="${pic}" alt="">` : ''}<div class="nm"><h2>${esc(name)}</h2>
        <div class="muted"><span class="dot ${live ? 'on' : ''}"></span>${live ? (k.where ? `Playing now: ${esc(k.where)}` : 'In the game now') : k.seen ? `Last played ${ago(k.seen)}` : 'Not played yet'}</div></div>
        <button class="linkish" data-act="name">${st.names[id] ? 'Rename' : 'Name'}</button></div>
      <div class="row">${stopped ? `<span class="left out">Stopped: the game ends after this level</span><button class="btn small alt" data-act="go">Let them play</button>` : '<button class="btn small stop" data-act="stop">Stop after this level</button>'}</div>
      <h3>Play time</h3>
      <div><b>Today: ${mins(today)}</b> <span class="muted">· this week ${mins(Object.entries(k.days || {}).reduce((a, [, s]) => a + (+s || 0), 0))}</span></div>
      ${dt(id, 'time', weekHTML(k.days), timeBody(d))}
      <h3>Daily time limit</h3>
      <div class="row" style="margin-top:0"><button class="switch ${on ? 'on' : ''}" data-act="limit" aria-label="Time limit"></button>
        <span>${on ? `<span class="left ${left <= 0 ? 'out' : ''}">${left <= 0 ? "Time's up for today" : `${mins(left)} left today`}</span>` : '<span class="muted">Off: no limit</span>'}</span></div>
      ${on ? `<div class="chips">${[15, 20, 30, 45, 60, 90].map(n => `<button class="chip ${n === lmins ? 'on' : ''}" data-act="mins" data-n="${n}">${n} min</button>`).join('')}</div>
        <div class="row"><button class="btn small" data-act="extra">+15 min today</button>${extra ? `<span class="muted">+${extra} min added today</span>` : ''}</div>
        <p class="muted">When time runs out, ${esc(name === 'Unnamed player' ? 'they' : name)} can finish the level they're in, then the game says "Time's up for today!" until tomorrow.</p>` : ''}
      <h3>Math</h3>
      <div>${m.grade ? `<b>${esc(m.grade)}</b> · ` : ''}${esc(m.belt || '')} belt · ${+m.levels || 0} levels won · ${+m.gold || 0} facts known by heart</div>
      ${m.skill ? `<div class="muted">Playing with: ${esc(m.skill)} (${+m.skillP || 0}% learned)</div>` : ''}
      ${tracks}
      ${!m.tracks || !m.tracks.length ? (d && d.tracks ? d.tracks.map((t, i) => dt(id, 'trk' + i, `<div><b>${esc(t.n)}</b></div>`, trackBody(id, t, facts))).join('') : '') : ''}
      ${(m.weak || []).length ? `<h3>Still tricky</h3>${chips(m.weak, 'weak', 'weak')}` : ''}
      ${(m.slow || []).length ? `<h3>Right, but slow</h3>${chips(m.slow, 'slow', 'slow')}` : ''}
      ${dt(id, 'prog', `<h3 style="margin:14px 0 0">Progress</h3><div class="muted">${d ? `${plural((d.levels || []).length, 'level')} won · ${plural((d.badges || []).length, 'badge')} · ${plural((d.friends || []).length, 'friend')} rescued` : 'Levels, badges and friends'}</div>`, progBody(d))}
      ${(k.sugg || []).length ? `<h3>Suggestions</h3><ul class="sugg">${k.sugg.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <div class="row"><button class="linkish" data-act="remove">Remove this player from the page</button></div>
    </div>`;
  }

  function render() {
    const kids = Object.entries((data && data.kids) || {}).sort((a, b) => (b[1].seen || 0) - (a[1].seen || 0)), limits = (data && data.limits) || {};
    const anyOn = kids.some(([id]) => !(limits[id] && limits[id].stop === dayStr()));
    app.innerHTML = `<h1>Math Ninja · Parent page</h1>
      ${kids.length > 1 ? `<div class="row">${anyOn ? '<button class="btn stop" id="stopAll">Stop everyone after this level</button>' : '<button class="btn alt" id="goAll">Let everyone play</button>'}</div>` : ''}
      ${kids.map(([id, k]) => kidHTML(id, k, limits[id])).join('')}
      <div class="card"><h2>Add a device</h2>
        <p>On each kid's iPhone or iPad, open Math Ninja, then <b>Settings → Parent page</b>, and type this code:</p>
        <div class="code">${esc(st.fam)}</div>
        <p class="muted">Once linked, switching or adding players in the game needs your parent PIN. Each player on that device shows up here after they play for a minute. Only play time, math and their picture are sent; names stay on this phone.</p></div>
      <div class="row"><button class="linkish" id="lock">Lock this page</button></div>`;
    const all = async stop => {
      for (const [id] of kids) { const v = { on: false, mins: 30, ...(limits[id] || {}) }; if (stop) v.stop = dayStr(); else delete v.stop; limits[id] = v; }
      data.limits = limits; render();
      await Promise.all(kids.map(([id]) => fetch(url(`/limits/${id}`), { method: 'PUT', body: JSON.stringify(limits[id]) }))).catch(() => alert("Couldn't save. Check the internet."));
    };
    if (document.getElementById('stopAll')) document.getElementById('stopAll').onclick = () => all(true);
    if (document.getElementById('goAll')) document.getElementById('goAll').onclick = () => all(false);
    document.getElementById('lock').onclick = () => { unlocked = false; sessionStorage.removeItem('mn-parent-ok'); route(); };
    app.querySelectorAll('details[data-o]').forEach(el => el.addEventListener('toggle', () => {
      if (el.open) openSet.add(el.dataset.o); else openSet.delete(el.dataset.o);
      try { sessionStorage.setItem('mn-parent-open', JSON.stringify([...openSet])); } catch (e) { /* none */ }
    }));
    app.querySelectorAll('[data-kid]').forEach(card => {
      card.querySelectorAll('[data-fact]').forEach(b => b.onclick = e => {
        e.preventDefault(); const id = card.dataset.kid, cur = sel[id];
        sel[id] = cur && cur.key === b.dataset.fact && cur.where === b.dataset.where ? null : { key: b.dataset.fact, where: b.dataset.where }; render();
      });
      const id = card.dataset.kid, lm = { on: false, mins: 30, ...(limits[id] || {}) };
      const put = async v => { limits[id] = v; data.limits = limits; render(); await fetch(url(`/limits/${id}`), { method: 'PUT', body: JSON.stringify(v) }).catch(() => alert("Couldn't save. Check the internet.")); };
      card.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
        const act = b.dataset.act;
        if (act === 'name') { const n = prompt("This player's name (only kept on this phone):", st.names[id] || ''); if (n != null) { st.names[id] = n.trim().slice(0, 20); keep(); render(); } }
        if (act === 'limit') put({ ...lm, on: !lm.on });
        if (act === 'stop') put({ ...lm, stop: dayStr() });
        if (act === 'go') { const v = { ...lm }; delete v.stop; put(v); }
        if (act === 'mins') put({ ...lm, on: true, mins: +b.dataset.n });
        if (act === 'extra') { const ex = lm.extra && lm.extra.day === dayStr() ? lm.extra.mins || 0 : 0; put({ ...lm, extra: { day: dayStr(), mins: ex + 15 } }); }
        if (act === 'remove' && confirm('Remove this player from the page? (If they play again on a linked device, they come back.)')) {
          delete data.kids[id]; delete limits[id]; render();
          fetch(url(`/kids/${id}`), { method: 'DELETE' }).catch(() => {}); fetch(url(`/limits/${id}`), { method: 'DELETE' }).catch(() => {});
        }
      });
    });
  }

  async function sendPin() {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`mn:${st.fam}:${st.pin}`));
      const h = [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
      const ok = await fetch(url('/pin'), { method: 'PUT', body: JSON.stringify(h) }).then(r => r.ok);
      if (ok) { st.pinSent = st.fam; keep(); }
    } catch (e) { /* try again next time */ }
  }
  function route() {
    clearInterval(timer);
    if (!st.fam) return setup();
    if (!st.pin) return pinScreen(true);
    if (!unlocked) return pinScreen(false);
    if (st.pinSent !== st.fam) sendPin();   // the kids' games check the PIN against this (a hash, never the PIN itself)
    app.innerHTML = '<h1>Math Ninja · Parent page</h1><p class="muted">Loading...</p>';
    load(); timer = setInterval(load, 20000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && unlocked && st.fam && st.pin) load(); });
  route();
})();
</script>
</body>
</html>
